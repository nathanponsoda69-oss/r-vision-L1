.cp-prg{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}
.cp-prg summary{cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);list-style:none;}
.cp-prg summary::-webkit-details-marker{display:none;}
.cp-prg summary::after{content:'  +';color:var(--t3);}
.cp-prg[open] summary::after{content:'  −';}
.ovl-r{font-size:12px;line-height:1.7;color:var(--t2);margin-top:10px;}
.ovl-rep{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.ovl-rep li{font-size:10.5px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--t2);}
.ovl-close{position:fixed;top:30px;right:40px;font-family:var(--mono);font-size:12px;color:#fff;background:none;border:0;padding:10px 16px;cursor:pointer;}
.ovl-close::before,.ovl-close::after{content:'';position:absolute;top:0;bottom:0;width:8px;border:1px solid #fff;}
.ovl-close::before{left:0;border-right:0;}.ovl-close::after{right:0;border-left:0;}
.ovl-close:focus{outline:none;}.ovl-close:focus-visible{text-decoration:underline;}
@media(max-width:700px){.ovl-close{top:16px;right:16px;}.ovl-in{padding-top:70px;}.ovl-c li{grid-template-columns:10px minmax(0,1fr) 44px 36px 54px;}}

/* Menu dev (?dev) */
#devm{position:fixed;right:16px;top:16px;z-index:70;width:330px;max-height:calc(100vh - 32px);overflow:auto;font-family:var(--mono);font-size:10px;color:#fff;
  background:rgba(20,16,14,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);}
#devm.hid{display:none;}
#devm .dm-h{display:flex;justify-content:space-between;width:100%;font:inherit;font-weight:700;letter-spacing:.08em;color:#fff;background:none;border:0;padding:10px 12px;cursor:pointer;text-align:left;}
#devm.min .dm-b{display:none;}
#devm .dm-b{padding:0 12px 12px;display:flex;flex-direction:column;gap:7px;}
#devm .dm-k{margin-top:6px;opacity:.75;letter-spacing:.06em;text-transform:uppercase;}
#devm .dm-k b{color:#fff;opacity:1;margin-left:6px;}#devm .dm-k i{font-style:normal;opacity:.7;text-transform:none;}
#devm .dm-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
#devm .dm-row>button{flex:1 1 auto;font:inherit;color:#fff;background:none;border:1px solid rgba(255,255,255,.3);padding:5px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;}
#devm .dm-row>button small{font-size:8px;opacity:.65;}
#devm .dm-row>button:hover,#devm .dm-row>button.on{background:#fff;color:#2a201c;}
#devm input[type=range]{flex:1;accent-color:#fff;}
#devm label{display:flex;align-items:center;gap:5px;cursor:pointer;opacity:.85;}
#devm b#dm-mv{min-width:5ch;text-align:right;}
.capture #devm{display:none;}
@media(max-width:700px){#devm{width:calc(100% - 24px);right:12px;top:auto;bottom:12px;max-height:55vh;}}
#gllost{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:80;font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:8px 14px;letter-spacing:.04em;}
/* grottes : le panneau sur le côté, la scène reste visible */
#ovl.cave{inset:0 0 0 auto;width:min(430px,38vw);background:linear-gradient(90deg,rgba(9,10,13,.8),rgba(9,10,13,.95) 12%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .45s ease;border-left:1px solid rgba(255,255,255,.1);overflow-y:auto;overscroll-behavior:contain;}
#ovl.cave.on{transition:opacity .9s ease 1s;}
#ovl.cave .ovl-in{width:auto;padding:90px 26px 44px 30px;}
#ovl.cave .ovl-t{font-size:clamp(20px,2vw,27px);}
#ovl.cave .ovl-close{top:28px;right:26px;}
#hud.incave .farr,#hud.incave #fcar,#hud.incave #idx,#hud.incave #demo{opacity:0!important;pointer-events:none!important;}
#cave-tip{position:fixed;left:0;top:0;z-index:35;pointer-events:none;font-family:var(--mono);color:#fff;opacity:0;transition:opacity .25s;display:flex;flex-direction:column;gap:4px;text-shadow:0 1px 8px rgba(0,0,0,.5);}
#cave-tip.on{opacity:1;}#cave-tip b{font-size:13px;font-weight:700;letter-spacing:.02em;}#cave-tip span{font-size:10.5px;letter-spacing:.06em;opacity:.85;}#cave-tip i{font-style:normal;font-size:10.5px;opacity:.9;}
#cave-hint{position:fixed;left:40px;bottom:64px;z-index:35;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.8);letter-spacing:.06em;opacity:0;transition:opacity .8s;pointer-events:none;}
#cave-hint.on{opacity:1;}
@media(max-width:700px){#ovl.cave{inset:auto 0 0 0;width:auto;height:52vh;border-left:0;border-top:1px solid rgba(255,255,255,.12);background:rgba(9,10,13,.94);}#ovl.cave .ovl-in{padding:56px 18px 30px;}#ovl.cave .ovl-close{top:12px;right:12px;}#cave-hint{left:16px;bottom:calc(52vh + 14px);}}
#wall-tip{position:fixed;left:0;top:0;z-index:35;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:#fff;background:rgba(20,12,8,.72);padding:7px 10px;max-width:360px;line-height:1.5;opacity:0;transition:opacity .2s;}
#wall-tip.on{opacity:1;}

/* ═══ Mur de statistiques : écrans HTML projetés sur les dalles de glace ═══ */
#wallui{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden;}
.wp{position:absolute;left:0;top:0;transform-origin:0 0;visibility:hidden;opacity:0;pointer-events:none;overflow:hidden;
  font-family:var(--mono);color:#f4efe8;line-height:1.35;font-size:13px;
  background:linear-gradient(180deg,rgba(24,18,16,.9),rgba(14,11,10,.93));border:1px solid rgba(255,236,214,.16);border-radius:.9em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;padding:1.15em 1.5em 1em;
  --t2:rgba(244,239,232,.7);--t3:rgba(244,239,232,.46);--ln:rgba(255,255,255,.09);--acc:#ffc58a;}
.wp *{box-sizing:border-box;}
.wp.noanim *{transition:none!important;}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:1em;padding-bottom:.7em;border-bottom:1px solid var(--ln);margin-bottom:.9em;flex:none;}
.wh .dm{padding:.15em .5em;border-radius:.3em;background:rgba(255,197,138,.16);color:var(--acc);letter-spacing:.1em;}
.wh p{display:flex;align-items:baseline;gap:.9em;font-size:.82em;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
.wh b{font-family:var(--logo);font-weight:800;font-size:1.35em;letter-spacing:.04em;color:#fff;}
.wh .r b{font-family:var(--mono);font-size:1em;font-weight:700;color:var(--t2);}
.wb{flex:1;min-height:0;display:grid;gap:1.2em;}
.wp h4{font-size:.78em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);margin-bottom:.7em;display:flex;align-items:center;justify-content:space-between;gap:.8em;}
.wp h4 em{font-style:normal;font-weight:700;color:var(--t3);}
.wp .dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 .6em color-mix(in srgb,var(--c) 60%,transparent);}
.wdemo{position:absolute;right:1.6em;bottom:.55em;font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
/* anneau */
.ring{position:relative;aspect-ratio:1;width:100%;}
.ring svg{width:100%;height:100%;display:block;overflow:visible;}
.ring .seg{transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1) var(--d,0s);}
.ring .seg:hover{stroke-width:11;}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;}
.rc .rv{display:flex;align-items:baseline;gap:.05em;}
.rc b{font-family:var(--logo);font-weight:800;font-size:2.6em;line-height:1;color:#fff;}
.rc i{font-style:normal;font-family:var(--logo);font-weight:700;font-size:1.1em;color:var(--t2);}
.rc small{display:block;margin-top:.35em;font-size:.66em;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);}
/* tuiles */
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;}
.kp div{padding:.6em .7em;border-radius:.55em;background:rgba(255,255,255,.04);border:1px solid var(--ln);min-width:0;}
.kp small{display:block;font-size:.7em;letter-spacing:.06em;color:var(--t3);margin-bottom:.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kp b{font-family:var(--logo);font-weight:700;font-size:1.08em;white-space:nowrap;}
.kp.k4{grid-template-columns:repeat(4,1fr);}
.kp .bad b{color:#ff7a7a;}.kp .ok b{color:#6fe0a0;}
/* 1 · vue d'ensemble */
.ov{grid-template-columns:minmax(0,.9fr) minmax(0,1.5fr);}
.ov-l{display:flex;flex-direction:column;gap:1em;min-width:0;}
.ov-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1em;align-items:center;}
.ov-hero .ring{max-width:13em;justify-self:center;}
.ov-l .kp{margin-top:auto;}
.ov-r .wt{flex:1;}.ov-r .wt-r{flex:1;}
.ov-rk small{display:block;font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);}
.ov-rk b{display:block;font-family:var(--logo);font-weight:800;font-size:1.45em;color:var(--acc);margin:.15em 0 .45em;}
.ov-rk span{display:block;font-size:.84em;color:var(--t2);line-height:1.6;}
.ov-r{display:flex;flex-direction:column;gap:.8em;min-width:0;}
.wt{display:flex;flex-direction:column;}
.wt-h,.wt-r{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) 5.2em 5.4em;gap:1em;align-items:center;}
.wt-h{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);padding:0 .7em .5em;border-bottom:1px solid var(--ln);}
.wt-r{font:inherit;color:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--ln);padding:.48em .7em;cursor:pointer;border-radius:.4em;transition:background .2s;}
.wt-r:hover{background:rgba(255,255,255,.06);}
.wt .r{text-align:right;font-variant-numeric:tabular-nums;}
.wt-r .r{font-size:.95em;}.wt-r .r small{color:var(--t3);font-size:.85em;}
.wt-r .nm{display:flex;align-items:center;gap:.7em;min-width:0;}
.wt-r .nm>span{min-width:0;}
.wt-r .nm b{display:block;font-weight:700;font-size:.98em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wt-r .nm small{display:block;font-size:.68em;letter-spacing:.06em;color:var(--t3);margin-top:.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wt-r .ms{display:flex;align-items:center;gap:.7em;}
.wt-r .bar{flex:1;height:.62em;border-radius:1em;background:rgba(255,255,255,.08);overflow:hidden;}
.wt-r .bar i{display:block;height:100%;width:0;border-radius:1em;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 70%,#000),var(--c));transition:width 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s);}
.wt-r .ms em{font-style:normal;font-family:var(--logo);font-weight:700;font-size:1em;min-width:3.2em;text-align:right;color:var(--c);}
.wt-r .ms em small{font-size:.7em;color:var(--t3);}
.pri{display:flex;align-items:baseline;gap:.8em;padding:.65em .9em;border-radius:.55em;background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);}
.pri small{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--t2);}
.pri b{font-weight:700;color:#fff;}
.pri em{font-style:normal;margin-left:auto;font-family:var(--logo);font-weight:700;color:var(--c);}
/* 2 · activité */
.ac{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr) auto;}
.ac-a,.ac-b,.ac-c{min-width:0;display:flex;flex-direction:column;}
.ac-d{grid-column:1/-1;}
.bc{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:.55em;align-items:end;min-height:7em;}
.bc>div{display:flex;flex-direction:column;align-items:center;height:100%;gap:.3em;min-width:0;}
.bc em{font-style:normal;font-size:.8em;font-weight:700;color:var(--c);}
.bc .tr,.wk .tr{flex:1;width:100%;max-width:2.2em;border-radius:.4em .4em .15em .15em;background:rgba(255,255,255,.06);position:relative;overflow:hidden;}
.bc .tr i,.wk .tr i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:.4em .4em .15em .15em;background:linear-gradient(0deg,color-mix(in srgb,var(--c) 55%,#000),var(--c));transition:height 1.2s cubic-bezier(.2,.8,.2,1) var(--d,0s);}
.bc b,.wk b{font-size:.78em;color:var(--t2);}
.tday{flex:1;display:flex;flex-direction:column;gap:.8em;align-items:stretch;justify-content:center;}
.tday .ring{width:58%;max-width:10em;align-self:center;}
.tday .rc b{font-size:1.4em;}
.tday .rc small{font-size:.58em;max-width:7em;}
.tday .lgd{display:grid;grid-template-columns:1fr 1fr;gap:.35em 1em;}
.lgd,.rec{list-style:none;display:flex;flex-direction:column;gap:.38em;}
.lgd li,.rec li{display:flex;align-items:center;gap:.55em;font-size:.8em;min-width:0;}
.lgd li span,.rec li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lgd li em,.rec li em{font-style:normal;color:var(--t2);white-space:nowrap;}
.rec{flex-direction:row;flex-wrap:wrap;gap:.5em 1.6em;}
.rec li{flex:0 1 auto;}
.rec li.nil{color:var(--t3);}
.tg{display:flex;gap:.3em;}
.tg button,.mo-n button{font:inherit;font-size:.92em;letter-spacing:.06em;text-transform:none;color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--ln);border-radius:.4em;padding:.25em .65em;cursor:pointer;}
.tg button.on{background:var(--acc);border-color:var(--acc);color:#2a1a10;font-weight:700;}
.wk{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:.45em;min-height:7em;}
.wk>div{display:flex;flex-direction:column;align-items:center;gap:.25em;height:100%;--c:var(--acc);}
.wk em{font-style:normal;font-size:.72em;color:var(--t2);min-height:1.2em;}
.wk small{font-size:.66em;color:var(--t3);}
.wk .td b{color:#fff;font-weight:700;}.wk .td .tr{box-shadow:0 0 0 1px var(--acc);}
.wk .fu{opacity:.4;}
.mo-n{position:relative;display:flex;gap:.3em;margin:-.3em 0 .4em;}
.mo-n button:disabled{opacity:.3;cursor:default;}
.mo{display:grid;grid-template-columns:repeat(7,1fr);gap:.28em;}
.mo b{font-size:.66em;text-align:center;color:var(--t3);font-weight:400;}
.mo span{aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;font-size:.68em;border-radius:.3em;background:rgba(255,255,255,.04);color:var(--t3);}
.mo span.e{background:none;}
.mo .l1{background:rgba(255,197,138,.22);color:#fff;}.mo .l2{background:rgba(255,197,138,.42);color:#fff;}.mo .l3{background:rgba(255,170,90,.7);color:#2a1a10;}.mo .l4{background:#ffb26b;color:#2a1a10;font-weight:700;}
.mo .td{box-shadow:0 0 0 1.5px #fff;}.mo .fu{opacity:.35;}
.lg{display:flex;align-items:center;gap:.3em;margin-top:.5em;font-size:.64em;color:var(--t3);}
.lg i{width:1em;height:1em;border-radius:.2em;}.lg .l1{background:rgba(255,197,138,.22);}.lg .l2{background:rgba(255,197,138,.42);}.lg .l3{background:rgba(255,170,90,.7);}.lg .l4{background:#ffb26b;}
/* 3 · analyse */
.an{grid-template-rows:auto minmax(0,1fr);gap:1em;}
.an-t{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1em;align-items:stretch;}
.an-t .nt{grid-column:1/-1;font-size:.8em;color:var(--t2);margin-top:-.3em;}
.an-t .nt.warn{color:#ffb860;}
.top{position:relative;padding:.7em 4.2em .7em 1em;border-radius:.6em;background:rgba(255,95,95,.1);border:1px solid rgba(255,95,95,.35);}
.top small{display:block;font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:#ff9a9a;}
.top b{display:block;font-weight:700;font-size:1.05em;margin:.2em 0 .15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top span{display:block;font-size:.76em;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .sc{position:absolute;right:.9em;top:.6em;font-style:normal;font-family:var(--logo);font-weight:800;font-size:1.5em;color:#ff7a7a;}
.top i{position:absolute;right:.9em;bottom:.6em;font-style:normal;font-size:.76em;font-weight:700;color:#ffb0b0;}
.an-c{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1em;min-height:0;}
.an-c .col{display:flex;flex-direction:column;gap:.9em;min-width:0;}
.grp ul{list-style:none;display:flex;flex-direction:column;gap:.4em;}
.grp li{display:grid;grid-template-columns:2.5em minmax(0,1fr) auto;gap:.65em;align-items:center;padding:.38em .55em .38em .38em;border-radius:.5em;background:rgba(255,255,255,.035);border:1px solid var(--ln);transition:background .2s;}
.grp li:hover{background:rgba(255,255,255,.08);}
.grp .sc{font-family:var(--logo);font-weight:800;font-size:.86em;text-align:center;padding:.35em 0;border-radius:.4em;background:color-mix(in srgb,var(--g) 18%,transparent);color:var(--g);}
.grp .tx b{display:block;font-size:.84em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grp .tx small{display:block;font-size:.68em;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.grp li i{font-style:normal;color:var(--t2);font-size:.9em;}
.grp h4{color:var(--g);}
.grp.red{--g:#ff7a7a;}.grp.orange{--g:#ffb35c;}.grp.violet{--g:#c99bff;}.grp.blue{--g:#6fb2ff;}.grp.green{--g:#6fe0a0;}
.an-e{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.6em;}
.an-e b{font-family:var(--logo);font-weight:800;font-size:1.6em;}
.an-e p{font-size:.9em;color:var(--t2);max-width:38em;line-height:1.6;}
/* portrait : une seule colonne */
.wp.por{padding:1em 1.1em .9em;}
.wp.por .ov,.wp.por .ac,.wp.por .an-t,.wp.por .an-c{grid-template-columns:1fr;}
.wp.por .ov-hero{grid-template-columns:1fr 1fr;}
.wp.por .ac{grid-template-rows:auto auto auto;}
.wp.por .ac-b,.wp.por .ac-d,.wp.por .an-c .col:nth-child(n+2) .grp:nth-child(n+2){display:none;}
.wp.por .wt-h,.wp.por .wt-r{grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) 4.5em;}
.wp.por .wt-h span:last-child,.wp.por .wt-r>span:last-child{display:none;}
.wp.por .kp{grid-template-columns:repeat(3,1fr);}.wp.por .kp.k4{grid-template-columns:repeat(2,1fr);}
/* flèches du carrousel : contre les bords devant le mur */
#hud.stats #farr-l{left:1.6%;}#hud.stats #farr-r{right:64px;}
.wp.por .wh p>span:not(.dm){display:none;}
.wp.por .ov-hero .ring{max-width:8.6em;}
.wp.por .ov-l{gap:.6em;}
.wp.por .ov-l .kp div:nth-child(n+4){display:none;}
.wp.por .wt-r{padding:.32em .5em;}
.wp.por .wb{gap:.8em;}
@media (max-aspect-ratio:9/10){#hud.stats .farr{display:none;}}

/* ── Profil (mêmes profils que la L1) ── */
#prof{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0;color:#fff;letter-spacing:.04em;text-transform:uppercase;}
#prof i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.7);font-size:10px;font-weight:700;}
#prof:hover i{background:#fff;color:#2a1d16;}
.h-br{align-items:center;}
/* ── Profil : fenêtre d'identification (commune à la L1 et à la L2) — langage du HUD :
   verre sombre sur la scène vivante, filets, coins en équerre, chiffres et libellés mono ── */
#pm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;--pa:#ffc58a;
  background:radial-gradient(120% 90% at 50% 45%,rgba(10,8,7,.22),rgba(8,6,5,.72));backdrop-filter:blur(6px) saturate(1.1);-webkit-backdrop-filter:blur(6px) saturate(1.1);
  opacity:0;pointer-events:none;transition:opacity .5s ease;font-family:var(--mono);color:#f6f1ea;}
#pm.on{opacity:1;pointer-events:auto;}

.mm-s h3 button{font:500 10px/1 var(--mono);color:rgba(255,255,255,.5);background:none;border:0;cursor:pointer;letter-spacing:.08em;white-space:nowrap;}
.mm-s h3 button:hover{color:#fff;}
.mm-c{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:10px 12px;margin-bottom:3px;background:rgba(255,255,255,.035);color:#fff;text-decoration:none;font-size:12px;line-height:1.35;border-left:2px solid transparent;transition:background .2s,border-color .2s;}
.mm-c:hover,.mm-c:focus-visible{background:rgba(255,255,255,.09);border-left-color:var(--pa,#ffc58a);outline:none;}
.mm-c em{font-style:normal;font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap;}
.mm-c i{grid-column:1/-1;height:2px;background:rgba(255,255,255,.1);position:relative;display:block;}
.mm-c i b{position:absolute;left:0;top:0;bottom:0;background:var(--pa,#ffc58a);}
.mm-e{font-size:11px;color:rgba(255,255,255,.4);padding:4px 0;}
.ld-m{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:92vw;}
.ld-m a,.ld-m button{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(var(--st),.3);padding:10px 14px;cursor:pointer;text-decoration:none;max-width:86vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .2s,color .2s;}
.ld-m a:hover,.ld-m button:hover,.ld-m a:focus-visible,.ld-m button:focus-visible{background:#fff;color:#111;outline:none;}
@media(max-width:760px){#mm{padding:10px;}.mm-in{max-height:94vh;}.mm-g{grid-template-columns:1fr;overflow:auto;}.mm-a{border-right:0;border-bottom:1px solid rgba(255,255,255,.08);overflow:visible;padding:14px 16px;}.mm-b{overflow:visible;padding:14px 16px;}.mm-h{padding:14px 16px;}}
.capture #mm,.capture #mmb{display:none!important;}
</style>

<body>
<canvas id="gl" aria-hidden="true"></canvas>

<!-- Chargement -->
<div id="loader" role="status" aria-live="polite">
  <div class="ld-sky" aria-hidden="true"><div class="ld-cam"><div class="ld-fit" id="ld-fit"></div></div></div>
  <div class="ld-sweep" aria-hidden="true"></div><div class="ld-vig" aria-hidden="true"></div><div class="ld-grain" aria-hidden="true"></div>
  <div class="ld-bar t" aria-hidden="true"></div><div class="ld-bar b" aria-hidden="true"></div>
  <div class="ld-ui"><div class="t">R<span>·</span>VISION</div><div class="s">LICENCE 1</div><div class="p"><i id="ld-bar"></i></div><div class="c"><span id="ld-pct">000</span></div><div id="ld-glyph">==--==--==</div></div>
</div>
<script>
/* Chargeur « constellation » : amorce exécutée dès que la page arrive, avant le moteur 3D.
   Le moteur appelle RVL.set(p) (0…1) : les lignes se tissent à mesure — la trame du ciel d'abord, la figure pour finir. */
(function(){
  var D={"n":[[-255,184],[-117.3,208],[117.3,208],[255,184],[-212,88],[-97.5,112],[97.5,112],[212,88],[-169,-8],[-77.7,16],[77.7,16],[169,-8],[-126,-104],[-58.0,-80],[58.0,-80],[126,-104],[-83,-200],[-38.2,-176],[38.2,-176],[83,-200],[-150,272],[150,272],[0,-304]],"l":[[20,21],[20,1],[21,2],[0,1],[1,2],[2,3],[1,5],[2,6],[4,5],[5,6],[6,7],[5,9],[6,10],[8,9],[9,10],[10,11],[9,13],[10,14],[12,13],[13,14],[14,15],[13,17],[14,18],[16,17],[17,18],[18,19],[17,22],[18,22]],"sun":22,"lab":[[0,"DDHC 1789","l"],[7,"ART. 16"],[8,"MARBURY 1803","l"],[15,"1804"]]},root=document.getElementById('loader'),fit=document.getElementById('ld-fit');if(!root||!fit)return;
  var seed=20261114;function R(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  function el(tag,cls,par,css){var e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;par.appendChild(e);return e;}
  var far=el('div','ld-z far',fit),mid=el('div','ld-z mid',fit),near=el('div','ld-z near',fit);
  function size(){var s=Math.min(innerWidth*1.12,innerHeight*0.8)/1000;root.style.setProperty('--s',s.toFixed(4));root.style.setProperty('--lw',(1.35/s).toFixed(2)+'px');}
  size();addEventListener('resize',size);
  // poussière d'étoiles : deux nappes, un seul élément chacune (ombres portées)
  function dust(par,n,spread,cls){var sh=[];for(var i=0;i<n;i++){var a=R()*6.2832,r=Math.sqrt(R())*spread,o=(0.18+R()*0.6).toFixed(2),b=R()<0.12?1.2:0;
    sh.push(Math.round(Math.cos(a)*r*1.5)+'px '+Math.round(Math.sin(a)*r)+'px 0 '+b+'px rgba(243,236,216,'+o+')');}
    el('div','ld-dust '+cls,par).style.boxShadow=sh.join(',');}
  dust(far,150,1250,'a');dust(far,90,1250,'b');dust(mid,50,820,'b');
  el('div','ld-ring',mid);el('div','ld-ring b',mid);
  // flou d'avant-plan (profondeur de champ)
  for(var i=0;i<7;i++){var s=70+R()*150,a=R()*6.2832,r=380+R()*520;el('div','ld-bok',near,'width:'+s+'px;height:'+s+'px;transform:translate('+Math.round(Math.cos(a)*r*1.35-s/2)+'px,'+Math.round(Math.sin(a)*r*0.8-s/2)+'px);animation-delay:-'+(R()*9).toFixed(1)+'s;opacity:.7');}
  var order=[];
  function node(par,x,y,cls){var n=el('div','ld-n '+cls,par,'transform:translate('+x+'px,'+y+'px)');var i=el('i','',n);i.style.setProperty('--d',(3.2+R()*4.5).toFixed(1)+'s');i.style.setProperty('--o','-'+(R()*6).toFixed(1)+'s');return n;}
  function line(par,a,b,cls){var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.sqrt(dx*dx+dy*dy);
    var l=el('div','ld-l '+cls,par,'width:'+L.toFixed(1)+'px;transform:translate('+a[0]+'px,'+a[1]+'px) rotate('+Math.atan2(dy,dx).toFixed(4)+'rad)');
    l.style.setProperty('--L',L.toFixed(1)+'px');el('u','',l);if(cls==='e'||R()<0.3)el('s','',l);return l;}
  // trame du ciel (plan lointain) : chaque étoile rejoint ses deux plus proches voisines, comme dans l'intro
  var F=[],FN=[];for(var k=0;k<46;k++){var a2=R()*6.2832,r2=330+Math.pow(R(),0.7)*640;F.push([Math.round(Math.cos(a2)*r2*1.45),Math.round(Math.sin(a2)*r2*0.92)]);}
  F.forEach(function(p,i){FN.push(node(far,p[0],p[1],i%5<2?'f':'f q'));});   // deux étoiles sur cinq scintillent, les autres sont fixes (moins de calques)
  var seen={};F.forEach(function(p,i){var d=F.map(function(q,j){return [j,(p[0]-q[0])*(p[0]-q[0])+(p[1]-q[1])*(p[1]-q[1])];}).filter(function(e){return e[0]!==i;}).sort(function(u,v){return u[1]-v[1];});
    for(var m=0;m<2;m++){var j=d[m][0],key=i<j?i+'_'+j:j+'_'+i;if(seen[key]||d[m][1]>250000)continue;seen[key]=1;order.push({l:line(far,F[i],F[j],'f'),n:[FN[i],FN[j]]});}});
  // la figure (plan médian), tissée en dernier
  var EN=D.n.map(function(p){return node(mid,p[0],p[1],'e');});
  D.lab.forEach(function(q){el('b',q[2]||'',EN[q[0]]).textContent=q[1];});
  var first=order.length;
  D.l.forEach(function(q){order.push({l:line(mid,D.n[q[0]],D.n[q[1]],'e'),n:[EN[q[0]],EN[q[1]]]});});
  var sun=el('div','ld-sun',mid,'transform:translate('+D.n[D.sun][0]+'px,'+D.n[D.sun][1]+'px)');
  var bar=document.getElementById('ld-bar'),shown=0,pmax=0,done=false;
  function set(p){p=Math.max(pmax,Math.min(1,+p||0));pmax=p;
    // la trame occupe les 55 premiers %, la figure le reste
    var k=p<0.55?Math.round(first*p/0.55):first+Math.round((order.length-first)*(p-0.55)/0.45);
    for(;shown<k&&shown<order.length;shown++){var o=order[shown];o.l.classList.add('on');o.n[0].classList.add('on');o.n[1].classList.add('on');}
    if(bar)bar.style.transform='scaleX('+p.toFixed(3)+')';
    if(p>0.8)sun.classList.add('on');
    if(p>=1&&!done){done=true;root.classList.add('done');}
  }
  window.RVL={set:set,count:order.length};
  set(0.02);
})();
</script>
