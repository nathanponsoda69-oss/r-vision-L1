boire toute la soirée. À Chamonix, Hugo, contrôlé ensuite à 0,9 g d’alcool par litre de sang, renverse un cycliste, Sven, de nationalité suédoise : 2 mois d’ITT.", "question": "Envisagez la responsabilité pénale d’Hugo et de Nina.", "brouillon": "Fait 1 (Italie) : violences volontaires ITT &gt; 8 jours (222-11 : délit, 3 ans). Auteur français → 113-6 al. 2 (réciprocité : oui) + 113-8 (plainte de Marco + requête du MP). Fait 2 (France) : territorialité ; blessures routières ITT ≤ 3 mois, circonstance 2° alcool → 221-20 (3 ans). Nina : non conductrice, causalité indirecte, faute caractérisée → ITT ≤ 3 mois → R625-2.", "plan": ["HUGO, fait 1 — Espace : S1 territorialité (exclue) · S2 personnelle active ; Qualification : matériel · moral · répression (222-11)", "HUGO, fait 2 — Espace : territorialité (applicable) ; S4 : résultat · causalité directe · faute · répression (221-20 2°)", "NINA — S4 : résultat · causalité indirecte · faute caractérisée · répression (R625-2)"], "corr": [{"t": "Hugo, fait 1 · Espace · 1er syllogisme", "maj": "Art. <b>113-2<\/b>.", "min": "Coups portés dans un refuge en Italie.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "Hugo, fait 1 · Espace · 2d syllogisme · Personnelle active", "maj": "Art. <b>113-6 al. 2<\/b> (délit commis par un Français à l’étranger, réciprocité) ; art. <b>113-8<\/b> (requête du ministère public, précédée d’une plainte de la victime ou d’une dénonciation officielle).", "min": "Hugo est français ; les violences ayant entraîné 10 jours d’ITT sont un délit (222-11 : 3 ans) ; le droit italien les réprime ; Marco a porté plainte. Reste la requête du ministère public.", "concl": "Donc, le système de compétence personnelle active tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Hugo, fait 1 · Élément matériel", "maj": "Art. <b>222-11<\/b> : violences ayant entraîné une ITT pendant plus de huit jours.", "min": "Coups volontaires, ITT de 10 jours.", "concl": "Donc, l’élément matériel est caractérisé.", "note": ""}, {"t": "Hugo, fait 1 · Élément moral", "maj": "Dol général : volonté de porter atteinte à l’intégrité physique d’autrui.", "min": "Hugo a « frappé volontairement » Marco ; la dispute n’est qu’un mobile.", "concl": "Donc, l’élément moral est caractérisé.", "note": ""}, {"t": "Hugo, fait 1 · Répression", "maj": "Art. <b>222-11<\/b> : 3 ans d’emprisonnement et 45 000 € d’amende.", "min": "Aucune circonstance aggravante mentionnée.", "concl": "Donc, Hugo encourt 3 ans et 45 000 €.", "note": ""}, {"t": "Hugo, fait 2 · Espace", "maj": "Art. <b>113-2<\/b>.", "min": "Accident à Chamonix ; la nationalité de la victime est indifférente.", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Hugo, fait 2 · Résultat", "maj": "Art. <b>221-20<\/b> : blessures routières, ITT ≤ 3 mois, causées par un conducteur dans les conditions de 121-3, avec une circonstance.", "min": "Sven : 2 mois d’ITT.", "concl": "Donc, le résultat est caractérisé.", "note": ""}, {"t": "Hugo, fait 2 · Causalité", "maj": "Art. 221-20 renvoyant à <b>121-3<\/b> ; circ. 11 oct. 2000.", "min": "Hugo conduisait le véhicule qui a renversé Sven.", "concl": "Donc, le lien de causalité est certain et direct.", "note": ""}, {"t": "Hugo, fait 2 · Faute", "maj": "Directe : faute simple suffisante (121-3).", "min": "Conduite avec 0,9 g/l, au-delà du seuil délictuel de 0,8 g/l (L234-1 C. route), et inattention ayant conduit à renverser le cycliste.", "concl": "Donc, une faute est caractérisée.", "note": ""}, {"t": "Hugo, fait 2 · Répression", "maj": "Art. <b>221-20 2°<\/b> : 3 ans et 45 000 € (état alcoolique) ; 5 ans et 75 000 € avec deux circonstances ou plus.", "min": "Une circonstance (alcool).", "concl": "Donc, Hugo encourt 3 ans d’emprisonnement et 45 000 € d’amende.", "note": ""}, {"t": "Nina · Résultat", "maj": "Art. <b>R625-2<\/b> (faute simple ou caractérisée) / <b>222-20<\/b> (faute délibérée) ; Nina n’est pas conductrice, les textes routiers ne la visent pas.", "min": "Sven : 2 mois d’ITT.", "concl": "Donc, le résultat est caractérisé.", "note": ""}, {"t": "Nina · Causalité", "maj": "Art. <b>121-3 al. 4<\/b> : auteur indirect, qui a créé la situation ayant permis le dommage.", "min": "En confiant ses clés à un conducteur ivre, Nina a rendu l’accident possible, sans heurter elle-même la victime.", "concl": "Donc, le lien de causalité est certain mais indirect.", "note": ""}, {"t": "Nina · Faute", "maj": "Indirecte : faute qualifiée ; délibérée (obligation particulière légale ou réglementaire) ou caractérisée (risque d’une particulière gravité qu’on ne pouvait ignorer). Confier un danger à qui ne peut le maîtriser peut constituer une faute caractérisée (Crim. 26 juin 2018, chien d’attaque).", "min": "Aucun texte précis n’interdit au propriétaire de prêter son véhicule : pas de faute délibérée. Mais remettre les clés à un ami qu’on a vu boire toute la soirée l’expose, et expose les tiers, à un risque d’une particulière gravité qu’elle ne pouvait ignorer.", "concl": "Donc, une faute caractérisée est caractérisée.", "note": ""}, {"t": "Nina · Répression", "maj": "Art. <b>R625-2<\/b> : amende de la 5e classe (1 500 € au plus).", "min": "Faute caractérisée et ITT ≤ 3 mois : contravention.", "concl": "Donc, Nina encourt une amende de 1 500 € au plus.", "note": ""}], "vig": ["Un fait par lieu, un raisonnement d’espace par fait.", "Les textes routiers ne visent que le <b>conducteur<\/b> : pour Nina, retour aux textes généraux.", "Faute caractérisée + ITT ≤ 3 mois → R625-2."], "check": ["Fait 1 : 113-6 al. 2 + 113-8", "Fait 1 : intentionnelle consommée, 3 syllogismes", "Fait 2 : 221-20 2°", "Nina : causalité indirecte", "Nina : R625-2"]}, {"id": "m5", "s": ["s1", "s2", "s3", "s4"], "src": "Examen blanc · S1 + S2 + S3 + S4", "titre": "Le manège de Victor", "duree": 90, "mixte": true, "examen": true, "enonce": "Victor dirige un parc d’attractions près de Lyon. Un arrêté ministériel impose un contrôle technique annuel des manèges par un organisme agréé ; en mars 2026, un inspecteur lui rappelle par écrit que le « Grand Huit » n’a pas été contrôlé depuis deux ans. Victor ne fait rien, pour éviter la fermeture estivale. Le <b>2 juin 2026<\/b>, une nacelle se détache alors que l’opérateur, Samir, lance le manège selon la procédure habituelle : Léa, 12 ans, subit une ITT de 4 mois.<br>Le chef d’atelier, Paul, de nationalité française, a remis aux enquêteurs un témoignage accablant pour Victor. En août 2026, à Barcelone, où Paul passe ses vacances, Samir, de nationalité marocaine, qui craint d’être mis en cause, lui tire dessus à deux reprises au pistolet pour l’empêcher de témoigner au procès ; Paul se jette au sol et n’est pas touché. Samir est arrêté par la police espagnole puis remis à la France.<br>Une loi (fictive) entre en vigueur le <b>1er novembre 2026<\/b> : son art. 1er porte la peine de 222-19 al. 2 à 5 ans d’emprisonnement lorsque la victime est mineure ; son art. 2 fixe à 10 ans la prescription de l’action publique des délits commis contre des mineurs.", "question": "Envisagez la responsabilité pénale de Victor et de Samir.", "brouillon": "VICTOR : France → territorialité. S2 : loi complexe divisible : art. 1er fond plus sévère → non rétroactif ; art. 2 forme 112-2 4°, prescription non acquise → applicable. S4 : ITT &gt; 3 mois, causalité <b>indirecte<\/b> (c’est Samir qui lance le manège), faute <b>délibérée<\/b> (arrêté ministériel, rappel écrit) → 222-19 al. 2 ancien : 3 ans, 45 000 €.<br>SAMIR : Espagne, auteur marocain, victime française → 113-7 (crime) ; tentative de meurtre sur témoin (221-4 5° : perpétuité) ; Paul se jette au sol = désistement involontaire.", "plan": ["VICTOR — Espace (territorialité, bref) · Temps (2 dispositions) · S4 : résultat, causalité indirecte, faute délibérée, répression", "SAMIR — Espace : territorialité exclue, passive (113-7) · Tentative de meurtre aggravé : T1 à T5"], "corr": [{"t": "Victor · Espace", "maj": "Art. <b>113-2<\/b>.", "min": "Accident survenu dans un parc près de Lyon.", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Victor · Temps · Conflit, loi complexe divisible", "maj": "Art. <b>112-1<\/b> ; définitions ; application distributive (Crim. 21 avr. 1982).", "min": "Faits du 2 juin 2026, instantanés ; loi du 1er novembre 2026 ; aucun jugement. La loi modifie la peine (art. 1er) et la prescription (art. 2) : objets distincts.", "concl": "Donc, un conflit est identifié et la loi est complexe divisible, imposant une application distributive.", "note": "Dans la copie : trois syllogismes distincts (conflit ; simple ou complexe ; divisible ou indivisible)."}, {"t": "Victor · Temps · Art. 1er", "maj": "Loi de fond (peine) ; <b>112-1<\/b> : non-rétroactivité de la loi plus sévère.", "min": "La peine passe de 3 à 5 ans : plus sévère.", "concl": "Donc, l’art. 1er ne tend pas à s’appliquer : ancien 222-19 al. 2.", "note": ""}, {"t": "Victor · Temps · Art. 2", "maj": "Loi de forme (<b>112-2 4°<\/b>) : application immédiate si la prescription n’est pas acquise.", "min": "Délai ancien de 6 ans courant depuis le 2 juin 2026 : non acquis au 1er novembre 2026.", "concl": "Donc, l’art. 2 tend à s’appliquer : prescription de 10 ans. Conclusion : la loi s’applique partiellement, l’art. 2 à l’exclusion de l’art. 1er.", "note": ""}, {"t": "Victor · Résultat", "maj": "Art. <b>222-19<\/b> : ITT de plus de trois mois causée dans les conditions de 121-3.", "min": "Léa : 4 mois d’ITT.", "concl": "Donc, le résultat est caractérisé.", "note": ""}, {"t": "Victor · Causalité", "maj": "<b>121-3<\/b> ; certaine (Crim. 5 oct. 2004) ; directe ou indirecte (circ. 11 oct. 2000).", "min": "Sans le défaut de contrôle, la nacelle défectueuse aurait été détectée : lien certain. Mais c’est Samir qui a lancé le manège ; Victor a créé la situation et n’a pas pris les mesures permettant d’éviter le dommage.", "concl": "Donc, le lien de causalité est certain mais indirect.", "note": ""}, {"t": "Victor · Faute", "maj": "Indirecte : faute qualifiée. Faute délibérée : obligation particulière, prévue par un règlement général et impersonnel, violée en connaissance de cause (Crim. 10 mai 2000 ; Crim. 1er sept. 2009 : rappel préalable de l’inspection).", "min": "L’arrêté ministériel impose un contrôle annuel précis : obligation particulière réglementaire. Victor, alerté par écrit, s’est abstenu volontairement pour ne pas fermer : violation manifestement délibérée.", "concl": "Donc, une faute délibérée est caractérisée.", "note": ""}, {"t": "Victor · Répression", "maj": "Art. <b>222-19 al. 2<\/b> (rédaction antérieure à la loi du 1er novembre 2026) : 3 ans d’emprisonnement et 45 000 € d’amende.", "min": "Faute délibérée.", "concl": "Donc, Victor encourt 3 ans d’emprisonnement et 45 000 € d’amende ; l’action publique se prescrit par 10 ans.", "note": "Samir, opérateur ayant suivi la procédure, ne commet aucune faute quant à l’accident."}, {"t": "Samir · Espace · Territorialité", "maj": "Art. <b>113-2<\/b>.", "min": "Coups de feu tirés à Barcelone.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "Samir · Espace · Personnelle passive", "maj": "Art. <b>113-7<\/b> : tout crime commis par un étranger hors du territoire contre une victime française au moment des faits ; 113-8 limité aux délits ; 113-9.", "min": "Paul est français ; la tentative de meurtre est un crime ; aucun jugement en Espagne.", "concl": "Donc, le système de compétence personnelle passive tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Samir · Tentative · Matérialité et incrimination", "maj": "Art. <b>221-1<\/b> ; <b>221-4 5°<\/b> (meurtre commis sur un témoin pour l’empêcher de déposer en justice : perpétuité) ; <b>121-4 2°<\/b> (tentative de crime toujours incriminée).", "min": "Paul est indemne ; le meurtre est un crime.", "concl": "Donc, la matérialité est infructueuse et la tentative est incriminée.", "note": ""}, {"t": "Samir · Tentative · Commencement d’exécution", "maj": "Art. <b>121-5<\/b> ; Crim. 22 mai 1984 ; intention de tuer déduite des circonstances (Crim. 13 janv. 2021).", "min": "Tirer à deux reprises au pistolet sur Paul tend directement à sa mort ; l’arme létale et la répétition révèlent l’intention de tuer.", "concl": "Donc, un commencement d’exécution d’un meurtre est caractérisé.", "note": ""}, {"t": "Samir · Tentative · Désistement involontaire", "maj": "Art. <b>121-5<\/b>.", "min": "Le résultat a manqué parce que Paul s’est jeté au sol : circonstance indépendante de la volonté de Samir.", "concl": "Donc, le désistement est involontaire.", "note": ""}, {"t": "Samir · Tentative · Répression", "maj": "Art. <b>121-4 2°<\/b> + <b>221-4 5°<\/b>.", "min": "Samir voulait empêcher Paul de témoigner.", "concl": "Donc, Samir encourt la réclusion criminelle à perpétuité.", "note": ""}], "vig": ["Ordre : par protagoniste, puis espace → temps → qualification → répression.", "Victor : causalité indirecte parce qu’un tiers a actionné le manège ; la faute délibérée est démontrée par le rappel écrit.", "Samir : le mobile (peur d’être mis en cause) devient ici une circonstance aggravante parce que le texte la prévoit (témoin)."], "check": ["Victor : application distributive (1982)", "Art. 1er non rétroactif / art. 2 applicable", "Causalité indirecte justifiée", "Faute délibérée : obligation ciblée", "Samir : 113-7 (crime, pas de 113-8)", "Samir : 221-4 5°, tentative en 5 syllogismes"]}], "quiz": [{"id": "q1", "s": "s1", "cat": "meth", "q": "Les faits se déroulent intégralement à New York. Que fais-tu de la territorialité ?", "o": ["Je l’écarte d’une phrase sans syllogisme", "Je rédige un syllogisme qui conclut à son exclusion", "Je passe directement au système de compétence", "Je ne l’évoque que si l’auteur est français"], "a": 1, "e": "La fiche est formelle : un syllogisme sur la territorialité doit systématiquement être produit, même lorsque son exclusion relève de l’évidence."}, {"id": "q2", "s": "s1", "cat": "art", "q": "Quel article répute l’infraction commise en France dès qu’un de ses faits constitutifs y a eu lieu ?", "o": ["113-1", "113-2 al. 2", "113-5", "113-7"], "a": 1, "e": "113-2 al. 2 : théorie de l’ubiquité."}, {"id": "q3", "s": "s1", "cat": "piege", "q": "Un vol est commis sur un bateau de croisière immatriculé en France, amarré sur le Rhin en Allemagne. 113-3 s’applique-t-il ?", "o": ["Oui, le pavillon suit le bateau partout", "Non : 113-3 ne vaut que pour la navigation maritime", "Oui, si la victime est française", "Non : seul 113-4 vise les bateaux"], "a": 1, "e": "Crim. 18 sept. 2007 : 113-3 ne saurait être étendu aux bateaux de navigation fluviale."}, {"id": "q4", "s": "s1", "cat": "art", "q": "Auteur français, délit commis à l’étranger : quelles conditions ?", "o": ["Aucune", "Réciprocité d’incrimination + requête du MP après plainte ou dénonciation officielle", "Seulement la présence de l’auteur en France", "Victime française"], "a": 1, "e": "113-6 al. 2 (réciprocité) et 113-8 (requête du ministère public précédée d’une plainte de la victime ou de ses ayants droit, ou d’une dénonciation officielle)."}, {"id": "q5", "s": "s1", "cat": "why", "q": "Pourquoi la réciprocité d’incrimination n’est-elle exigée que pour les délits ?", "o": ["Parce que les crimes sont toujours commis en France", "Parce que pour les crimes, la gravité justifie la répression même si l’État étranger ne les réprime pas, alors que pour les délits on respecte le choix du législateur local", "Par oubli du législateur", "Parce que les délits relèvent de la compétence universelle"], "a": 1, "e": "Plus l’infraction est grave, moins l’on tolère qu’un national échappe à la répression ; pour les délits, on évite de punir un acte licite là où il a été commis."}, {"id": "q6", "s": "s1", "cat": "art", "q": "La compétence personnelle passive (113-7) suppose :", "o": ["Un crime ou un délit puni d’emprisonnement + victime française au moment des faits", "Un délit + réciprocité", "Une victime résidant en France", "Une contravention commise contre un Français"], "a": 0, "e": "113-7 : tout crime, ainsi que tout délit puni d’emprisonnement ; victime de nationalité française au moment de l’infraction ; aucune réciprocité."}, {"id": "q7", "s": "s1", "cat": "piege", "q": "L’épouse française d’un Marocain torturé au Maroc peut-elle fonder la compétence passive ?", "o": ["Oui, elle est victime par ricochet", "Non : seule la qualité de victime directe française attribue compétence", "Oui, en vertu de la CEDH", "Oui, si elle réside en France"], "a": 1, "e": "Crim. 8 nov. 2016 : les préjudices de l’épouse ne lui confèrent pas la qualité de victime au sens de 113-7."}, {"id": "q8", "s": "s1", "cat": "art", "q": "Fausse monnaie fabriquée à l’étranger par un étranger : quel fondement ?", "o": ["113-6", "113-7", "113-10 (compétence réelle)", "689-1 CPP"], "a": 2, "e": "113-10 vise la contrefaçon de pièces de monnaie et de billets (442-1, 442-2…), quelle que soit la nationalité de l’auteur."}, {"id": "q9", "s": "s1", "cat": "art", "q": "Quelle condition est propre à la compétence universelle ?", "o": ["La nationalité française de l’auteur", "La présence de l’auteur en France", "La réciprocité", "La plainte de la victime"], "a": 1, "e": "689-1 CPP : l’auteur peut être poursuivi s’il se trouve en France, habituellement ou occasionnellement."}, {"id": "q10", "s": "s1", "cat": "piege", "q": "Un site étranger est accessible depuis la France mais rédigé en anglais et vise un public américain. Territorialité ?", "o": ["Oui, l’accessibilité suffit", "Non : il faut que le public français soit précisément visé", "Oui si l’hébergeur est français", "Non, internet est toujours hors territoire"], "a": 1, "e": "Crim. 12 juill. 2016 : la seule accessibilité ne suffit pas, le public français doit être spécifiquement visé."}, {"id": "q11", "s": "s1", "cat": "meth", "q": "Dans quel cas cites-tu 113-9 en majeure ?", "o": ["Toujours", "Si les faits mentionnent un jugement de l’auteur à l’étranger", "Jamais pour un crime", "Seulement en compétence réelle"], "a": 1, "e": "La fiche : « éventuellement 113-9 si est mentionné dans les faits un jugement de l’auteur à l’étranger »."}, {"id": "q12", "s": "s1", "cat": "piege", "q": "Infractions commises à l’étranger par un étranger sur un étranger, connexes à des faits commis en France : la loi française s’applique-t-elle ?", "o": ["Oui, par connexité", "Non : la connexité ne suffit pas, seule l’indivisibilité le permet", "Oui si le juge l’estime opportun", "Oui si l’auteur réside en France"], "a": 1, "e": "Crim. 31 mai 2016 : la connexité ne rend pas la loi française applicable ; l’indivisibilité, si."}, {"id": "q13", "s": "s1", "cat": "why", "q": "Pourquoi l’étape « choix du système » reste-t-elle au brouillon ?", "o": ["Parce qu’elle est facultative", "Parce que c’est un aiguillage : la copie ne contient que le système retenu, justifié par le fait déclencheur", "Parce qu’elle n’est pas notée", "Parce qu’elle se confond avec la territorialité"], "a": 1, "e": "La fiche distingue l’identification (au brouillon) et l’application (le second syllogisme)."}, {"id": "q14", "s": "s1", "cat": "jur", "q": "Que juge Crim. 19 avr. 1983 (antiquaire, statues africaines) ?", "o": ["Une lettre mensongère postée en France suffit à localiser l’escroquerie", "De simples mensonges écrits ne sont pas des manœuvres : il faut des faits extérieurs pour localiser l’escroquerie en France", "L’escroquerie est une infraction continue", "La victime américaine exclut la loi française"], "a": 1, "e": "Est réputée commise en France l’infraction dont un acte caractérisant un élément constitutif y a été accompli ; de simples mensonges ne le sont pas."}, {"id": "q15", "s": "s1  "ref": "Crim. 8 nov. 2016", "num": "n°16-84.115", "apport": "Seule la qualité de victime directe française au moment des faits fonde 113-7 ; la CEDH ne modifie pas les règles de compétence.", "etape": "Compétence passive"}, {"id": "j3", "s": "s1", "ref": "Crim. 23 janv. 2019", "num": "n°18-80.842", "apport": "Le juge doit rechercher si un simulacre d’exécution caractérise la torture (convention de New York, 689-2 CPP) et si un complice français est impliqué.", "etape": "Compétence universelle / active"}, {"id": "j4", "s": "s1", "ref": "Crim. 17 janv. 2018", "num": "n°16-86.842", "apport": "692 CPP : une décision étrangère n’a autorité de chose jugée que pour des faits commis hors du territoire ; pas pour des faits commis même partiellement en France.", "etape": "113-9 / 692 CPP"}, {"id": "j5", "s": "s1", "ref": "Crim. 31 mai 2016", "num": "n°15-85.920", "apport": "La connexité ne rend pas la loi française applicable aux faits commis à l’étranger ; seule l’indivisibilité le permet.", "etape": "Territorialité (113-2)"}, {"id": "j6", "s": "s1", "ref": "Crim. 18 sept. 2007", "num": "n°07-82.504", "apport": "113-3 ne s’étend pas aux bateaux de navigation fluviale.", "etape": "Territorialité : navire"}, {"id": "j7", "s": "s1", "ref": "Crim. 19 avr. 1983", "num": "n°82-90.345", "apport": "Est réputée commise en France l’infraction dont un acte caractérisant un élément constitutif y a été accompli ; de simples mensonges écrits ne sont pas des manœuvres frauduleuses.", "etape": "Territorialité : fait constitutif"}, {"id": "j8", "s": "s1", "ref": "Crim. 26 mai 2010", "num": "n°09-86.499", "apport": "Le juge doit vérifier la réciprocité d’incrimination (113-6) et la plainte ou dénonciation préalable (113-8).", "etape": "Compétence active"}, {"id": "j9", "s": "s1", "ref": "Crim. 12 juill. 2016", "num": "n°15-86.645", "apport": "L’infraction commise sur internet depuis l’étranger est réputée commise en France si le public français est précisément visé.", "etape": "Territorialit nv. 1980", "num": "n°79-92.098", "apport": "Le lien de causalité doit être certain ; la perte d’une chance de survie ne suffit pas.", "etape": "Causalité"}, {"id": "j35", "s": "s4", "ref": "Crim. 1er sept. 2009", "num": "n°09-80.091", "apport": "L’employeur qui tolère l’usage d’un escabeau malgré le rappel de l’inspection du travail viole délibérément une obligation particulière (L4321-1 C. trav.).", "etape": "Faute délibérée"}, {"id": "j36", "s": "s4", "ref": "Crim. 24 sept. 2013", "num": "n°12-87.059", "apport": "QPC non transmise : la faute caractérisée est définie en termes suffisamment clairs et précis.", "etape": "Faute caractérisée"}, {"id": "j37", "s": "s4", "ref": "Crim. 31 mars 2020", "num": "n°19-82.171", "apport": "Des articles précis d’un règlement européen sont des obligations particulières ; un PMS ou une autorisation individuelle n’est pas un règlement.", "etape": "Faute délibérée"}, {"id": "j38", "s": "s4", "ref": "Crim. 21 janv. 2014", "num": "n°13-80.267", "apport": "Cause directement le dommage le propriétaire qui laisse sortir son chien sans contrôle ni laisse.", "etape": "Causalité directe"}, {"id": "j39", "s": "s4", "ref": "Crim. 17 déc. 2019", "num": "n°17-87.465", "apport": "AZF : la faute caractérisée peut résulter de l’accumulation de manquements.", "etape": "Faute caractérisée"}, {"id": "j40", "s": "s4", "ref": "Crim. 26 juin 2018", "num": "n°17-86.626", "apport": "Confier un chien d’attaque à un tiers qu’on sait incapable de le maîtriser : faute personnelle et caractérisée.", "etape": "Faute caractérisée"}, {"id": "j41", "s": "s4", "ref": "Crim. 2 déc. 2003", "num": "n°03-83.008", "apport": "Le maire informé de la dangerosité d’une aire de jeux qui n’agit pas commet une faute caractérisée.", "etape": "Faute caractérisée"}, {"id": "j42", "s": "s4", "ref": "Crim. 13 nov. 2019", "num": "", "apport": "223-1 : rechercher l’obligation particulière (au besoin d’office), l’immédiateté du risque, la violation manifestement délibérée.", "etape": "223-1"}, {"id": "j43", "s": "s4", "ref": "Crim. 1er oct. 2024", "num": "n°23-83.421", "apport": "Chiens échappés d’un enclos : causalité indirecte ; la faute qualifiée doit être caractérisée, y compris son caractère délibéré.", "etape": "Causalité indirecte / faute"}, {"id": "j44", "s": "s4", "ref": "Crim. 10 mai 2000", "num": "n°99-80.784", "apport": "Le règlement, au sens de 121-3, s’entend d’un acte de portée générale et impersonnelle.", "etape": "Faute délibérée"}, {"id": "j45", "s": "s4", "ref": "Crim. 5 oct. 2004", "num": "n°03-86.169", "apport": "Le lien de causalité est nécessairement certain.", "etape": "Causalité"}], "coeur": [{"id": "p1", "s": "s1", "ref": "Art. 113-2 CP", "txt": "La loi pénale française est applicable aux infractions commises sur le territoire de la République. L’infraction est réputée commise sur le territoire de la République dès lors qu’un de ses faits constitutifs a eu lieu sur ce territoire."}, {"id": "p2", "s": "s1", "ref": "Art. 113-3 al. 1 CP", "txt": "La loi pénale française est applicable aux infractions commises à bord des navires battant un pavillon français, ou à l’encontre de tels navires, en quelque lieu qu’ils se trouvent."}, {"id": "p3", "s": "s1", "ref": "Art. 113-4 al. 1 CP", "txt": "La loi pénale française est applicable aux infractions commises à bord des aéronefs immatriculés en France, ou à l’encontre de tels aéronefs, en quelque lieu qu’ils se trouvent."}, {"id": "p4", "s": "s1", "ref": "Art. 113-6 al. 1 et 2 CP", "txt": "La loi pénale française est applicable à tout crime commis par un Français hors du territoire de la République. Elle est applicable aux délits commis par des Français hors du territoire de la République si les faits sont punis par la législation du pays où ils ont été commis."}, {"id": "p5", "s": "s1", "ref": "Art. 113-7 CP", "txt": "La loi pénale française est applicable à tout crime, ainsi qu’à tout délit puni d’emprisonnement, commis par un Français ou par un étranger hors du territoire de la République lorsque la victime est de nationalité française au moment de l’infraction."}, {"id": "p6", "s": "s1", "ref": "Art. 113-8 CP", "txt": "Dans les cas prévus aux articles 113-6 et 113-7, la poursuite des délits ne peut être exercée qu’à la requête du ministère public. Elle doit être précédée d’une plainte de la victime ou de ses ayants droit ou d’une dénonciation officielle par l’autorité du pays où le fait a été commis."}, {"id": "p7", "s": "s1", "ref": "Art. 113-9 CP", "txt": "Dans les cas prévus aux articles 113-6 et 113-7, aucune poursuite ne peut être exercée contre une personne justifiant qu’elle a été jugée définitivement à l’étranger pour les mêmes faits et, en cas de condamnation, que la peine a été subie ou prescrite."}, {"id": "p8", "s": "s1", "ref": "Art. 113-10 CP", "txt": "La loi pénale française s’applique aux crimes et délits qualifiés d’atteintes aux intérêts fondamentaux de la nation et réprimés par le titre Ier du livre IV, à la falsification et à la contrefaçon du sceau de l’État, de pièces de monnaie, de billets de banque ou d’effets publics réprimées par les articles 442-1, 442-2, 442-5, 442-15, 443-1 et 444-1 et à tout crime ou délit contre les agents ou les locaux diplomatiques ou consulaires français, commis hors du territoire de la République."}, {"id": "p9", "s": "s2", "ref": "Art. 112-1 CP", "txt": "Sont seuls punissables les faits constitutifs d’une infraction à la date à laquelle ils ont été commis. Peuvent seules être prononcées les peines légalement applicables à la même date. Toutefois, les dispositions nouvelles s’appliquent aux infractions commises avant leur entrée en vigueur et n’ayant pas donné lieu à une condamnation passée en force de chose jugée lorsqu’elles sont moins sévères que les dispositions anciennes."}, {"id": "p10", "s": "s2", "ref": "Art. 112-2 CP", "txt": "Sont applicables immédiatement à la répression des infractions commises avant leur entrée en vigueur : 1° Les lois de compétence et d’organisation judiciaire, tant qu’un jugement au fond n’a pas été rendu en première instance ; 2° Les lois fixant les modalités des poursuites et les formes de la procédure ; 3° Les lois relatives au régime d’exécution et d’application des peines ; toutefois, ces lois, lorsqu’elles auraient pour résultat de rendre plus sévères les peines prononcées par la décision de condamnation, ne sont applicables qu’aux condamnations prononcées pour des faits commis postérieurement à leur entrée en vigueur ; 4° Lorsque les prescriptions ne sont pas acquises, les lois relatives à la prescription de l’action publique et à la prescription des peines."}, {"id": "p11", "s": "s2", "ref": "Art. 112-3 CP", "txt": "Les lois relatives à la nature et aux cas d’ouverture des voies de recours ainsi qu’aux délais dans lesquels elles doivent être exercées et à la qualité des personnes admises à se pourvoir sont applicables aux recours formés contre les décisions prononcées après leur entrée en vigueur. Les recours sont soumis aux règles de forme en vigueur au jour où ils sont exercés."}, {"id": "p12", "s": "s2", "ref": "Mesure de sûreté (Cons. const., 8 déc. 2005)", "txt": "Mesure ne présentant aucun objectif répressif mais intervenant en réaction à un comportement dangereux."}, {"id": "p13", "s": "s3", "ref": "Art. 121-4 CP", "txt": "Est auteur de l’infraction la personne qui : 1° Commet les faits incriminés ; 2° Tente de commettre un crime ou, dans les cas prévus par la loi, un délit."}, {"id": "p14", "s": "s3", "ref": "Art. 121-5 CP", "txt": "La tentative est constituée dès lors que, manifestée par un commencement d’exécution, elle n’a été suspendue ou n’a manqué son effet qu’en raison de circonstances indépendantes de la volonté de son auteur."}, {"id": "p15", "s": "s3", "ref": "Commencement d’exécution (Crim. 22 mai 1984)", "txt": "Acte qui tend immédiatement et directement à la consommation de l’infraction, celle-ci étant entrée dans sa période d’exécution."}, {"id": "p16", "s": "s3", "ref": "Art. 311-1 CP", "txt": "Le vol est la soustraction frauduleuse de la chose d’autrui."}, {"id": "p17", "s": "s3", "ref": "Art. 221-1 CP", "txt": "Le fait de donner volontairement la mort à autrui constitue un meurtre. Il est puni de trente ans de réclusion criminelle."}, {"id": "p18", "s": "s3", "ref": "Art. 221-5 al. 1 CP", "txt": "Le fait d’attenter à la vie d’autrui par l’emploi ou l’administration de substances de nature à entraîner la mort constitue un empoisonnement."}, {"id": "p19", "s": "s4", "ref": "Art. 121-3 al. 3 CP", "txt": "Il y a également délit, lorsque la loi le prévoit, en cas de faute d’imprudence, de négligence ou de manquement à une obligation de prudence ou de sécurité prévue par la loi ou le règlement, s’il est établi que l’auteur des faits n’a pas accompli les diligences normales compte tenu, le cas échéant, de la nature de ses missions ou de ses fonctions, de ses compétences ainsi que du pouvoir et des moyens dont il disposait."}, {"id": "p20", "s": "s4", "ref": "Art. 121-3 al. 4 CP", "txt": "Dans le cas prévu par l’alinéa qui précède, les personnes physiques qui n’ont pas causé directement le dommage, mais qui ont créé ou contribué à créer la situation qui a permis la réalisation du dommage ou qui n’ont pas pris les mesures permettant de l’éviter, sont responsables pénalement s’il est établi qu’elles ont, soit violé de façon manifestement délibérée une obligation particulière de prudence ou de sécurité prévue par la loi ou le règlement, soit commis une faute caractérisée et qui exposait autrui à un risque d’une particulière gravité qu’elles ne pouvaient ignorer."}, {"id": "p21", "s": "s4", "ref": "Causalité directe (circulaire du 11 oct. 2000)", "txt": "La personne a soit elle-même frappé ou heurté la victime, soit initié ou contrôlé le mouvement d’un objet qui aura heurté ou frappé la victime."}, {"id": "p22", "s": "s4", "ref": "Art. 221-6 al. 1 CP", "txt": "Le fait de causer, dans les conditions et selon les distinctions prévues à l’article 121-3, par maladresse, imprudence, inattention, négligence ou manquement à une obligation de prudence ou de sécurité imposée par la loi ou le règlement, la mort d’autrui constitue un homicide involontaire puni de trois ans d’emprisonnement et de 45 000 euros d’amende."}], "rapide": [{"t": "Territorialité évidemment exclue", "s": "s1", "off": "Syllogisme complet citant 113-2, 113-3, 113-4 et Crim. 12 juill. 2016.", "rap": "Syllogisme de 3 lignes : majeure 113-2 (al. 1 et 2), mineure d’une phrase constatant qu’aucun fait constitutif ni lieu assimilé n’est en France, conclusion de la fiche. Les extensions (navire, avion, internet) ne sont citées que si un fait s’y rattache.", "gain": "≈ 4 min par cas", "risque": "Faible : le syllogisme exigé est bien là."}, {"t": "Choix du système en une phrase d’annonce", "s": "s1", "off": "Étape 2 au brouillon, puis syllogisme.", "rap": "Ouvre le second syllogisme par : « L’auteur étant français, il convient d’envisager la compétence personnelle active. » Le lecteur voit l’aiguillage sans paragraphe dédié.", "gain": "≈ 1 min", "risque": "Nul : conforme à la fiche."}, {"t": "Syllogismes 2 et 2 bis fusionnés", "s": "s2", "off": "Un syllogisme « simple / complexe », puis un « divisible / indivisible ».", "rap": "Une majeure réunissant les définitions (simple, complexe, divisible, indivisible + 1971 et 1982), une mineure, une conclusion : « Donc, il s’agit d’une loi pénale complexe divisible imposant une application distributive. »", "gain": "≈ 5 min par loi complexe", "risque": "Moyen : la fiche les sépare. À valider avec ton chargé de TD."}, {"t": "Nature et résolution en un seul syllogisme", "s": "s2", "off": "3e syllogisme (nature) puis 4e (résolution), par disposition.", "rap": "Majeure : « Selon 112-2 4°, les lois relatives à la prescription sont des lois de forme, applicables immédiatement lorsque la prescription n’est pas acquise. » Mineure : nature + condition. Conclusion : la loi s’applique ou non.", "gain": "≈ 4 min par disposition", "risque": "Moyen : très lisible, mais s’écarte du découpage officiel."}, {"t": "Réutiliser le 1er syllogisme pour plusieurs lois", "s": "s2", "off": "Un syllogisme de conflit par loi.", "rap": "Si les lois entrent en vigueur après la fin de l’infraction pour la même raison, un seul syllogisme de conflit visant chaque date : « au 12 et au 15 septembre, le recel avait pris fin ».", "gain": "≈ 3 min", "risque": "Moyen : n’y recours que si les deux lois partagent exactement la même analyse."}, {"t": "Commencement d’exécution et désistement sous une seule majeure", "s": "s3", "off": "Deux syllogismes fondés sur 121-5.", "rap": "Majeure unique (121-5 + Crim. 22 mai 1984 + jurisprudence du désistement), puis deux mineures numérotées et deux conclusions.", "gain": "≈ 3 min", "risque": "Moyen : garde les deux conclusions de la fiche."}, {"t": "Infraction formelle : couper court à la tentative", "s": "s3", "off": "Vérifier le caractère matériel, formel ou obstacle de l’infraction.", "rap": "Dès le syllogisme de l’élément matériel : « L’empoisonnement étant une infraction formelle, il est consommé indépendamment du décès ; la tentative n’a pas à être envisagée. » On économise cinq syllogismes inutiles.", "gain": "≈ 15 min", "risque": "Nul : c’est exactement ce que demande la fiche."}, {"t": "Causalité et faute enchaînées", "s": "s4", "off": "Deux syllogismes distincts.", "rap": "Garde les deux syllogismes, mais conclus le second par la faute exigée : « Donc, le lien est certain et indirect : une faute qualifiée doit être caractérisée. » Le 3e syllogisme commence alors directement par la définition de la faute retenue.", "gain": "≈ 2 min", "risque": "Faible."}, {"t": "Protagonistes traités ensemble", "s": "s4", "off": "Un raisonnement par personne.", "rap": "Si deux personnes ont commis exactement les mêmes faits (David et Laura), traite-les ensemble en le signalant ; le TD l’autorise expressément.", "gain": "≈ 10 min", "risque": "Faible si les faits sont identiques ; sinon, sépare. var CATS=[['all','Tout'],['art','Articles'],['meth','Méthode'],['why','Pourquoi'],['jur','Arrêts'],['piege','Pièges']];
R.quiz=function(){
 var P=$('#quiz');
 var h='<div class="lab">Quiz</div><h2>Des questions qui obligent à raisonner</h2><p class="lead">'+D.quiz.length+' questions : textes, étapes de méthode, raisons d’être des règles, apports des arrêts et pièges de copie. Chaque réponse est expliquée. Touches 1 à 4 pour répondre, Entrée pour continuer.</p>';
 h+='<div class="card"><div class="row"><b>Séance</b>'+[['all','Toutes'],['s1','S1'],['s2','S2'],['s3','S3'],['s4','S4'],['mix','Mélanges']].map(function(f){return '<span class="chip" data-k="s" data-v="'+f[0]+'" aria-pressed="'+(qcfg.s===f[0])+'">'+f[1]+'</span>';}).join('')+'</div><div class="row"><b>Type</b>'+CATS.map(function(f){return '<span class="chip" data-k="cat" data-v="'+f[0]+'" aria-pressed="'+(qcfg.cat===f[0])+'">'+f[1]+'</span>';}).join('')+'</div><div class="row"><b>Mode</b><span class="chip" data-k="mode" data-v="n" aria-pressed="'+(qcfg.mode==='n')+'">Série de 10</span><span class="chip" data-k="mode" data-v="w" aria-pressed="'+(qcfg.mode==='w')+'">À revoir (ratées)</span><span class="chip" data-k="mode" data-v="a" aria-pressed="'+(qcfg.mode==='a')+'">Toute la sélection</span></div><div class="row"><button class="btn" id="qgo">▶ Lancer</button><small id="qcount"></small></div></div><div id="qz"></div>';
 P.innerHTML=h;
 $$('.chip',P).forEach(function(c){c.onclick=function(){qcfg[c.dataset.k]=c.dataset.v;R.quiz();};});
 $('#qcount').textContent=pool().length+' question(s) dans la sélection';
 $('#qgo').onclick=start;
};
function pool(){return D.quiz.filter(function(q){if(qcfg.s!=='all'&&q.s!==qcfg.s)return false;if(qcfg.cat!=='all'&&q.cat!==qcfg.cat)return false;if(qcfg.mode==='w'){var r=ST.qs[q.id];return r&&r.last===0;}return true;});}
function start(){var p=shuffle(pool());if(qcfg.mode==='n')p=p.slice(0,10);if(!p.length){$('#qz').innerHTML='<div class="card">Aucune question dans cette sélection'+(qcfg.mode==='w'?' : tu n’as pas de question ratée à revoir. 👏':'.')+'</div>';return;}QQ=p;qi=0;qok=0;nextQ();}
function nextQ(){
 var Z=$('#qz');if(qi>=QQ.length){var pc=Math.round(100*qok/QQ.length);Z.innerHTML='<div class="qcard"><h3>Série terminée</h3><p class="score">'+qok+' / '+QQ.length+' · '+pc+' %</p><div class="row"><button class="btn" id="qre">Nouvelle série</button><button class="btn g" id="qw">Revoir mes erreurs</button></div></div>';$('#qre').onclick=start;$('#qw').onclick=function(){qcfg.mode='w';R.quiz();start();};if(pc>=80)add(20,'série à '+pc+' %');return;}
 var q=QQ[qi],ord=shuffle(q.o.map(function(t,i){return {t:t,ok:i===q.a};})),t0=Date.now();
 Z.innerHTML='<div class="qcard"><div class="mini">Question '+(qi+1)+' / '+QQ.length+' · '+sb(q.s==='mix'?'mix':q.s)+' '+esc((CATS.filter(function(c){return c[0]===q.cat;})[0]||['',''])[1])+'</div><div class="pbar"><b style="width:'+(100*qi/QQ.length)+'%"></b></div><div class="qq">'+esc(q.q)+'</div>'+ord.map(function(o,i){return '<button class="opt" data-i="'+i+'"><span class="kk">'+(i+1)+'</span>'+esc(o.t)+'</button>';}).join('')+'<div id="qfb"></div></div>';
 var done=false;
 function ans(i){if(done)return;done=true;var o=ord[i];$$('#qz .opt').forEach(function(x,k){x.disabled=true;if(ord[k].ok)x.classList.add('ok');});if(!o.ok)$$('#qz .opt')[i].classList.add('ko');
  var r=ST.qs[q.id]||(ST.qs[q.id]={c:0,w:0,last:0});if(o.ok){r.c++;r.last=1;qok++;run++;if(run>ST.bestRun)ST.bestRun=run;}else{r.w++;r.last=0;run=0;}ST.quizN++;save();
  try{if(window.RVSTATS&&window.RVSTATS.quiz)window.RVSTATS.quiz('q',!!o.ok,Date.now()-t0,q.id,q.s);}catch(e){}
  if(o.ok)add(5);else checkSuc();
  $('#qfb').innerHTML='<div class="fb '+(o.ok?'ok':'ko')+'"><b>'+(o.ok?'Juste.':'Non.')+'</b> '+esc(q.e)+'</div><div class="row"><button class="btn sm" id="qn">Continuer →</button></div>';$('#qn').onclick=function(){qi++;nextQ();};$('#qn').focus();}
 $$('#qz .opt').forEach(function(b){b.onclick=function(){ans(+b.dataset.i);};});
 Z.onkeydown=null;
}
document.addEventListener('keydown',function(e){if(!$('#quiz.on'))return;if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key>='1'&&e.key<='4'){var o=$$('#qz .opt')[+e.key-1];if(o&&!o.disabled)o.click();}});

/* ───── JURISPRUDENCE ───── */
var jf='all',jq='',jmode='list',jI=0,jDeck=[];
R.jur=function(){
 var P=$('#jur');
 var h='<div class="lab">Jurisprudence</div><h2>'+D.jur.length+' arrêts, rangés par étape du raisonnement</h2><p class="lead">Les arrêts reproduits dans tes TD et ceux que citent les fiches. Pour chacun : son apport en une phrase et <b>l’étape</b> où le citer dans une copie.</p><div class="card"><div class="row">'+[['all','Tous'],['s1','S1'],['s2','S2'],['s3','S3'],['s4','S4']].map(function(f){return '<span class="chip" data-f="'+f[0]+'" aria-pressed="'+(jf===f[0])+'">'+f[1]+'</span>';}).join('')+'<input type="search" id="jsr" placeholder="Rechercher (mot, date, étape)…" value="'+esc(jq)+'"></div><div class="row"><span class="chip" data-m="list" aria-pressed="'+(jmode==='list')+'">Liste</span><span class="chip" data-m="fc" aria-pressed="'+(jmode==='fc')+'">Flashcards</span><small>'+Object.keys(ST.jurOk).length+' / '+D.jur.length+' arrêts sus</small></div></div><div id="jb"></div>';
 P.innerHTML=h;
 $$('[data-f]',P).forEach(function(c){c.onclick=function(){jf=c.dataset.f;jI=0;jDeck=[];R.jur();};});
 $$('[data-m]',P).forEach(function(c){c.onclick=function(){jmode=c.dataset.m;jI=0;jDeck=[];R.jur();};});
 var sr=$('#jsr');sr.oninput=function(){jq=sr.value;rJ();};
 rJ();
};
function jl(){var q=jq.toLowerCase();return D.jur.filter(function(j){return (jf==='all'||j.s===jf)&&(!q||(j.ref+' '+j.num+' '+j.apport+' '+j.etape).toLowerCase().indexOf(q)>=0);});}
function rJ(){
 var B=$('#jb'),L=jl();
 if(jmode==='list'){B.innerHTML='<div class="grid g2">'+L.map(function(j){return '<div class="jc">'+sb(j.s)+(ST.jurOk[j.id]?' <small style="color:var(--ok)">✓ su</small>':'')+'<h4>'+esc(j.ref)+' <small>'+esc(j.num)+'</small></h4><p style="margin:4px 0">'+esc(j.apport)+'</p><span class="et">→ '+esc(j.etape)+'</span></div>';}).join('')+'</div>';return;}
 if(!jDeck.length)jDeck=shuffle(L);if(!jDeck.length){B.innerHTML='<div class="card">Aucun arrêt.</div>';return;}
 var j=jDeck[jI%jDeck.length];
 B.innerHTML='<div class="qcard flip"><div class="mini">'+(jI%jDeck.length+1)+' / '+jDeck.length+' · '+sb(j.s)+'</div><h3 style="margin:10px 0">'+esc(j.ref)+'</h3><p class="mini">'+esc(j.num)+'</p><p class="mini">Qu’apporte cet arrêt, et à quelle étape le cites-tu ?</p><div id="jans"></div><div class="row" style="justify-content:center"><button class="btn" id="jsh">Retourner la carte</button></div></div>';
 $('#jsh').onclick=function(){$('#jans').innerHTML='<p>'+esc(j.apport)+'</p><p class="et" style="font:600 .8rem JetBrains Mono,monospace;color:var(--gold)">→ '+esc(j.etape)+'</p>';this.parentNode.innerHTML='<button class="btn" id="jy">Je savais</button><button class="btn g" id="jn">À revoir</button>';
  $('#jy').onclick=function(){var nw=!ST.jurOk[j.id];ST.jurOk[j.id]=1;save();if(nw)add(6,'arrêt su');jI++;rJ();};
  $('#jn').onclick=function(){delete ST.jurOk[j.id];save();jDeck.push(j);jI++;rJ();};};
}

/* ───── PAR CŒUR ───── */
var cf='all';
R.coeur=function(){
 var P=$('#coeur');
 var h='<div class="lab">Par cœur</div><h2>Ce qui se récite au mot près</h2><p class="lead">Textes et définitions que les examinateurs attendent tels quels. Le reste du site relève de la compréhension. Mode « texte à trous » : complète les mots manquants, l’accentuation compte, pas la casse.</p><div class="row">'+[['all','Tous'],['s1','S1'],['s2','S2'],['s3','S3'],['s4','S4']].map(function(f){return '<span class="chip" data-f="'+f[0]+'" aria-pressed="'+(cf===f[0])+'">'+f[1]+'</span>';}).join('')+'<small>'+Object.keys(ST.coeur).length+' / '+D.coeur.length+' réussis</small></div>';
 h+=D.coeur.filter(function(p){return cf==='all'||p.s===cf;}).map(function(p){return '<div class="card" data-p="'+p.id+'">'+sb(p.s)+(ST.coeur[p.id]?' <small style="color:var(--ok)">✓ réussi</small>':'')+'<h3 style="margin-top:6px">'+esc(p.ref)+'</h3><div class="verb pt">'+esc(p.txt)+'</div><div class="row"><button class="btn sm" data-a="hole">Texte à trous</button><button class="btn g sm" data-a="hide">Masquer / afficher</button></div><div class="ph"></div></div>';}).join('');
 P.innerHTML=h;
 $$('[data-f]',P).forEach(function(c){c.onclick=function(){cf=c.dataset.f;R.coeur();};});
 $$('[data-p]',P).forEach(function(card){var p=D.coeur.filter(function(x){return x.id===card.dataset.p;})[0];
  $('[data-a=hide]',card).onclick=function(){var t=$('.pt',card);t.style.filter=t.style.filter?'':'blur(6px)';};
  $('[data-a=hole]',card).onclick=function(){hole(card,p);};});
};
function norm(s){return String(s).toLowerCase().replace(/[’']/g,"'").trim();}
function hole(card,p){
 var words=p.txt.split(/(\s+)/),cand=[];words.forEach(function(w,i){var c=w.replace(/[.,;:«»()]/g,'');if(c.length>=6&&!/^\d/.test(c))cand.push(i);});
 var n=Math.min(cand.length,Math.max(3,Math.round(cand.length/5))),pick=shuffle(cand).slice(0,n),ans={};
 var html=words.map(function(w,i){if(pick.indexOf(i)<0)return esc(w);var core=w.match(/^([«(]*)(.*?)([.,;:»)]*)$/);ans[i]=core[2];return esc(core[1])+'<input class="blank" data-i="'+i+'" size="'+Math.max(5,core[2].length)+'" autocomplete="off" spellcheck="false">'+esc(core[3]);}).join('');
 $('.pt',card).style.filter='blur(8px)';
 $('.ph',card).innerHTML='<div class="enonce" style="line-height:2.1">'+html+'</div><div class="row"><button class="btn sm" data-a="chk">Vérifier</button><span class="hr"></span></div>';
 $('[data-a=chk]',card).onclick=function(){var ok=0,inp=$$('.blank',card);inp.forEach(function(x){var g=norm(x.value)===norm(ans[x.dataset.i]);x.classList.toggle('ok',g);x.classList.toggle('ko',!g);if(g)ok++;else x.title=ans[x.dataset.i];});
  $('.hr',card).innerHTML=ok+' / '+inp.length+(ok<inp.length?' · survole les cases rouges pour la réponse':'');
  if(ok===inp.length){var nw=!ST.coeur[p.id];ST.coeur[p.id]=1;save();if(nw)add(12,'texte récité');$('.pt',card).style.filter='';}};
}

/* ───── VOIE RAPIDE ───── */
R.rap=function(){
 ST.rap=1;save();
 var P=$('#rap');
 var h='<div class="lab">Voie rapide</div><h2>Gagner du temps sans trahir la méthode</h2><p class="lead">Tes corrigés suivent la fiche à la lettre. Voici les endroits où l’on peut condenser, avec le gain estimé et le risque. <b>Ce qui est marqué « moyen » est à valider avec ton chargé de TD avant le partiel.</b></p>';
 h+=D.rapide.map(function(r){var rk=/^Nul/.test(r.risque)?'n':(/^Faible/.test(r.risque)?'f':'m');return '<div class="card"><div class="row" style="margin:0 0 8px">'+sb(r.s)+'<h3 style="margin:0">'+esc(r.t)+'</h3></div><div class="rp"><div class="o"><div class="lab">Méthode officielle</div>'+esc(r.off)+'</div><div class="r"><div class="lab" style="color:var(--s4)">Voie rapide</div>'+esc(r.rap)+'</div></div><div class="row"><span class="chip" style="cursor:default">⏱ '+esc(r.gain)+'</span><span class="risk '+rk+'">Risque : '+esc(r.risque)+'</span></div></div>';}).join('');
 P.innerHTML=h;checkSuc();
};

 var P=$('#succes'),n=Object.keys(GOT).length;
 P.innerHTML='<div class="lab">Succès</div><h2>'+n+' / '+SUC.length+' débloqués</h2><p class="lead">Rang actuel : <b>'+rank()+'</b> · '+XP+' XP. Les succès et l’XP remontent dans le hub L2.</p><div class="sg">'+SUC.map(function(s){var on=!!GOT[s[0]];return '<div class="su'+(on?' on':'')+'"><div class="ic">'+s[1]+'</div><h4>'+esc(s[2])+'</h4><small>'+esc(s[3])+'</small></div>';}).join('')+'</div>';

$('#bar').innerHTML=TABS.map(function(t){return '<button class="tab" data-p="'+t[0]+'">'+t[1]+'</button>';}).join('');

hdr();
var h0=(location.hash||'').slice(1);go(TABS.some(function(t){return t[0]===h0;})?h0:'home');
window.ST=ST;
/* poussière dorée */
(function(){var c=$('#dust');if(!c||!c.getContext)return;if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;var x=c.getContext('2d'),W,H,P=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight;}rs();addEventListener('resize',rs);for(var i=0;i<46;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,v:Math.random()*.00025+.00008,a:Math.random()*.5+.15});
 (function f(){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;if(p.y<0)p.y=1;x.beginPath();x.arc(p.x*W+Math.sin(p.y*20)*6,p.y*H,p.r,0,6.3);x.fillStyle='rgba(240,210,138,'+p.a+')';x.fill();});requestAnimationFrame(f);})();})();

<script>/* ===== Liaison au hub L2 : temps actif, XP, succès, quiz, activité, insight (clé rvision_<profil>_<cours>_*) ===== */
(function(){
var H=window.__HUB;if(!H)return;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
function user(){return ls('rvision_current_user')||'';}
function P(){var u=user();return (u?'rvision_'+u+'_':'rvision_')+H.key+'_';}
function today(){return new Date().toISOString().slice(0,10);}
var I=null,act={},lastAct=Date.now(),mouse=false,acc=0,curSec='';
function load(){
  try{I=JSON.parse(ls(P()+'insight')||'null');}catch(e){I=null;}
  if(!I||typeof I!=='object')I={};
  I.totalActiveMs=I.totalActiveMs||0;I.pauseCount=I.pauseCount||0;I.quiz=I.quiz||{};I.flashcards=I.flashcards||{};I.sections=I.sections||{};I.nQ=I.nQ||0;
  try{act=JSON.parse(ls(P()+'activity')||'{}')||{};}catch(e){act={};}
}
load();
function secOn(){var p=document.querySelector('.panel.on');return p?H.key+':'+p.id:'';}
function enter(id){if(!id)return;var s=I.sections[id]||(I.sections[id]={visits:0,activeMs:0,highlights:0,mouseActive:false});s.visits++;}
function sizeOf(o){var n=0;for(var k in o)n++;return n;}
function flush(){
  try{
    var p=P();
    ls(p+'time',Math.round(I.totalActiveMs/1000));
    ls(p+'activity',JSON.stringify(act));
    ls(p+'lastvisit',Date.now());
    ls(p+'insight',JSON.stringify(I));
    ls(p+'quiz',I.nQ);
    var xp=+ls(H.pref+'xp')||0;ls(p+'xp',xp);
    var got={};try{got=JSON.parse(ls(H.pref+'suc')||'{}')||{};}catch(e){}
    ls(p+'succes',Array.isArray(got)?got.length:sizeOf(got));
    var st=window.ST||{};ls(p+'flame',JSON.stringify({best:st.bestRun||0,cur:0}));
  }catch(e){}
}
['pointermove','mousemove','keydown','scroll','click','touchstart','wheel'].forEach(function(ev){
  addEventListener(ev,function(){lastAct=Date.now();if(ev==='pointermove'||ev==='mousemove')mouse=true;},{passive:true,capture:true});
});
var STEP=5000;
setInterval(function(){
  var sid=secOn();
  if(sid!==curSec){curSec=sid;enter(sid);}
  if(document.hidden||Date.now()-lastAct>45000){return;}
  I.totalActiveMs+=STEP;acc+=STEP;
  if(curSec){var s=I.sections[curSec];if(s){s.activeMs+=STEP;if(mouse)s.mouseActive=true;}}
  if(acc>=15000){acc-=15000;var d=today();act[d]=(act[d]||0)+1;}
  flush();
},STEP);
document.addEventListener('visibilitychange',function(){if(document.hidden)flush();});
addEventListener('pagehide',flush);
addEventListener('storage',function(e){if(e.key==='rvision_current_user'){load();}});
flush();
var R=window.RVSTATS=window.RVSTATS||{};
var prev=R.quiz;
R.quiz=function(kind,ok,ms,id,ch){
  try{if(typeof prev==='function')prev.apply(this,arguments);}catch(e){}
  I.nQ=(I.nQ||0)+1;
  if(id){
    var q=I.quiz[id]||(I.quiz[id]={correct:0,wrong:0,responseTimes:[],errorStreak:0,streak:0,bestStreak:0});
    if(ok){q.correct++;q.streak++;q.errorStreak=0;if(q.streak>q.bestStreak)q.bestStreak=q.streak;}
    else{q.wrong++;q.streak=0;q.errorStreak++;}
    if(ms>=300&&ms<60000){q.responseTimes.push(Math.round(ms));if(q.responseTimes.length>30)q.responseTimes.shift();}
  }
  flush();
};
window.RVHUB={key:H.key,flush:flush,insight:function(){return I;}};
(function(){
  var q;try{q=new URLSearchParams(location.search);}catch(e){return;}
  var g=q.get('goto');if(!g)return;
  function go(){try{if(typeof window.goTab==='function')window.goTab(g);}catch(e){}}
  if(document.readyState==='complete')setTimeout(go,200);else addEventListener('load',function(){setTimeout(go,200);});
})();
})();
</script>
