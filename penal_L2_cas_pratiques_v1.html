:root{color-scheme:dark;--bg:#0c0608;--bg2:#140a0d;--ink:#eadfce;--mut:#b8a695;--card:#171013;--glass:rgba(255,238,214,.04);--line:rgba(226,190,106,.20);--red:#e5546b;--redb:#b3122b;--deep:#2b0a14;--hd:#f4e2b4;--gold:#d4a937;--gold2:#f0d28a;--ok:#5fbf8f;--ko:#e5546b;
--s1:#6aa2ee;--s2:#c58cf0;--s3:#f0a35e;--s4:#5fc8b0;--mix:#f0d28a;--shadow:0 14px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box}*{scrollbar-color:#6b4a1e #120a0c;scrollbar-width:thin}
::selection{background:var(--gold);color:#1a0b0e}
html{background:radial-gradient(1100px 620px at 78% -8%,rgba(150,30,55,.30),transparent 62%),radial-gradient(900px 600px at 6% 8%,rgba(212,169,55,.10),transparent 60%),radial-gradient(1200px 700px at 50% 110%,rgba(90,15,35,.35),transparent 65%),var(--bg);background-attachment:fixed;scroll-padding-top:120px}
body{margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:17px;line-height:1.7;color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>")}
#dust{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:28px 18px 120px}
b,strong{color:#fff3d6;font-weight:600}
a{color:var(--gold2)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--hd);line-height:1.2;margin:0 0 .5em}
h2{font-size:1.9rem}h3{font-size:1.25rem}
.mono{font-family:'JetBrains Mono',monospace}
small,.mini{font-size:.82rem;color:var(--mut)}
/* header */
body>header{position:sticky;top:0;z-index:500;background:linear-gradient(180deg,rgba(24,9,14,.94),rgba(14,6,9,.86));backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.6);border-bottom:1px solid rgba(240,210,138,.15)}
body>header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);opacity:.7}
.hin{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:1500px;margin:0 auto}
.logo{display:flex;align-items:center;gap:11px;font-family:'Playfair Display',serif;font-weight:900;font-size:1.12rem;color:var(--hd);white-space:nowrap;cursor:pointer;line-height:1.05;text-decoration:none}
.logo .lg{color:var(--gold2);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);font-size:1.1rem;background:radial-gradient(circle at 35% 30%,rgba(240,210,138,.35),rgba(212,169,55,.06));box-shadow:0 0 18px rgba(212,169,55,.35)}
.logo small{display:block;font:400 .6rem 'JetBrains Mono',monospace;letter-spacing:.14em;color:var(--mut);text-transform:uppercase;margin-top:3px}
.back{font:600 .72rem 'JetBrains Mono',monospace;color:var(--mut);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.back:hover{color:var(--gold2);border-color:var(--gold)}
.bar{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;padding:4px 2px;align-items:center}
.bar::-webkit-scrollbar{display:none}
.tab{position:relative;background:transparent;border:1px solid transparent;color:#d9c9b5;padding:7px 12px;font:600 .8rem 'Source Serif 4',serif;border-radius:999px;white-space:nowrap;cursor:pointer;transition:all .25s;flex:none}
.tab:hover{color:#fff;background:rgba(240,210,138,.09);border-color:rgba(240,210,138,.25)}
.tab[aria-selected=true]{background:linear-gradient(180deg,#f3d98f,#c9a032);color:#2a1008;border-color:#f3d98f;box-shadow:0 6px 22px rgba(212,169,55,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.xp{min-width:150px;font:600 .66rem 'JetBrains Mono',monospace;color:var(--gold2);letter-spacing:.04em}
.xp i{display:block;height:5px;background:rgba(255,255,255,.1);border-radius:6px;margin-top:4px;overflow:hidden}
.xp b{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#b3122b,var(--gold),var(--gold2));box-shadow:0 0 10px rgba(240,210,138,.6);transition:width .6s}
@media(max-width:1250px){.xp{display:none}.logo small{display:none}}
@media(max-width:760px){.logo span.lt{display:none}.back{display:none}.hin{padding:8px 10px}}
/* panels */
.panel{display:none}.panel.on{display:block;animation:pin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lab{font:600 .7rem 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lead{color:var(--mut);max-width:780px}
.card{background:linear-gradient(180deg,rgba(255,238,214,.055),rgba(255,238,214,.02));border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin:0 0 18px;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,#f3d98f,#c9a032);color:#2a1008;border:0;border-radius:999px;padding:9px 18px;font:700 .86rem 'Source Serif 4',serif;cursor:pointer;box-shadow:0 6px 18px rgba(212,169,55,.3);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(212,169,55,.45)}
.btn.g{background:transparent;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
.btn.g:hover{background:rgba(240,210,138,.08)}
.btn.sm{padding:6px 12px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font:600 .74rem 'JetBrains Mono',monospace;color:var(--mut);background:rgba(255,255,255,.02);cursor:pointer;user-select:none;transition:all .2s}
.chip[aria-pressed=true]{color:#1a0b0e;background:var(--gold2);border-color:var(--gold2)}
.sb{display:inline-block;font:700 .66rem 'JetBrains Mono',monospace;letter-spacing:.06em;border-radius:6px;padding:2px 7px;color:#140a0d;margin-right:4px;vertical-align:middle}
.sb.s1{background:var(--s1)}.sb.s2{background:var(--s2)}.sb.s3{background:var(--s3)}.sb.s4{background:var(--s4)}.sb.mix{background:var(--mix)}
.vig{border-left:3px solid var(--red);background:rgba(229,84,107,.08);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0}
.why{border-left:3px solid var(--gold);background:rgba(212,169,55,.07);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0}
.eco{border-left:3px solid var(--s4);background:rgba(95,200,176,.07);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0}
.vig>small,.why>small,.eco>small{display:block;font:700 .66rem 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.vig>small{color:var(--red)}.why>small{color:var(--gold)}.eco>small{color:var(--s4)}
.verb{font-style:italic;color:#fff1cf;background:rgba(240,210,138,.06);border:1px dashed rgba(240,210,138,.35);border-radius:10px;padding:8px 12px;margin:6px 0}
.verb::before{content:"À retenir mot pour mot";display:block;font:700 .6rem 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-bottom:2px}
table.tb{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
table.tb th{background:rgba(240,210,138,.08);color:var(--gold2);font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
.tbw{overflow-x:auto}
details{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:rgba(255,255,255,.015)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--hd);list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--gold);transition:transform .2s}
details[open]>summary::before{transform:rotate(90deg)}
details>.dp{padding:0 18px 14px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:38px 34px;margin-bottom:22px;border:1px solid rgba(240,210,138,.28);background:radial-gradient(700px 300px at 85% 0%,rgba(212,169,55,.18),transparent 60%),linear-gradient(135deg,rgba(43,10,20,.95),rgba(16,7,10,.95));box-shadow:var(--shadow)}
.hero h1{font-size:2.4rem;margin:.2em 0 .3em}
.hero .seal{position:absolute;right:28px;top:22px;width:150px;height:150px;opacity:.9}
@media(max-width:700px){.hero .seal{display:none}.hero h1{font-size:1.8rem}}
.kpi{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.kpi>div{flex:1;min-width:130px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:700 1.6rem 'Playfair Display',serif;color:var(--gold2)}
.kpi small{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.cd input{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 8px;font:inherit;font-size:.85rem;color-scheme:dark}
/* séance progress */
.sp{display:flex;gap:12px;align-items:center}
.ring{--p:0;--c:var(--gold);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:#140a0d;display:grid;place-items:center;font:700 .8rem 'JetBrains Mono',monospace;color:#fff3d6}
.plan li{list-style:none;margin:4px 0}
.plan label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.plan input{accent-color:var(--gold);margin-top:6px}
.day{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.02)}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(240,210,138,.3),0 0 24px rgba(212,169,55,.15)}
.day h4{margin:0 0 6px;font:700 .95rem 'Playfair Display',serif;color:var(--hd)}
/* flow */
.flow{display:flex;flex-direction:column;gap:0;margin:10px 0}
.fs{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:stretch}
.fs .n{display:flex;flex-direction:column;align-items:center}
.fs .n i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 .9rem 'JetBrains Mono',monospace;font-style:normal;color:#1a0b0e;background:var(--gold2);box-shadow:0 0 18px rgba(240,210,138,.35);flex:none}
.fs .n::after{content:"";flex:1;width:2px;background:linear-gradient(var(--gold),transparent);margin:4px 0}
.fs:last-child .n::after{display:none}
.fs .b{padding:6px 0 18px}
.fs .b h4{margin:6px 0 2px;font:700 1.02rem 'Playfair Display',serif;color:var(--hd)}
.fs .b p{margin:2px 0;color:var(--ink)}
.fs .b .ref{font:600 .72rem 'JetBrains Mono',monospace;color:var(--gold)}
/* séance tabs */
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 18px}@media(max-width:800px){.stabs{grid-template-columns:1fr 1fr}}
.stab{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;font:600 .9rem 'Source Serif 4',serif;text-align:left}
.stab small{display:block}
.stab[aria-selected=true]{border-color:var(--gold);background:rgba(240,210,138,.1);box-shadow:0 0 0 1px rgba(240,210,138,.25)}
.syl{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;background:rgba(255,255,255,.02)}
.syl h4{margin:0 0 6px;font:700 1rem 'Playfair Display',serif;color:var(--hd)}
.syl .k{font:700 .64rem 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-right:6px}
.syl p{margin:6px 0}
/* cas */
.clist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ci{text-align:left;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:linear-gradient(180deg,rgba(255,238,214,.05),rgba(255,238,214,.015));color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s,border-color .2s;position:relative}
.ci:hover{transform:translateY(-2px);border-color:var(--gold)}
.ci h4{margin:6px 0 4px;font:700 1.02rem 'Playfair Display',serif;color:var(--hd)}
.ci .done{position:absolute;top:10px;right:12px;font:700 .72rem 'JetBrains Mono',monospace;color:var(--ok)}
.enonce{background:rgba(255,248,235,.035);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:10px 0}
.q{font-weight:600;color:#fff3d6}
textarea{width:100%;min-height:180px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;color:var(--ink);font:15px/1.6 'Source Serif 4',serif;padding:12px 14px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(240,210,138,.5);outline-offset:1px}
.timer{font:700 1.4rem 'JetBrains Mono',monospace;color:var(--gold2);min-width:90px}
.timer.over{color:var(--red)}
.step{display:none}.step.on{display:block;animation:pin .4s}
.ckl label{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
.ckl input{accent-color:var(--gold);margin-top:6px}
.score{font:700 2rem 'Playfair Display',serif;color:var(--gold2)}
/* quiz */
.qcard{border:1px solid var(--line);border-radius:18px;padding:20px 22px;background:linear-gradient(180deg,rgba(255,238,214,.06),rgba(255,238,214,.02))}
.qq{font-size:1.1rem;margin:6px 0 14px;color:#fff3d6}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--ink);padding:11px 14px;margin:8px 0;font:inherit;cursor:pointer;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(240,210,138,.06)}
.opt .kk{font:700 .72rem 'JetBrains Mono',monospace;color:var(--gold);margin-right:8px}
.opt.ok{border-color:var(--ok);background:rgba(95,191,143,.13)}
.opt.ko{border-color:var(--ko);background:rgba(229,84,107,.13)}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04)}
.fb.ok{border-left:3px solid var(--ok)}.fb.ko{border-left:3px solid var(--ko)}
.pbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 12px}
.pbar b{display:block;height:100%;background:linear-gradient(90deg,#b3122b,var(--gold),var(--gold2));transition:width .4s}
select,input[type=search],input[type=text]{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:.9rem}
/* jur */
.jc{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.02)}
.jc h4{margin:4px 0;font:700 .98rem 'Playfair Display',serif;color:var(--hd)}
.jc .et{font:600 .68rem 'JetBrains Mono',monospace;color:var(--gold)}
.flip{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center}
/* coeur */
.blank{display:inline-block;min-width:80px;background:rgba(0,0,0,.3);border:1px solid var(--gold);border-radius:6px;color:var(--gold2);padding:1px 6px;font:inherit;font-size:.95em;margin:0 2px}
.blank.ok{border-color:var(--ok);color:var(--ok)}.blank.ko{border-color:var(--ko);color:var(--ko)}
/* rapide */
.rp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.rp{grid-template-columns:1fr}}
.rp>div{border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.rp .o{background:rgba(255,255,255,.02)}.rp .r{background:rgba(95,200,176,.06);border-color:rgba(95,200,176,.35)}
.risk{font:700 .68rem 'JetBrains Mono',monospace;padding:2px 8px;border-radius:6px}
.risk.f{background:rgba(95,191,143,.2);color:var(--ok)}.risk.m{background:rgba(240,163,94,.2);color:var(--s3)}.risk.n{background:rgba(106,162,238,.2);color:var(--s1)}
/* succès */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.su{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:rgba(255,255,255,.02);opacity:.5;filter:grayscale(.8)}
.su.on{opacity:1;filter:none;border-color:var(--gold);background:radial-gradient(circle at 50% 0%,rgba(240,210,138,.16),rgba(255,255,255,.02));box-shadow:0 0 22px rgba(212,169,55,.12)}
.su .ic{font-size:1.8rem}.su h4{margin:6px 0 2px;font:700 .92rem 'Playfair Display',serif;color:var(--hd)}
/* toast */
#toasts{position:fixed;right:16px;bottom:18px;z-index:1200;display:flex;flex-direction:column-reverse;gap:8px;max-width:min(360px,92vw)}
.toast{background:linear-gradient(135deg,#2a0d16,#1a0a0f);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);animation:pin .4s}
.toast b{color:var(--gold2)}
.ord{display:flex;flex-direction:column;gap:8px}
.ordi{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.ordi:hover{border-color:var(--gold)}
.ordi.pick{opacity:.35;cursor:default}
.ordo{counter-reset:o;padding:0;margin:8px 0}
.ordo li{list-style:none;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;margin:6px 0;background:rgba(240,210,138,.07)}
.ordo li::before{counter-increment:o;content:counter(o) ". ";font:700 .8rem 'JetBrains Mono',monospace;color:var(--gold)}
.ordo li.ok{border-color:var(--ok)}.ordo li.ko{border-color:var(--ko)}
.ind{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.02);font-size:.93rem}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:30px 10px 60px;position:relative;z-index:2}
@media(prefers-reduced-motion:reduce){.panel.on,.step.on,.toast{animation:none}}

<script type="application/json" id="D">{"trames": [{"id": "s1", "n": 1, "titre": "L’application de la loi pénale dans l’espace", "court": "Espace", "declic": "Un élément d’extranéité : lieu à l’étranger, auteur ou victime étranger, navire, avion, internet.", "idee": "La loi pénale française s’applique d’abord là où la France est souveraine : son territoire. Hors du territoire, elle ne s’applique que si un lien suffisant la rattache aux faits : la nationalité de l’auteur, celle de la victime, l’atteinte à l’État lui-même, ou une convention internationale.", "eco": "Pense à la souveraineté comme à un <b>droit de propriété<\/b> sur un espace : l’État « possède » l’ordre public de son sol. Le navire et l’avion sont des parcelles mobiles de cette propriété, rattachées par le pavillon ou l’immatriculation. Hors de ses parcelles, l’État n’intervient que s’il a un intérêt propre : protéger un national (actif ou victime), défendre ses biens publics (sa monnaie, son sceau), ou honorer un engagement international.", "schema": [["1", "Territorialité", "Syllogisme TOUJOURS rédigé, même si l’exclusion est évidente", "113-2 · 113-3 · 113-4 · Crim. 12 juill. 2016"], ["?", "Elle s’applique ?", "OUI → stop, la loi française est applicable · NON → étape 2", ""], ["2", "Choisir le système (au brouillon)", "Auteur français → active · Victime française → passive · Intérêts fondamentaux → réelle · Convention → universelle", ""], ["3", "Appliquer le système pertinent", "Second syllogisme, un seul système", "113-6/113-8/113-9 · 113-7 · 113-10 · 689-1 CPP"]], "etapes": [{"t": "1re étape · Application ou exclusion du principe de territorialité", "txt": "Quels que soient les faits, on vérifie si le principe de territorialité s’applique. <b>Un syllogisme doit systématiquement être produit<\/b>, même lorsque l’exclusion relève de l’évidence.<ul><li><b>Art. 113-2 al. 1<\/b> : infraction commise sur le territoire de la République.<\/li><li><b>Art. 113-2 al. 2<\/b> : infraction <i>réputée<\/i> commise en France dès qu’<b>un de ses faits constitutifs<\/b> y a eu lieu.<\/li><li><b>Lieux assimilés<\/b> : aéronef immatriculé en France (113-4) ; navire battant pavillon français (113-3) — <b>navigation maritime seulement<\/b>, pas fluviale (Crim. 18 sept. 2007).<\/li><li><b>Internet<\/b> : infraction commise à l’étranger réputée commise en France si le <b>public français est précisément visé<\/b>, et pas seulement si le contenu est accessible en France (Crim. 12 juill. 2016, n°15-86.645).<\/li><\/ul>", "pourquoi": "La territorialité est le principe parce qu’elle exprime la souveraineté : l’État punit ce qui trouble l’ordre public chez lui, quel que soit l’auteur. L’al. 2 (théorie de l’ubiquité) traite l’infraction comme un processus : il suffit qu’un maillon de la chaîne se produise en France pour que le trouble y soit ressenti.", "piege": "Ne saute jamais ce syllogisme, même pour des faits commis à New York. Un bateau sur le Rhin n’est pas un « navire » au sens de 113-3 (Crim. 18 sept. 2007). Un simple mensonge écrit depuis la France ne suffit pas à localiser une escroquerie : il faut de véritables manœuvres (Crim. 19 avr. 1983). La connexité ne rend pas la loi française applicable aux faits commis à l’étranger ; seule l’<b>indivisibilité<\/b> le peut (Crim. 31 mai 2016)."}, {"t": "2e étape · Identification du système de compétence (au brouillon)", "txt": "Si la territorialité ne s’applique pas, on choisit <b>l’unique<\/b> système pertinent au regard des faits :<ul><li>Auteur <b>français<\/b> → compétence personnelle <b>active<\/b><\/li><li>Victime <b>française<\/b> → compétence personnelle <b>passive<\/b><\/li><li>Atteinte aux <b>intérêts fondamentaux de la nation<\/b> → compétence <b>réelle<\/b><\/li><li>Infraction visée par une <b>convention<\/b> + auteur présent en France → compétence <b>universelle<\/b><\/li><\/ul>", "pourquoi": "Cette étape reste au brouillon parce qu’elle est un aiguillage, pas un raisonnement : la copie ne doit contenir que le système retenu, justifié par le fait qui le déclenche (la nationalité, la nature de l’infraction).", "piege": "Fais une qualification sommaire au brouillon (crime ? délit puni d’emprisonnement ?) : c’est elle qui conditionne la réciprocité (113-6), le seuil de 113-7 et la requête du ministère public (113-8)."}, {"t": "3e étape · Application du système de compétence pertinent", "txt": "<table class='tb'><tr><th>Système<\/th><th>Fondement<\/th><th>Conditions<\/th><\/tr><tr><td><b>Personnelle active<\/b><\/td><td>113-6 CP<\/td><td>Auteur français ayant commis un crime ou un délit à l’étranger.<br>• <b>Délit<\/b> : réciprocité d’incrimination (113-6) ; requête préalable du ministère public, après plainte de la victime ou de ses ayants droit ou dénonciation officielle du pays des faits (113-8).<br>• <b>Crime<\/b> : pas de réciprocité.<br>• Crime ou délit : pas de poursuite si l’auteur a été définitivement jugé à l’étranger et, en cas de condamnation, si la peine a été subie ou est prescrite (113-9).<\/td><\/tr><tr><td><b>Personnelle passive<\/b><\/td><td>113-7 CP<\/td><td>Victime française <b>au moment des faits<\/b> ; crime ou <b>délit puni d’emprisonnement<\/b> ; <b>aucune<\/b> réciprocité ; 113-8 pour les délits ; 113-9 dans tous les cas.<\/td><\/tr><tr><td><b>Réelle<\/b><\/td><td>113-10 CP<\/td><td>Crime ou délit du titre Ier du livre IV (intérêts fondamentaux), contrefaçon du sceau de l’État, de pièces de monnaie, de billets (442-1, 442-2…), ou crime ou délit contre les agents ou locaux diplomatiques ou consulaires français, commis hors du territoire, <b>quelle que soit la nationalité de l’auteur<\/b>.<\/td><\/tr><tr><td><b>Universelle<\/b><\/td><td>689-1 CPP<\/td><td>Auteur <b>présent en France<\/b> (habituellement ou occasionnellement) ; infraction commise ou tentée à l’étranger et visée par l’un des art. 689-2 à 689-14 CPP (ex. : torture, 689-2) ; pas de jugement définitif avec peine subie ou prescrite (692 CPP).<\/td><\/tr><\/table>", "pourquoi": "<b>Active<\/b> : la France n’extrade pas ses nationaux ; sans cette compétence, le Français qui commet un crime à l’étranger puis rentre serait impuni. La réciprocité (délits) respecte la légalité : on ne punit pas un Français pour un acte licite là où il l’a commis. <b>Passive<\/b> : l’État protège ses ressortissants ; le seuil (délit puni d’emprisonnement) évite de mobiliser la justice pour des faits mineurs. <b>113-8<\/b> : un filtre diplomatique et procédural, le parquet décide. <b>Réelle<\/b> : personne d’autre ne défendra la monnaie ou le sceau de la France. <b>Universelle<\/b> : certains crimes heurtent toutes les nations ; la présence de l’auteur fournit le lien.", "piege": "La compétence passive suppose une victime <b>directe<\/b> française : l’épouse française d’une victime étrangère torturée à l’étranger ne suffit pas (Crim. 8 nov. 2016). Le juge doit vérifier lui-même la réciprocité et la plainte préalable de 113-8 (Crim. 26 mai 2010). Une transaction étrangère n’a pas autorité de chose jugée si les faits ont été commis, même en partie, en France (692 CPP, Crim. 17 janv. 2018)."}], "sylls": [{"t": "1er syllogisme · Application ou exclusion du principe de territorialité", "quand": "Toujours.", "maj": "<b>113-2 CP<\/b> : infraction commise sur le territoire, ou dont l’un des éléments constitutifs l’est. <b>113-2 + 113-3<\/b> : à bord d’un navire battant pavillon français. <b>113-2 + 113-4<\/b> : à bord d’un aéronef immatriculé en France. <b>113-2 + Crim. 12 juill. 2016<\/b> : infraction commise à l’étranger sur internet, public français spécifiquement visé.", "min": "Appliquer aux faits chacune des conditions énoncées en majeure, en les vérifiant une par une.", "concl": ["Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française."]}, {"t": "2d syllogisme · Personnelle active", "quand": "Territorialité exclue + auteur français.", "maj": "<b>113-6 CP<\/b>, <b>113-8<\/b>, et éventuellement <b>113-9<\/b> si un jugement de l’auteur à l’étranger est mentionné dans les faits.", "min": "Appliquer aux faits chacune des conditions de la majeure.", "concl": ["Donc, le système de compétence personnelle active tend à s’appliquer et la loi pénale française est applicable.", "Donc, le système de compétence personnelle active ne s’appliquant pas, il ne permet pas l’application de la loi pénale française."]}, {"t": "2d syllogisme · Personnelle passive", "quand": "Territorialité exclue + victime française.", "maj": "<b>113-7 CP<\/b>, <b>113-8<\/b>, et éventuellement <b>113-9<\/b>.", "min": "Appliquer aux faits chacune des conditions de la majeure.", "concl": ["Donc, le système de compétence personnelle passive tend à s’appliquer et la loi pénale française est applicable.", "Donc, le système de compétence personnelle passive ne s’appliquant pas, il ne permet pas l’application de la loi pénale française."]}, {"t": "2d syllogisme · Réelle", "quand": "Territorialité exclue + atteinte aux intérêts fondamentaux, monnaie, sceau, agents ou locaux diplomatiques.", "maj": "<b>113-10 CP<\/b> et l’une des incriminations du titre Ier du livre IV (ou les autres textes visés par 113-10).", "min": "Sans nécessairement qualifier l’infraction, l’<b>identifier<\/b> simplement et vérifier les conditions de 113-10.", "concl": ["Donc, le système de compétence réelle tend à s’appliquer et la loi pénale française est applicable.", "Donc, le système de compétence réelle ne s’appliquant pas, il ne permet pas l’application de la loi pénale française."]}, {"t": "2d syllogisme · Universelle", "quand": "Territorialité exclue + infraction conventionnelle + auteur présent en France.", "maj": "<b>689-1 CPP<\/b> + l’un des art. <b>689-2 à 689-14 CPP<\/b> visant l’infraction, et éventuellement <b>692 CPP<\/b> si un jugement étranger est mentionné.", "min": "Sans qualifier l’infraction, l’identifier et vérifier les conditions de 689-1 (et 692 le cas échéant).", "concl": ["Donc, le système de compétence universelle tend à s’appliquer et la loi pénale française est applicable.", "Donc, le système de compétence universelle ne s’appliquant pas, il ne permet pas l’application de la loi pénale française."]}], "vig": []}, {"id": "s2", "n": 2, "titre": "L’application de la loi pénale dans le temps", "court": "Temps", "declic": "Une loi nouvelle entre en vigueur entre la commission des faits et leur jugement définitif.", "idee": "On ne peut pas punir quelqu’un en vertu d’une règle qui n’existait pas quand il a agi. La loi nouvelle plus douce, elle, profite au délinquant. Les lois de procédure s’appliquent tout de suite, sous conditions. Tout le raisonnement consiste à savoir <b>quelle sorte de loi<\/b> on a devant soi pour lui appliquer le bon régime.", "eco": "Compare deux lois comme deux <b>offres contractuelles<\/b> : si leurs clauses forment un tout (loi indivisible), on compare les offres en bloc. On ne compose pas une troisième offre en prenant le meilleur de chacune, ce serait créer une loi que personne n’a votée. Si les clauses sont indépendantes (loi divisible), chacune est un contrat séparé et se juge séparément. Le prix de référence pour comparer la répression, c’est la <b>peine privative de liberté<\/b>.", "schema": [["1", "Conflit de lois ?", "Infraction commise sous la loi ancienne + pas de jugement définitif à l’entrée en vigueur", "112-1 CP · art. 1er C. civ."], ["2", "Loi simple ou complexe ?", "Une modification ou plusieurs", ""], ["2 bis", "Si complexe : divisible ou indivisible ?", "Objets distincts → application distributive · Même objet → appréciation globale", "Crim. 21 avr. 1982 · Crim. 5 juin 1971"], ["3", "Fond, forme ou mesure de sûreté ?", "Pour chaque disposition si divisible", "112-2 CP · Cons. const. 8 déc. 2005"], ["4", "Résolution", "Forme : application immédiate (sous conditions) · Fond : non-rétroactivité in pejus / rétroactivité in mitius · Sûreté : application immédiate", "112-1 · 112-2 · Crim. 26 nov. 1997"]], "etapes": [{"t": "1re étape · Identification d’un conflit de lois pénales dans le temps", "txt": "Deux conditions <b>cumulatives<\/b> (112-1 CP) :<ol><li>Une infraction a été commise sous l’empire d’une loi pénale ancienne ;<\/li><li>Elle n’a pas encore fait l’objet d’un <b>jugement définitif<\/b> lorsque la loi nouvelle entre en vigueur.<\/li><\/ol>Vigilance sur :<ul><li><b>La nature de l’infraction<\/b> : infraction <b>continue<\/b> (recel), <b>complexe<\/b> (escroquerie), <b>d’habitude<\/b> (exercice illégal de la médecine). Si sa commission se poursuit ou s’achève après l’entrée en vigueur de la loi nouvelle, l’infraction est commise sous la loi nouvelle : <b>pas de conflit<\/b>.<\/li><li><b>La date d’entrée en vigueur<\/b> : celle que fixe la loi ; à défaut, le <b>lendemain de sa publication au JORF<\/b>.<\/li><\/ul>", "pourquoi": "Sans conflit, pas de question : la loi en vigueur au moment des faits s’applique naturellement. On vérifie d’abord qu’il y a vraiment deux lois candidates pour les mêmes faits.", "piege": "Le recel dure tant que le receleur détient la chose (Crim. 16 juill. 1964) : il s’achève au dessaisissement. L’escroquerie n’est consommée qu’à la remise, voire à la dernière remise si les manœuvres forment un tout (Crim. 17 déc. 1974). L’infraction d’habitude n’existe qu’au deuxième acte (Crim. 3 mars 1971). L’usure, elle, est instantanée (Crim. 24 mars 1965)."}, {"t": "2e étape · Loi pénale simple ou complexe", "txt": "<b>Loi simple<\/b> : elle opère une modification unique (ex. : seulement le délai de prescription).<br><b>Loi complexe<\/b> : elle opère plusieurs modifications (ex. : l’incrimination d’une part, la peine d’emprisonnement d’autre part).", "pourquoi": "Cette étape détermine le nombre d’objets à étudier : un seul (loi simple) ou plusieurs (loi complexe), qu’il faudra peut-être traiter séparément.", "piege": "Une loi qui réécrit un article en reprenant la peine à l’identique ne modifie en réalité que l’incrimination : regarde ce qui change, pas ce qui est réécrit."}, {"t": "2e étape bis · Seulement si loi complexe : dispositions divisibles ou indivisibles", "txt": "<b>Divisibles<\/b> : elles portent sur des <b>objets distincts<\/b> (prescription et incrimination ; incrimination et peine privative de liberté) → <b>application distributive<\/b> (Crim. 21 avr. 1982, n°81-92.914) : on fait la suite des étapes pour chaque disposition.<br><b>Indivisibles<\/b> : elles portent sur un <b>même objet<\/b> et ont donc la même nature (ex. : peine d’emprisonnement et peine d’amende = la répression) → <b>appréciation globale<\/b> (Crim. 5 juin 1971, n°70-92.735). Quand elles portent sur la répression, l’appréciation globale se fait <b>en fonction de la peine privative de liberté<\/b>.", "pourquoi": "L’appréciation globale interdit de fabriquer une « troisième loi » composite, qui prendrait la peine d’emprisonnement de l’une et l’amende de l’autre : le juge appliquerait alors une loi que le législateur n’a jamais adoptée.", "piege": "Prison en baisse et amende en hausse (5 ans / 375 000 € → 3 ans / 450 000 €) : la loi est globalement <b>moins sévère<\/b>, car on compare la peine privative de liberté."}, {"t": "3e étape · Disposition de fond, de forme ou mesure de sûreté", "txt": "<b>Fond<\/b> : modifie l’incrimination, les peines encourues, les circonstances aggravantes, les faits justificatifs.<br><b>Forme<\/b> : liste <b>limitative<\/b> de l’art. 112-2 CP : 1° compétence et organisation judiciaire ; 2° modalités des poursuites et formes de la procédure ; 3° régime d’exécution et d’application des peines ; 4° prescription de l’action publique et des peines.<br><b>Mesure de sûreté<\/b> : mesure sans objectif répressif, intervenant en réaction à un comportement dangereux (Cons. const., 8 déc. 2005). Ex. : un fichier des auteurs d’une infraction.", "pourquoi": "La nature commande le régime : on ne protège pas de la même façon ce qui touche à la culpabilité et à la peine (le fond) et ce qui touche au déroulement du procès (la forme).", "piege": "Loi complexe indivisible : toutes les dispositions ont la même nature. Loi complexe divisible : une nature par disposition. Une incapacité professionnelle attachée à une condamnation peut être une mesure de sûreté et non une peine (Crim. 26 nov. 1997)."}, {"t": "4e étape · Résolution du conflit", "txt": "<b>Forme<\/b> (112-2) : application immédiate aux infractions commises avant l’entrée en vigueur, avec des conditions selon le type :<ul><li>1° compétence et organisation judiciaire : tant qu’<b>aucun jugement au fond<\/b> n’a été rendu en première instance ;<\/li><li>2° modalités des poursuites et formes de la procédure : <b>aucune condition<\/b> ;<\/li><li>3° exécution et application des peines : à condition de <b>ne pas rendre plus sévères<\/b> les peines prononcées ; sinon, seulement pour les faits postérieurs ;<\/li><li>4° prescription : à condition que la prescription ne soit <b>pas déjà acquise<\/b> selon l’ancien délai au jour de l’entrée en vigueur.<\/li><\/ul><b>Fond<\/b> (112-1) : <b>non-rétroactivité<\/b> de la loi plus sévère (faits postérieurs seulement) ; <b>rétroactivité in mitius<\/b> de la loi moins sévère (faits antérieurs non définitivement jugés).<br><b>Mesure de sûreté<\/b> : n’étant pas une peine, elle n’est pas une loi de fond plus sévère et s’applique aux faits antérieurs (Crim. 26 nov. 1997, n°96-83.792).", "pourquoi": "<b>Non-rétroactivité<\/b> : sécurité juridique et prévisibilité (art. 8 DDHC) ; on doit pouvoir connaître la règle avant d’agir. <b>In mitius<\/b> : nécessité des peines ; si le législateur juge désormais une peine plus douce suffisante, maintenir l’ancienne sévérité n’est plus nécessaire. <b>Forme immédiate<\/b> : on présume la nouvelle procédure meilleure pour la justice, et elle ne touche pas à la culpabilité. <b>Prescription acquise<\/b> : l’oubli est un droit déjà né qu’une loi postérieure ne peut effacer (Crim. 3 nov. 1994).", "piege": "Délais de recours (appel, pourvoi) : texte spécial, <b>art. 112-3 CP<\/b>, absent de la fiche. La loi nouvelle ne s’applique qu’aux recours formés contre les décisions <b>prononcées après<\/b> son entrée en vigueur. Une loi interprétative n’est pas rétroactive : elle précise le sens d’un texte qui existait déjà (Crim. 12 janv. 2000). L’abrogation d’un texte réglementaire d’application est sans effet rétroactif si le texte législatif support de l’incrimination demeure (Crim. 15 avr. 2008)."}], "sylls": [{"t": "1er syllogisme · Identification ou exclusion du conflit", "quand": "Toujours.", "maj": "Définition du conflit (<b>112-1 CP<\/b>) ; l’éventuel article de la loi nouvelle fixant son entrée en vigueur, ou à défaut la règle selon laquelle les lois entrent en vigueur à la date qu’elles fixent ou, à défaut, le lendemain de leur publication au JORF (la fiche vise l’art. 2 C. civ. ; le texte est l’<b>art. 1er al. 1 C. civ.<\/b>) ; si utile, la définition de l’infraction <b>continue<\/b>, <b>complexe<\/b> ou <b>d’habitude<\/b>.", "min": "Appliquer les critères aux faits : nature de l’infraction (définie en majeure) et date d’entrée en vigueur de la loi nouvelle.", "concl": ["Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "Donc, aucun conflit de lois pénales dans le temps n’est caractérisé, l’infraction étant commise ou se poursuivant après l’entrée en vigueur de la loi pénale nouvelle, celle-ci tend à s’appliquer."]}, {"t": "2e syllogisme · Loi simple ou complexe", "quand": "Si un conflit est identifié.", "maj": "Définition de la loi pénale <b>simple<\/b> ou de la loi pénale <b>complexe<\/b>.", "min": "Appliquer la définition à la loi nouvelle.", "concl": ["Donc, il s’agit d’une loi pénale simple.", "Donc, il s’agit d’une loi pénale complexe."]}, {"t": "2e syllogisme bis · Divisible ou indivisible", "quand": "Seulement si loi complexe ; sinon passer au 3e.", "maj": "Définitions de la loi complexe <b>divisible<\/b> et <b>indivisible<\/b> ; principe d’<b>application distributive<\/b> (Crim. 21 avr. 1982) et d’<b>appréciation globale<\/b> (Crim. 5 juin 1971).", "min": "Appliquer la définition opportune à la loi nouvelle.", "concl": ["Donc, il s’agit d’une loi pénale complexe divisible imposant une application distributive.", "Donc, il s’agit d’une loi pénale complexe indivisible imposant une appréciation globale."]}, {"t": "3e syllogisme · Fond, forme ou mesure de sûreté", "quand": "À renouveler pour <b>chaque disposition<\/b> si la loi est divisible.", "maj": "Fond : sa définition. Forme : <b>112-2 CP<\/b> en ciblant l’un des 4 types. Sûreté : définition du Conseil constitutionnel (8 déc. 2005).", "min": "Appliquer la définition à la disposition concernée.", "concl": ["Donc, il s’agit d’une disposition (ou d’une loi) de fond / de forme / d’une mesure de sûreté."]}, {"t": "4e syllogisme · Résolution", "quand": "Un syllogisme par disposition divisible ; un seul pour des dispositions indivisibles.", "maj": "Forme : <b>112-2 1°, 2°, 3° ou 4°<\/b>, principe d’application immédiate et conditions propres. Fond : <b>112-1<\/b>, non-rétroactivité de la loi plus sévère, rétroactivité in mitius. Sûreté : <b>112-1<\/b> et Crim. 26 nov. 1997.", "min": "Appliquer le principe aux faits en vérifiant ses conditions (plus grande sévérité ; prescription non acquise…).", "concl": ["Donc, la loi pénale nouvelle tend à s’appliquer.", "Donc, la loi pénale nouvelle ne tend pas à s’appliquer.", "Donc, la loi pénale nouvelle s’applique partiellement, précisément telle disposition, à l’exclusion de telle autre disposition."]}], "vig": []}, {"id": "s3", "n": 3, "titre": "L’infraction intentionnelle et la tentative", "court": "Intention & tentative", "declic": "Un acte volontaire (frapper, voler, empoisonner) — consommé, ou interrompu avant le résultat.", "idee": "Une infraction intentionnelle se démontre en trois temps : ce qui a été fait (élément matériel), ce qui a été voulu (élément moral), ce qui est encouru (répression). Si le résultat n’est pas atteint, on bascule sur la tentative : elle n’est punie que pour les crimes, et pour les délits quand un texte le prévoit, et seulement à partir du commencement d’exécution, si l’arrêt n’est pas volontaire.", "eco": "Le désistement volontaire est un <b>pont d’or<\/b> tendu au délinquant : si celui qui renonce de lui-même était puni comme celui qui va jusqu’au bout, il n’aurait plus aucune raison de s’arrêter. Le droit crée une incitation marginale à renoncer. À l’inverse, le désistement imposé par un obstacle extérieur ne révèle aucune bonne volonté : la dangerosité demeure, la peine aussi.", "schema": [["L", "Élément légal", "Pas de syllogisme : cibler le texte d’incrimination", "ex. 311-1 · 221-1 · 221-5"], ["?", "Le résultat est-il atteint ?", "OUI → infraction consommée : 3 syllogismes · NON → tentative : 5 syllogismes", "matérielle · formelle · obstacle"], ["C", "Consommée", "Élément matériel → élément moral → répression", ""], ["T", "Tentative", "Matérialité inachevée → tentative incriminée ? → commencement d’exécution → désistement involontaire → répression", "121-4 2° · 121-5"]], "etapes": [{"t": "Infraction intentionnelle · L’élément légal", "txt": "Il correspond au texte d’incrimination. <b>Pas de syllogisme<\/b> : il suffit de cibler le texte, qui fondera chacun des trois syllogismes (matériel, moral, répression).", "pourquoi": "Le principe de légalité (111-3) impose de partir d’un texte. Mais en faire un syllogisme reviendrait à démontrer qu’un texte existe : on le cite et on avance.", "piege": "Choisis le texte le plus précis (spécial) : 221-5 et non 221-1 pour un empoisonnement ; 311-8 pour un vol avec arme."}, {"t": "Infraction intentionnelle · L’élément matériel", "txt": "Il correspond au <b>comportement incriminé<\/b> (et au résultat, si le texte l’exige).<br><b>Classifications utiles<\/b> : infraction <b>matérielle<\/b> (résultat exigé : meurtre) / <b>formelle<\/b> (consommée même sans résultat : empoisonnement) / <b>obstacle<\/b> (punit un comportement dangereux avant tout résultat : risques causés à autrui, 223-1). Instantanée / continue / complexe / d’habitude.", "pourquoi": "L’infraction formelle avance le moment de la consommation : le législateur ne veut pas que le sort de l’auteur dépende de la robustesse de la victime ou de la rapidité des secours.", "piege": "Le délaissement (223-3) suppose un <b>acte positif<\/b> exprimant la volonté d’abandonner définitivement la victime : de simples conditions de vie dégradantes ne suffisent pas (Crim. 9 oct. 2012). Plusieurs auteurs prenant part à une même scène de violences sont coauteurs, même si l’on ignore qui a porté chaque coup (Crim. 13 juin 1972)."}, {"t": "Infraction intentionnelle · L’élément moral", "txt": "<ul><li><b>Dol général<\/b> : toujours requis. Volonté, en connaissance de cause, de réaliser la matérialité constitutive de l’infraction.<\/li><li><b>Dol spécial<\/b> : seulement pour certaines infractions ; le <b>but<\/b> poursuivi par l’infraction, commun à tous les auteurs (ex. : intention de tuer ; volonté de nuire dans les appels malveillants).<\/li><li><b>Mobile<\/b> : indifférent. Il relève du for intérieur, varie d’un auteur à l’autre et, la loi étant générale, ne peut intégrer les éléments constitutifs.<\/li><\/ul>", "pourquoi": "La loi décrit des comportements généraux : elle peut exiger un but précis (dol spécial), mais pas tenir compte des raisons intimes propres à chaque auteur (mobile), qui relèvent de la personnalisation de la peine.", "piege": "La jalousie, la vengeance ou la pitié sont des mobiles. L’intention de tuer se déduit des circonstances objectives : arme, zone visée, répétition des gestes (Crim. 27 mars 2019 ; Crim. 13 janv. 2021). Le caractère malveillant des appels doit être caractérisé, pas seulement déduit de leur répétition (Crim. 11 janv. 2017)."}, {"t": "Infraction intentionnelle · La répression", "txt": "Majeure fondée sur le <b>texte prévoyant la peine<\/b> et les <b>aggravations<\/b> lorsqu’elles ne figurent pas dans le texte d’incrimination.<br>Nomenclature : crimes 131-1 ; délits 131-3 et 131-4 ; contraventions 131-12 et 131-13.", "pourquoi": "La peine encourue donne aussi la nature de l’infraction (crime, délit, contravention), dont dépendent la tentative, la prescription et la compétence.", "piege": "Vérifie les circonstances aggravantes que les faits suggèrent (préméditation, qualité de la victime, arme), même si l’énoncé ne cite que le texte de base."}, {"t": "Tentative · 1re étape · L’élément légal", "txt": "Le texte d’incrimination de l’infraction tentée (ex. : 311-1 pour le vol).", "pourquoi": "On tente toujours de commettre une infraction précise : c’est son texte qui dit quel résultat manque.", "piege": ""}, {"t": "Tentative · 2e étape · Matérialité inachevée ou infructueuse", "txt": "Se fonder sur le texte d’incrimination et rappeler en majeure le comportement et le résultat (s’il est exigé). S’interroger sur le caractère <b>matériel<\/b>, <b>formel<\/b> ou <b>obstacle<\/b> de l’infraction. Après avoir constaté que l’élément matériel est inachevé ou infructueux, préciser qu’il convient d’envisager la tentative.", "pourquoi": "Si l’infraction est formelle, elle est peut-être déjà consommée : inutile alors de parler de tentative.", "piege": "Empoisonnement : la victime survit, mais l’infraction formelle est <b>consommée<\/b> dès l’administration de la substance."}, {"t": "Tentative · 3e étape · L’incrimination de la tentative", "txt": "Identifier la nature de l’infraction (131-1 crimes ; 131-3/131-4 délits ; 131-12/131-13 contraventions). Selon <b>121-4 2°<\/b>, la tentative des <b>crimes<\/b> est toujours incriminée, celle des <b>délits<\/b> seulement lorsque la loi le prévoit (ex. : vol, 311-13), celle des <b>contraventions jamais<\/b>.", "pourquoi": "Plus l’infraction est grave, plus la société a intérêt à intervenir tôt. Pour les délits, le législateur choisit au cas par cas ; pour les contraventions, la gravité est trop faible.", "piege": "Délit : cite le texte spécial qui incrimine la tentative, sinon elle n’est pas punissable."}, {"t": "Tentative · 4e étape · Le commencement d’exécution", "txt": "<b>121-5 CP<\/b>. Selon la chambre criminelle, c’est l’acte qui <b>tend immédiatement et directement à la consommation<\/b> de l’infraction, celle-ci étant entrée dans sa période d’exécution (Crim. 22 mai 1984, n°82-91.523).", "pourquoi": "On ne punit pas les pensées, ni les actes préparatoires, trop équivoques (acheter un couteau peut servir à cuisiner). Le commencement d’exécution est le seuil où l’intention devient univoque et le danger imminent.", "piege": "Le stratagème pour attirer la victime chez soi et l’inviter à se déshabiller est un commencement d’exécution (Crim. 14 juin 1995). Mettre un préservatif et s’approcher de la victime prostrée l’est aussi (Crim. 10 janv. 1996)."}, {"t": "Tentative · 5e étape · Le désistement involontaire", "txt": "<b>121-5 CP<\/b> : la tentative n’a été suspendue ou n’a manqué son effet qu’en raison de <b>circonstances indépendantes de la volonté<\/b> de son auteur. Compléter la majeure par la jurisprudence opportune.", "pourquoi": "Celui qui renonce spontanément montre que sa volonté criminelle n’était pas ferme : le punir supprimerait toute incitation à renoncer.", "piege": "L’intervention d’un tiers ne rend pas automatiquement le désistement involontaire : le juge doit rechercher si le renoncement était libre (Crim. 20 mars 1974, Weinberg). L’<b>infraction impossible<\/b> est punissable : violences mortelles sur un homme déjà mort (Crim. 16 janv. 1986, Perdereau). Le <b>repentir actif<\/b>, après consommation, n’efface rien (Crim. 27 mars 2019)."}, {"t": "Tentative · 6e étape · La répression", "txt": "<b>121-4 2°<\/b> : est auteur, et puni comme tel, celui qui tente de commettre un crime ou, lorsque la loi le prévoit, un délit, + le texte prévoyant la peine de l’infraction tentée (ex. : 221-1).", "pourquoi": "Le droit français punit la tentative comme l’infraction consommée : il sanctionne la dangerosité révélée, non le hasard du résultat.", "piege": ""}], "sylls": [{"t": "Consommée · 1er syllogisme · Élément matériel", "quand": "Infraction consommée.", "maj": "Le <b>texte d’incrimination<\/b>.", "min": "Les faits constitutifs du comportement (et du résultat).", "concl": ["Donc, l’élément matériel de l’infraction est caractérisé."]}, {"t": "Consommée · 2e syllogisme · Élément moral", "quand": "Infraction consommée.", "maj": "Le <b>texte d’incrimination<\/b> (dol général, et dol spécial s’il est exigé).", "min": "Les indices de la volonté et de la connaissance ; écarter le mobile.", "concl": ["Donc, l’élément moral de l’infraction est caractérisé."]}, {"t": "Consommée · 3e syllogisme · Répression", "quand": "Infraction consommée.", "maj": "Le texte prévoyant la <b>répression<\/b> et les <b>aggravations<\/b>.", "min": "Les circonstances aggravantes présentes dans les faits.", "concl": ["Donc, X encourt …"]}, {"t": "Tentative · 1er syllogisme · Matérialité inachevée ou infructueuse", "quand": "Résultat non atteint.", "maj": "Le <b>texte d’incrimination<\/b> (ex. 221-1 pour le meurtre).", "min": "Le résultat n’est pas atteint / la matérialité est inachevée.", "concl": ["Donc, l’élément matériel est inachevé (infructueux) : il convient d’envisager la tentative."]}, {"t": "Tentative · 2e syllogisme · Incrimination de la tentative", "quand": "", "maj": "<b>121-4 2°<\/b> + en matière délictuelle le texte incriminant la tentative.", "min": "Nature de l’infraction (crime, délit, contravention).", "concl": ["Donc, la tentative de cette infraction est incriminée."]}, {"t": "Tentative · 3e syllogisme · Commencement d’exécution", "quand": "", "maj": "<b>121-5<\/b> + Crim. 22 mai 1984.", "min": "L’acte tend-il directement et immédiatement à la consommation ?", "concl": ["Donc, un commencement d’exécution est caractérisé."]}, {"t": "Tentative · 4e syllogisme · Désistement involontaire", "quand": "", "maj": "<b>121-5<\/b> + jurisprudence opportune.", "min": "Pourquoi l’action s’est-elle arrêtée ?", "concl": ["Donc, le désistement est involontaire."]}, {"t": "Tentative · 5e syllogisme · Répression", "quand": "", "maj": "<b>121-4 2°<\/b> + texte de la peine de l’infraction tentée.", "min": "Aggravations éventuelles.", "concl": ["Donc, X encourt les peines prévues pour l’infraction consommée."]}], "vig": []}, {"id": "s4", "n": 4, "titre": "Les infractions non intentionnelles", "court": "Non intentionnelles", "declic": "Un dommage (décès, ITT, blessure) causé sans le vouloir : accident, négligence, imprudence — ou un risque créé sans dommage.", "idee": "On cherche le bon texte selon le dommage, puis on démontre trois choses : le résultat, le lien de causalité (toujours certain, direct ou indirect), la faute. Plus la causalité est lointaine, plus la faute exigée doit être grave : c’est la logique de la loi Fauchon (10 juillet 2000).", "eco": "C’est un <b>arbitrage coût/bénéfice<\/b>. Punir trop largement les auteurs indirects (maires, chefs d’entreprise, formateurs) paralyserait l’action et pousserait à l’excès de précaution. Ne pas les punir du tout supprimerait l’incitation à prévenir les risques graves. Le législateur a placé le curseur à la <b>faute qualifiée<\/b> : on ne punit l’auteur indirect que pour un manquement grave ou délibéré.", "schema": [["L", "Élément légal", "Selon le dommage et parfois la nature de la faute — pas de syllogisme", "221-6 · 222-19 · 222-20 · R625-2 · 223-1 · 221-18 s."], ["1", "Le résultat", "Décès, ITT > 3 mois, ITT ≤ 3 mois, dommage sans ITT", ""], ["2", "La causalité", "Certaine, puis directe ou indirecte", "121-3 · Crim. 5 oct. 2004 · Circ. 11 oct. 2000"], ["3", "La faute", "Directe → faute simple suffit · Indirecte → faute qualifiée (délibérée ou caractérisée)", "121-3 al. 3 et 4"], ["4", "La répression", "Texte de la peine + aggravations", ""]], "etapes": [{"t": "1re étape · L’élément légal", "txt": "À choisir selon le <b>dommage<\/b> et parfois la <b>nature de la faute<\/b>. Pas de syllogisme : il s’agit de trouver le bon texte.<table class='tb'><tr><th>Dommage<\/th><th>Faute simple ou caractérisée<\/th><th>Faute délibérée<\/th><\/tr><tr><td>Décès<\/td><td>221-6 al. 1 : 3 ans, 45 000 €<\/td><td>221-6 al. 2 : 5 ans, 75 000 €<\/td><\/tr><tr><td>ITT &gt; 3 mois<\/td><td>222-19 al. 1 : 2 ans, 30 000 €<\/td><td>222-19 al. 2 : 3 ans, 45 000 €<\/td><\/tr><tr><td>ITT ≤ 3 mois<\/td><td><b>R625-2<\/b> : contravention de 5e classe<\/td><td><b>222-20<\/b> : délit, 1 an, 15 000 €<\/td><\/tr><tr><td>Dommage sans ITT<\/td><td>pas d’infraction<\/td><td>R625-3 : contravention de 5e classe<\/td><\/tr><tr><td>Aucun dommage<\/td><td colspan='2'>223-1 (risques causés à autrui) : violation manifestement délibérée + risque immédiat de mort ou d’infirmité<\/td><\/tr><\/table><b>Conducteur d’un véhicule terrestre à moteur<\/b> : 221-6-1, 222-19-1, 222-20-1 (al. 1) ; depuis la loi du 9 juill. 2025 (en vigueur le 11 juill. 2025), dès qu’une circonstance des 1° à 10° est réunie : <b>homicide routier 221-18<\/b> (7 ans, 100 000 €), <b>blessures routières 221-19<\/b> (ITT &gt; 3 mois, 5 ans, 75 000 €) et <b>221-20<\/b> (ITT ≤ 3 mois, 3 ans, 45 000 €) ; peines portées plus haut avec deux circonstances ou plus.", "pourquoi": "La loi gradue la répression selon deux curseurs : la gravité du dommage et celle de la faute. Pour les petits dommages, seule la faute délibérée fait naître un délit.", "piege": "L’absence d’ITT n’est pas l’absence de dommage. Avec deux circonstances ou plus, les peines de l’homicide routier passent à 10 ans et 150 000 €."}, {"t": "2e étape · Le dommage", "txt": "C’est le résultat de l’infraction : un décès, une ITT, ou un dommage n’ayant entraîné aucune ITT.", "pourquoi": "Sans résultat, pas d’infraction non intentionnelle de résultat (on bascule sur 223-1).", "piege": "Compte les victimes : une infraction par victime. Le conducteur blessé n’est pas sa propre victime."}, {"t": "3e étape · Le lien de causalité", "txt": "Toujours <b>certain<\/b> (Crim. 5 oct. 2004, n°03-86.169), mais <b>direct ou indirect<\/b>. Selon la circulaire du 11 oct. 2000, la causalité est directe lorsque la personne a « soit elle-même frappé ou heurté la victime, soit initié ou contrôlé le mouvement d’un objet qui aura heurté ou frappé la victime ». Est indirect l’auteur qui a créé ou contribué à créer la situation ayant permis le dommage, ou n’a pas pris les mesures permettant de l’éviter (121-3 al. 4).", "pourquoi": "La certitude protège contre la condamnation sur une simple probabilité : la perte d’une chance de survie ne suffit pas (Crim. 7 janv. 1980). La distinction direct / indirect commande la faute exigée.", "piege": "Le propriétaire qui laisse sortir son chien sans laisse cause <b>directement<\/b> le dommage de la morsure (Crim. 21 janv. 2014). Mais un enclos insuffisant dont les chiens s’échappent peut relever de la causalité <b>indirecte<\/b> (Crim. 1er oct. 2024)."}, {"t": "4e étape · La faute", "txt": "Causalité <b>directe<\/b> : une <b>faute simple<\/b> suffit (sans exclure la faute qualifiée). Causalité <b>indirecte<\/b> : une <b>faute qualifiée<\/b> est nécessaire.<ul><li><b>Faute simple<\/b> (121-3 al. 3) : imprudence, négligence, manquement à une obligation de prudence ou de sécurité prévue par la loi ou le règlement, sans accomplir les diligences normales.<\/li><li><b>Faute délibérée<\/b> (121-3 al. 4) : « violé de façon manifestement délibérée une obligation particulière de prudence ou de sécurité imposée par la loi ou le règlement ». Trois points : une obligation <b>particulière<\/b> (précise et circonstanciée, pas générale) ; prévue par une <b>loi ou un règlement<\/b> de portée générale et impersonnelle (Crim. 10 mai 2000) ; une violation <b>en connaissance de cause<\/b>.<\/li><li><b>Faute caractérisée<\/b> (121-3 al. 4) : « commis une faute caractérisée et qui exposait autrui à un risque d’une particulière gravité qu’elles ne pouvaient ignorer ». Elle peut résulter de l’<b>addition de plusieurs fautes simples<\/b> (Crim. 17 déc. 2019).<\/li><\/ul>", "pourquoi": "La loi Fauchon compense l’éloignement causal par la gravité de la faute. La faute caractérisée a été jugée suffisamment claire et précise : le législateur ne peut énumérer a priori tous les comportements (Crim. 24 sept. 2013, QPC non transmise).", "piege": "Un plan de maîtrise sanitaire ou une autorisation individuelle n’est pas un « règlement » au sens de 121-3 ; un règlement européen précis peut l’être (Crim. 31 mars 2020). Le maire informé de la dangerosité d’une aire de jeux qui n’agit pas commet une faute caractérisée (Crim. 2 déc. 2003). Confier un chien d’attaque à un tiers qu’on sait incapable de le maîtriser aussi (Crim. 26 juin 2018)."}, {"t": "5e étape · La répression", "txt": "Majeure fondée sur le texte prévoyant la peine et les aggravations lorsqu’elles ne figurent pas dans le texte d’incrimination.", "pourquoi": "La faute délibérée joue un double rôle : condition d’existence du délit (222-20, 223-1) ou circonstance aggravante (221-6 al. 2, 222-19 al. 2, circonstance 1° des infractions routières).", "piege": ""}], "sylls": [{"t": "1er syllogisme · Le résultat", "quand": "Toujours.", "maj": "Le <b>texte d’incrimination<\/b> (ex. 221-6 pour l’homicide involontaire).", "min": "Le dommage constaté (décès, durée d’ITT), victime par victime.", "concl": ["Donc, le résultat exigé par le texte est caractérisé."]}, {"t": "2e syllogisme · Le lien de causalité", "quand": "", "maj": "Le texte d’incrimination (ex. 221-6) <b>renvoyant aux distinctions de 121-3<\/b> : causalité nécessairement certaine (Crim. 5 oct. 2004), directe ou indirecte ; définition de la causalité directe (circulaire du 11 oct. 2000).", "min": "Le lien est-il certain ? L’auteur a-t-il heurté la victime ou contrôlé l’objet qui l’a heurtée ?", "concl": ["Donc, le lien de causalité est certain et direct.", "Donc, le lien de causalité est certain mais indirect."]}, {"t": "3e syllogisme · La faute", "quand": "", "maj": "Le texte d’incrimination renvoyant à 121-3 : directe → faute simple suffit sans exclure la faute qualifiée ; indirecte → faute qualifiée, délibérée ou caractérisée. Rappeler la définition de la faute envisagée. Faute délibérée : vérifier les trois points et <b>cibler précisément l’obligation particulière, légale ou réglementaire<\/b>.", "min": "Les faits constitutifs de la faute.", "concl": ["Donc, une faute simple / délibérée / caractérisée est caractérisée."]}, {"t": "4e syllogisme · La répression", "quand": "", "maj": "Le texte prévoyant la <b>peine<\/b> et les <b>aggravations<\/b>.", "min": "Circonstances aggravantes présentes.", "concl": ["Donc, X encourt …"]}], "vig": []}], "aig": {"ordre": [["0", "Brouillon", "Pour chaque protagoniste et chaque fait : qualification provisoire (quelle infraction ? crime, délit, contravention ? consommée ou tentée ? intentionnelle ou non ?) et repérage des dates et des lieux.", "C’est elle qui alimente les autres étapes : la réciprocité de 113-6 et le seuil de 113-7 dépendent de la nature de l’infraction ; le conflit dans le temps dépend de sa date de commission (continue ? complexe ?)."], ["1", "Espace (S1)", "Seulement s’il y a un élément d’extranéité. On commence par là : si la loi française n’est pas applicable, la suite est sans objet.", "Une loi inapplicable ne sert pas à qualifier."], ["2", "Temps (S2)", "Seulement si une loi nouvelle est entrée en vigueur entre les faits et le jugement définitif. On fixe le texte applicable avant de qualifier.", "On ne qualifie qu’au regard du texte applicable."], ["3", "Qualification (S3 ou S4)", "Intentionnelle consommée (3 syllogismes), tentative (5) ou non intentionnelle (4).", "C’est le cœur du cas, là où se trouvent la plupart des points."], ["4", "Répression", "Dernier syllogisme de la qualification, avec le texte retenu à l’étape 2.", "La peine encourue ferme la démonstration."]], "indices": [["Lieu à l’étranger (Londres, Genève, New York…)", "s1"], ["Auteur ou victime de nationalité française hors de France", "s1"], ["Navire, bateau, avion, internet", "s1"], ["Monnaie, sceau de l’État, ambassade, intérêts fondamentaux", "s1"], ["« Une nouvelle loi est entrée en vigueur le… »", "s2"], ["Dates précises de commission + jugement non définitif (appel, pourvoi)", "s2"], ["Prescription, délai d’appel, fichier, compétence d’une juridiction", "s2"], ["Infraction qui dure (recel, détention) ou remises successives (escroquerie)", "s2"], ["Coups, vol, empoisonnement, « il voulait… »", "s3"], ["Action interrompue : sirène, police, victime qui s’enfuit, gilet pare-balles", "s3"], ["« Elle affirme ne pas avoir voulu tuer »", "s3"], ["Jalousie, vengeance, argent (mobile)", "s3"], ["Accident, ITT, décès sans intention", "s4"], ["Alcool, vitesse, feu rouge, téléphone au volant", "s4"], ["Décideur absent (maire, employeur, formateur, propriétaire du chien)", "s4"], ["Obligation de sécurité, règlement, arrêté, inspection", "s4"]], "exos": [{"q": "Le 3 mars 2026, Lina, française, blesse involontairement un piéton à Madrid en conduisant (ITT 2 semaines).", "a": ["s1", "s4"], "e": "Élément d’extranéité (Madrid, auteur français) → S1 ; dommage sans intention → S4."}, {"q": "Paul vole un vélo à Lyon le 1er juin 2026 ; une loi du 1er octobre 2026 aggrave la peine du vol. Il est jugé en décembre.", "a": ["s2", "s3"], "e": "Loi nouvelle avant jugement → S2 ; vol intentionnel → S3."}, {"q": "À bord d’un ferry sous pavillon français, un passager tire sur un autre et le rate.", "a": ["s1", "s3"], "e": "Navire → S1 (113-3) ; tir manqué → tentative (S3)."}, {"q": "Un chef de chantier n’a pas fourni de garde-corps malgré un rappel de l’inspection du travail ; un ouvrier chute et décède.", "a": ["s4"], "e": "Causalité probablement indirecte, faute délibérée à rechercher (Crim. 1er sept. 2009) → S4 seul."}, {"q": "Depuis le Luxembourg, un Belge vend sur un site en français, livraison en France uniquement, de faux sacs de luxe ; une loi nouvelle allonge la prescription.", "a": ["s1", "s2", "s3"], "e": "Internet et public français visé → S1 ; prescription → S2 ; escroquerie ou tromperie intentionnelle → S3."}, {"q": "Un ressortissant étranger fabrique, hors de France, de fausses pièces de monnaie ayant cours légal en France.", "a": ["s1"], "e": "Compétence réelle (113-10 + 442-1)."}]}, "cas": [{"id": "s1a", "s": ["s1"], "src": "TD S1 · cas 1 (sem. A)", "titre": "Jean à Londres", "duree": 15, "enonce": "Jean décide de passer quelques jours à Londres. Ayant voyagé dans de nombreux pays européens, il n’avait encore jamais visité cette capitale. En tant que touriste français, Jean redoute quelque peu la conduite à l’anglaise. Afin d’être absolument libre, il décide cependant de louer un véhicule. Tandis qu’il découvrait les grands axes et les plus petites rues de Londres, Jean percute un véhicule, celui de Swan, une jeune touriste américaine. Cette dernière subira une ITT de 4 mois.", "question": "La loi pénale française est-elle applicable ?", "brouillon": "Infraction : blessures involontaires, ITT de plus de 3 mois, commises par un conducteur → délit (222-19-1 al. 1 : 3 ans, 45 000 €). Lieu : Londres. Auteur : français. Victime : américaine. → Territorialité exclue, puis compétence personnelle <b>active<\/b>.", "plan": ["Syllogisme 1 : territorialité (exclue)", "Brouillon : auteur français → personnelle active", "Syllogisme 2 : compétence personnelle active (113-6, 113-8)"], "corr": [{"t": "1er syllogisme · Le principe de territorialité", "maj": "Aux termes de l’art. <b>113-2 al. 1<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République. Selon l’<b>al. 2<\/b>, l’infraction est réputée commise sur ce territoire dès lors qu’un de ses faits constitutifs y a eu lieu.", "min": "En l’espèce, la conduite du véhicule, la collision et les blessures de Swan ont eu lieu à Londres, au Royaume-Uni. Aucun fait constitutif n’a été commis en France, et les faits ne se sont déroulés ni à bord d’un navire battant pavillon français ni à bord d’un aéronef immatriculé en France.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "2d syllogisme · La compétence personnelle active", "maj": "Selon l’art. <b>113-6 al. 2<\/b> CP, la loi pénale française est applicable aux délits commis par des Français hors du territoire de la République si les faits sont punis par la législation du pays où ils ont été commis. Selon l’art. <b>113-8<\/b>, la poursuite des délits ne peut être exercée qu’à la requête du ministère public ; elle doit être précédée d’une plainte de la victime ou de ses ayants droit ou d’une dénonciation officielle par l’autorité du pays où le fait a été commis.", "min": "En l’espèce, Jean est de nationalité française. Les blessures involontaires ayant entraîné une ITT de 4 mois, commises par un conducteur, constituent un délit (art. 222-19-1 al. 1 : 3 ans d’emprisonnement). Il faudra vérifier que le droit anglais réprime aussi le fait de blesser autrui par une conduite imprudente, ce que l’on peut supposer. La poursuite exigera une requête du ministère public, précédée d’une plainte de Swan ou d’une dénonciation officielle des autorités britanniques. Rien n’indique un jugement de Jean au Royaume-Uni (113-9 sans objet).", "concl": "Donc, sous réserve de la réciprocité d’incrimination et du respect de l’art. 113-8, le système de compétence personnelle active tend à s’appliquer et la loi pénale française est applicable.", "note": "Pas de compétence passive : Swan est américaine."}], "vig": ["Rédige le 1er syllogisme même si l’exclusion est évidente.", "La réciprocité et la plainte préalable ne valent que pour les <b>délits<\/b> : le juge doit les vérifier (Crim. 26 mai 2010)."], "check": ["J’ai rédigé un syllogisme de territorialité même évident", "J’ai qualifié l’infraction de délit pour justifier 113-6 al. 2", "J’ai vérifié la réciprocité d’incrimination", "J’ai cité 113-8 (requête du MP + plainte ou dénonciation)", "J’ai écarté la compétence passive (victime américaine)"]}, {"id": "s1b", "s": ["s1"], "src": "TD S1 · cas 2 (sem. A)", "titre": "Swan et Alfonso en mer", "duree": 10, "enonce": "Une fois rétablie, Swan décide de voyager, accompagnée de son petit ami Alfonso, un jeune Italien. […] Souhaitant découvrir les côtes méditerranéennes, Swan et Alfonso se rendent d’abord dans le Sud de la France. Sur place, Alfonso loue un navire immatriculé en France. Depuis le Sud de la France, le couple rejoint d’abord le Sud de l’Italie afin d’y faire escale, puis poursuit sa navigation vers la Crète. Après cette escale en Italie, Swan prend connaissance d’un message reçu par Alfonso et découvre ainsi son infidélité. Une violente dispute éclate. Swan frappe Alfonso, qui décède en s’énuquant dans sa chute. Swan le jette par-dessus bord.", "question": "La loi pénale française est-elle applicable ?", "brouillon": "Coups mortels (violences volontaires ayant entraîné la mort sans intention de la donner, 222-7 : crime). Auteur américaine, victime italienne, en Méditerranée, à bord d’un navire immatriculé en France → <b>113-3<\/b>.", "plan": ["Syllogisme 1 : territorialité étendue au navire (113-2 + 113-3) → applicable, on s’arrête"], "corr": [{"t": "Syllogisme unique · Le principe de territorialité étendu au navire", "maj": "Selon l’art. <b>113-2<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République. Selon l’art. <b>113-3<\/b>, elle est applicable aux infractions commises à bord des navires battant un pavillon français, en quelque lieu qu’ils se trouvent. Ce texte ne vaut que pour la navigation maritime et non fluviale (Crim. 18 sept. 2007).", "min": "En l’espèce, Swan a frappé Alfonso à bord d’un navire immatriculé en France, rattaché au pavillon français, au cours d’une navigation maritime en Méditerranée, entre l’Italie et la Crète. Peu importe que le navire ait quitté les eaux françaises et peu importe la nationalité de l’auteur (américaine) et de la victime (italienne).", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": "Le raisonnement s’arrête ici : inutile d’examiner les autres systèmes de compétence."}], "vig": ["Ne poursuis pas vers 113-6 ou 113-7 : la territorialité suffit.", "« Immatriculé en France » : précise que l’immatriculation rattache le navire au pavillon français."], "check": ["J’ai cité 113-2 et 113-3", "J’ai précisé « en quelque lieu qu’ils se trouvent »", "J’ai noté qu’il s’agit de navigation maritime (Crim. 18 sept. 2007)", "J’ai arrêté le raisonnement après la territorialité"]}, {"id": "s1c", "s": ["s1"], "src": "TD S1 · cas 3 (entraînement sem. A)", "titre": "La montre de Swan dans le vol Paris–New York", "duree": 10, "enonce": "Swan n’éprouve finalement aucun remords et décide de poursuivre son périple. Arrivée en Crète, Swan rejoint Paris en avion. Elle séjourne trois jours dans la capitale avant de prendre son vol retour vers New York. Elle monte à bord de l’avion de la compagnie Air France et remarque que son voisin a un comportement suspect. À peine arrivée sur le tarmac de l’aéroport John F. Kennedy, Swan constate que sa montre de luxe a disparu. Son voisin Pedro, un Espagnol en déplacement à New York, a subtilisé la montre qu’elle portait pendant son sommeil.", "question": "La loi pénale française est-elle applicable ?", "brouillon": "Vol (311-1, 311-3 : délit). Auteur espagnol, victime américaine, à bord d’un avion d’Air France → <b>113-4<\/b>.", "plan": ["Syllogisme 1 : territorialité étendue à l’aéronef (113-2 + 113-4) → applicable"], "corr": [{"t": "Syllogisme unique · Le principe de territorialité étendu à l’aéronef", "maj": "Selon l’art. <b>113-2<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République. Selon l’art. <b>113-4<\/b>, elle est applicable aux infractions commises à bord des aéronefs immatriculés en France, en quelque lieu qu’ils se trouvent.", "min": "En l’espèce, Pedro a soustrait la montre de Swan pendant le vol, à bord d’un avion de la compagnie Air France, dont on peut supposer qu’il est immatriculé en France. Peu importent la découverte du vol à New York et les nationalités espagnole et américaine des protagonistes : la soustraction a eu lieu à bord.", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": ""}], "vig": ["Le critère est l’immatriculation de l’aéronef, pas la nationalité de la compagnie : formule-le comme une hypothèse raisonnable."], "check": ["J’ai cité 113-2 et 113-4", "J’ai localisé la soustraction à bord (et non à JFK)", "J’ai écarté l’incidence des nationalités"]}, {"id": "s1d", "s": ["s1"], "src": "TD S1 · cas 4 (sem. B)", "titre": "Les faux bilans de Bradley", "duree": 15, "enonce": "Arrivée à New York, Swan retrouve ses deux frères, Bradley et Jordan. Bradley éprouve depuis son enfance une jalousie et une rancœur terribles à l’égard de son frère aîné Jordan, à qui tout réussit. […] Bradley profite d’une réunion de famille à New York pour exposer à Jordan son projet. À cette occasion, Bradley produit de faux bilans comptables et propose à Jordan de devenir son associé. La société présentée par Bradley étant française, il demande à Jordan de réaliser un virement bancaire sur un compte français. Jordan s’exécute. Bradley procède au retrait de la somme le 12 septembre 2023 à Paris. […] Le bilan est faux ; Bradley n’a jamais rencontré l’expert-comptable qu’il présentait comme l’auteur du document. La société française n’existe pas.", "question": "La loi pénale française est-elle applicable ?", "brouillon": "Escroquerie (313-1 : délit, 5 ans) = manœuvres frauduleuses (faux bilans, à New York) + remise (virement sur un compte français, retrait à Paris). Un fait constitutif en France → <b>113-2 al. 2<\/b>.", "plan": ["Syllogisme 1 : territorialité par un fait constitutif (113-2 al. 2) → applicable"], "corr": [{"t": "Syllogisme unique · Le principe de territorialité (fait constitutif)", "maj": "Selon l’art. <b>113-2<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République, et l’infraction est réputée commise sur ce territoire dès lors qu’un de ses faits constitutifs y a eu lieu. L’escroquerie (313-1) suppose des manœuvres frauduleuses déterminant une remise ; la remise en est un élément constitutif. De simples mensonges ne suffisent pas à localiser l’infraction en France (Crim. 19 avr. 1983).", "min": "En l’espèce, les manœuvres frauduleuses — la production de faux bilans attribués à un expert-comptable, véritable mise en scène et non simple mensonge — ont eu lieu à New York. Mais la remise des fonds s’est réalisée sur un compte bancaire français, et Bradley a appréhendé la somme par un retrait à Paris le 12 septembre 2023. Un fait constitutif de l’escroquerie a donc eu lieu en France.", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": "La nationalité de Bradley et de Jordan est indifférente."}], "vig": ["Ce cas réapparaît en S2 (Bradley et l’immunité familiale) : l’escroquerie est une infraction <b>complexe<\/b>, consommée à la remise."], "check": ["J’ai cité 113-2 al. 2", "J’ai identifié la remise comme fait constitutif localisé en France", "J’ai distingué manœuvres et simples mensonges (1983)"]}, {"id": "s1e", "s": ["s1"], "src": "TD S1 · cas 5 (sem. B)", "titre": "Les fausses pièces de Swan", "duree": 15, "enonce": "Swan, rencontrant d’importantes difficultés financières, décide de fabriquer dans un petit atelier new-yorkais de fausses pièces d’argent de 50 Francs français qu’elle vend sur internet à ses compatriotes américains. Craignant de rencontrer des problèmes avec la justice française et prévoyant de passer le mois d’août 2025 sur la Côte d’Azur, elle est rassurée par Bradley : seule la justice américaine pourrait la poursuivre.", "question": "Bradley a-t-il raison ?", "brouillon": "Contrefaçon de pièces de monnaie (442-1 : crime). Fabrication à New York, vente en ligne à des Américains. Auteur américaine. → Territorialité exclue (internet : public français non visé) puis compétence <b>réelle<\/b> (113-10).", "plan": ["Syllogisme 1 : territorialité (exclue, y compris par internet)", "Brouillon : contrefaçon de monnaie → réelle", "Syllogisme 2 : compétence réelle (113-10)"], "corr": [{"t": "1er syllogisme · Le principe de territorialité", "maj": "Selon l’art. <b>113-2<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République ou dont un fait constitutif y a eu lieu. Est également réputée commise en France l’infraction commise à l’étranger sur internet dès lors que le public français est précisément visé, et non seulement lorsque le contenu est accessible en France (Crim. 12 juill. 2016, n°15-86.645).", "min": "En l’espèce, les pièces sont fabriquées dans un atelier new-yorkais et vendues sur internet à des compatriotes américains : le public français n’est pas visé. Aucun fait constitutif n’a eu lieu en France.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "2d syllogisme · La compétence réelle", "maj": "Selon l’art. <b>113-10<\/b> CP, la loi pénale française s’applique notamment à la falsification et à la contrefaçon de pièces de monnaie réprimées par l’art. <b>442-1<\/b>, commises hors du territoire de la République, quelle que soit la nationalité de l’auteur.", "min": "En l’espèce, Swan fabrique de fausses pièces de 50 Francs français, ce qui s’identifie comme une contrefaçon de pièces de monnaie au sens de l’art. 442-1, commise à New York, hors du territoire. Sa nationalité américaine et celle des acheteurs sont indifférentes.", "concl": "Donc, le système de compétence réelle tend à s’appliquer et la loi pénale française est applicable : Bradley a tort.", "note": "Nuance pour aller plus loin : le franc n’a plus cours légal depuis 2002. La contrefaçon de monnaies n’ayant plus cours légal relève en principe de l’art. 442-3, que 113-10 ne vise pas. Le TD traite ces pièces sous 442-1 (voir aussi le cas d’Eugène en S2) : suis le TD et mentionne la nuance en une phrase si tu as le temps."}], "vig": ["Pour la compétence réelle, on <b>identifie<\/b> l’infraction, on ne la qualifie pas entièrement.", "Le séjour de Swan en France ne sert à rien ici : la présence de l’auteur n’est une condition que de la compétence universelle."], "check": ["J’ai traité l’hypothèse internet (Crim. 12 juill. 2016)", "J’ai choisi la compétence réelle", "J’ai cité 113-10 et identifié 442-1", "J’ai écarté l’incidence de la nationalité", "J’ai répondu à la question posée (Bradley a tort)"]}, {"id": "s1f", "s": ["s1"], "src": "TD S1 · cas 6 (entraînement sem. B)", "titre": "Jordan à New York", "duree": 10, "enonce": "Alors qu’il devait épouser Cassie au printemps 2025, Jordan découvre l’infidélité de cette dernière. Depuis deux ans, Cassie entretient une relation avec Olivier, un Français installé à New York. Jordan trouve l’adresse d’Olivier à New York, se rend à son domicile et le poignarde. Olivier décède immédiatement.", "question": "Qu’en pensez-vous ?", "brouillon": "Meurtre (221-1, crime), voire assassinat (221-3, préméditation). Auteur américain, à New York, victime <b>française<\/b> → compétence personnelle <b>passive<\/b> (113-7).", "plan": ["Syllogisme 1 : territorialité (exclue)", "Brouillon : victime française → passive", "Syllogisme 2 : compétence personnelle passive (113-7)"], "corr": [{"t": "1er syllogisme · Le principe de territorialité", "maj": "Selon l’art. <b>113-2<\/b> CP, la loi pénale française est applicable aux infractions commises sur le territoire de la République ou dont un fait constitutif y a eu lieu.", "min": "En l’espèce, Jordan a poignardé Olivier à son domicile new-yorkais : to
