us les faits ont eu lieu aux États-Unis, hors de tout lieu assimilé au territoire.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "2d syllogisme · La compétence personnelle passive", "maj": "Selon l’art. <b>113-7<\/b> CP, la loi pénale française est applicable à tout crime, ainsi qu’à tout délit puni d’emprisonnement, commis par un Français ou par un étranger hors du territoire de la République lorsque la victime est de nationalité française au moment de l’infraction. L’art. 113-8 ne vise que les délits. Selon l’art. 113-9, aucune poursuite n’est possible contre une personne justifiant avoir été définitivement jugée à l’étranger pour les mêmes faits et, en cas de condamnation, que la peine a été subie ou prescrite.", "min": "En l’espèce, Olivier est français au moment des faits. Le fait de le poignarder, causant sa mort immédiate, constitue un crime (meurtre, 221-1 ; voire assassinat, 221-3, Jordan ayant recherché l’adresse et s’étant rendu au domicile pour le tuer). S’agissant d’un crime, l’art. 113-8 ne s’applique pas. Les faits ne mentionnent aucun jugement de Jordan aux États-Unis.", "concl": "Donc, le système de compétence personnelle passive tend à s’appliquer et la loi pénale française est applicable.", "note": ""}], "vig": ["La victime doit être française <b>au moment des faits<\/b> et être la victime <b>directe<\/b> (Crim. 8 nov. 2016)."], "check": ["J’ai exclu la territorialité par un syllogisme", "J’ai identifié un crime", "J’ai écarté 113-8 (crime)", "J’ai envisagé 113-9"]}, {"id": "s2a", "s": ["s2"], "src": "TD S2 · cas 1 (sem. A)", "titre": "Philippe, receleur de fausses pièces", "duree": 30, "enonce": "Philippe a acquis le 2 juin 2020 une collection de fausses pièces d’or de 50 Francs français, fabriquées par Eugène. Le 30 août 2026, Eugène est mis en examen pour contrefaçon de pièces de monnaie (442-1). La juridiction d’instruction découvre la transaction du 2 juin 2020. Philippe est convoqué le 5 septembre 2026. Il se débarrasse de son stock en le jetant dans le Rhône le <b>2 septembre 2026<\/b>.<br>Deux lois (fictives) entrent en vigueur :<br>• la <b>première, le 12 septembre 2026<\/b>, modifie l’art. 8 al. 1 CPP : « L’action publique des délits se prescrit par 10 années révolues à compter du jour où l’infraction a été commise » ;<br>• la <b>seconde, le 15 septembre 2026<\/b>, en son <b>art. 2<\/b>, modifie l’art. 321-1 CP : « Le recel est puni de 3 ans d’emprisonnement et 450 000 € d’amende » ; son <b>art. 3<\/b> prévoit l’inscription des auteurs de recel dans un fichier spécial pour 5 ans afin d’endiguer la récidive.", "question": "Quid de l’applicabilité de ces deux lois ?", "brouillon": "Recel = infraction <b>continue<\/b> : commis jusqu’au dessaisissement (2 sept. 2026), avant les deux lois. Ancien droit : prescription des délits 6 ans (art. 8 CPP) ; recel 5 ans et 375 000 € (321-1).<br>Loi 1 : simple, forme (112-2 4°), prescription non acquise → s’applique.<br>Loi 2 : complexe divisible (art. 2 répression / art. 3 fichier). Art. 2 : prison + amende indivisibles → appréciation globale par la prison : 3 ans &lt; 5 ans → plus douce → in mitius. Art. 3 : mesure de sûreté → s’applique.", "plan": ["LOI 1 — S1 conflit · S2 simple · S3 forme (112-2 4°) · S4 application immédiate (prescription non acquise)", "LOI 2 — S1 conflit · S2 complexe · S2 bis divisible", "LOI 2, art. 2 — S3 fond (dispositions indivisibles prison/amende) · S4 in mitius", "LOI 2, art. 3 — S3 mesure de sûreté · S4 application immédiate"], "corr": [{"t": "Loi n°1 · 1er syllogisme · Identification du conflit", "maj": "Selon l’art. <b>112-1<\/b> CP, le conflit de lois pénales dans le temps suppose qu’une infraction ait été commise sous l’empire d’une loi ancienne et n’ait pas fait l’objet d’un jugement définitif à l’entrée en vigueur de la loi nouvelle. Le <b>recel<\/b> est une infraction continue : il se commet tant que l’auteur ne s’est pas dessaisi de la chose d’origine frauduleuse, dessaisissement qui marque aussi le point de départ de la prescription (Crim. 16 juill. 1964). La loi nouvelle entre ici en vigueur à la date qu’elle fixe, le 12 septembre 2026.", "min": "En l’espèce, Philippe a détenu les fausses pièces du 2 juin 2020 au 2 septembre 2026, date à laquelle il s’en est dessaisi en les jetant dans le Rhône. Le recel a donc pris fin le 2 septembre 2026, avant l’entrée en vigueur de la loi le 12 septembre 2026. Philippe n’a fait l’objet d’aucun jugement.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi n°1 · 2e syllogisme · Loi simple ou complexe", "maj": "La loi pénale simple est celle qui opère une modification unique ; la loi complexe en opère plusieurs.", "min": "En l’espèce, la première loi ne modifie que le délai de prescription de l’action publique des délits, porté de 6 à 10 ans.", "concl": "Donc, il s’agit d’une loi pénale simple.", "note": ""}, {"t": "Loi n°1 · 3e syllogisme · Nature de la disposition", "maj": "Selon l’art. <b>112-2 4°<\/b> CP, les lois relatives à la prescription de l’action publique et à la prescription des peines sont des lois pénales de forme.", "min": "En l’espèce, la loi modifie le délai de prescription de l’action publique des délits (art. 8 CPP).", "concl": "Donc, il s’agit d’une loi de forme.", "note": ""}, {"t": "Loi n°1 · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-2 4°<\/b> CP, lorsque les prescriptions ne sont pas acquises, les lois relatives à la prescription de l’action publique sont applicables immédiatement à la répression des infractions commises avant leur entrée en vigueur.", "min": "En l’espèce, la prescription du recel a commencé à courir le 2 septembre 2026. Au 12 septembre 2026, l’ancien délai de 6 ans n’était évidemment pas écoulé : la prescription n’était pas acquise.", "concl": "Donc, la loi pénale nouvelle tend à s’appliquer : l’action publique se prescrira par 10 ans à compter du 2 septembre 2026.", "note": ""}, {"t": "Loi n°2 · 1er syllogisme · Identification du conflit", "maj": "Mêmes règles (<b>112-1<\/b>, infraction continue, Crim. 16 juill. 1964). La loi entre en vigueur le 15 septembre 2026.", "min": "Le recel a pris fin le 2 septembre 2026, avant le 15 septembre 2026 ; aucun jugement définitif n’est intervenu.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi n°2 · 2e syllogisme · Loi simple ou complexe", "maj": "Définitions de la loi pénale simple et de la loi pénale complexe.", "min": "En l’espèce, la loi modifie d’une part la peine du recel (art. 2), d’autre part crée l’inscription au fichier (art. 3) : elle opère plusieurs modifications.", "concl": "Donc, il s’agit d’une loi pénale complexe.", "note": ""}, {"t": "Loi n°2 · 2e syllogisme bis · Divisible ou indivisible", "maj": "Les dispositions d’une loi complexe sont divisibles lorsqu’elles portent sur des objets distincts, ce qui impose une application distributive (Crim. 21 avr. 1982, n°81-92.914) ; indivisibles lorsqu’elles portent sur un même objet, ce qui impose une appréciation globale (Crim. 5 juin 1971, n°70-92.735).", "min": "En l’espèce, l’art. 2 porte sur la répression, tandis que l’art. 3 instaure une mesure destinée à prévenir la récidive : les objets sont distincts.", "concl": "Donc, il s’agit d’une loi pénale complexe divisible imposant une application distributive.", "note": ""}, {"t": "Loi n°2, art. 2 · 3e syllogisme · Nature", "maj": "Une loi pénale de fond modifie l’incrimination, les peines encourues, les circonstances aggravantes ou les faits justificatifs. Des dispositions portant sur un même objet, la répression (emprisonnement et amende), sont indivisibles et ont la même nature ; leur appréciation globale se fait en fonction de la peine privative de liberté.", "min": "En l’espèce, l’art. 2 modifie à la fois la peine d’emprisonnement et l’amende du recel : ces dispositions portent sur la répression.", "concl": "Donc, il s’agit de dispositions de fond, indivisibles, à apprécier globalement selon la peine privative de liberté.", "note": ""}, {"t": "Loi n°2, art. 2 · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-1<\/b> CP, la loi pénale de fond plus sévère ne s’applique qu’aux faits commis après son entrée en vigueur ; la loi de fond moins sévère s’applique aux faits commis avant son entrée en vigueur et non définitivement jugés (rétroactivité in mitius).", "min": "En l’espèce, l’ancien art. 321-1 punit le recel de 5 ans d’emprisonnement et 375 000 € d’amende ; le nouveau, de 3 ans et 450 000 €. Si l’amende augmente, la peine privative de liberté, critère de l’appréciation globale, diminue de 5 à 3 ans : la loi nouvelle est globalement moins sévère.", "concl": "Donc, la loi pénale nouvelle tend à s’appliquer : Philippe encourt 3 ans d’emprisonnement et 450 000 € d’amende.", "note": ""}, {"t": "Loi n°2, art. 3 · 3e syllogisme · Nature", "maj": "La mesure de sûreté est celle qui ne présente aucun objectif répressif mais intervient en réaction à un comportement dangereux (Cons. const., 8 déc. 2005) ; ex. : un fichier répertoriant les auteurs d’une infraction.", "min": "En l’espèce, l’inscription des auteurs de recel dans un fichier spécial pour 5 ans vise à endiguer la récidive, sans finalité punitive.", "concl": "Donc, il s’agit d’une mesure de sûreté.", "note": ""}, {"t": "Loi n°2, art. 3 · 4e syllogisme · Résolution", "maj": "Selon l’art. 112-1 CP, tel qu’interprété par la chambre criminelle, les mesures de sûreté, qui ne sont pas des peines, ne sont pas des lois pénales de fond plus sévères et s’appliquent aux faits antérieurs à leur entrée en vigueur (Crim. 26 nov. 1997, n°96-83.792).", "min": "En l’espèce, l’inscription au fichier, mesure de sûreté, peut frapper Philippe pour des faits antérieurs au 15 septembre 2026.", "concl": "Donc, la loi pénale nouvelle s’applique partiellement, précisément l’art. 2 (in mitius) et l’art. 3 (mesure de sûreté) ; conclusion d’ensemble : toutes les dispositions de la seconde loi sont applicables à Philippe.", "note": ""}], "vig": ["Si Philippe avait gardé les pièces après le 15 septembre, il n’y aurait eu <b>aucun conflit<\/b> : le recel se poursuivant sous la loi nouvelle, celle-ci s’appliquerait directement.", "Le piège central : amende en hausse et prison en baisse = loi plus douce (critère de la peine privative de liberté).", "La fiche cite l’art. 2 C. civ. pour l’entrée en vigueur ; c’est l’art. 1er al. 1 C. civ. Ici la loi fixe sa date : inutile."], "check": ["J’ai défini le recel comme infraction continue (Crim. 16 juill. 1964)", "J’ai fixé la fin du recel au 2 sept. 2026", "Loi 1 : simple, forme, 112-2 4°, prescription non acquise", "Loi 2 : complexe divisible, application distributive (1982)", "Art. 2 : appréciation globale par la peine privative de liberté → in mitius", "Art. 3 : mesure de sûreté (Cons. const. 2005, Crim. 1997)"]}, {"id": "s2b", "s": ["s2"], "src": "TD S2 · cas 2 (sem. B)", "titre": "Bradley et l’immunité familiale", "duree": 35, "enonce": "L’escroquerie commise par Bradley au préjudice de son frère John fut consommée par le retrait de la somme remise, le <b>12 septembre 2025<\/b>. Sur plainte de John, Bradley est condamné par le tribunal correctionnel à 1 an d’emprisonnement et 25 000 € d’amende, par jugement du <b>23 juin 2026<\/b>.<br>Une loi entrée en vigueur le <b>25 juin 2026<\/b> insère un art. (fictif) 313-3-1 : « Ne peut donner lieu à des poursuites pénales l’escroquerie commise par une personne : 1° au préjudice de son ascendant ou de son descendant ; 2° au préjudice de son conjoint ; 3° au préjudice de ses collatéraux au deuxième degré. » John est le collatéral de Bradley au deuxième degré.<br>Bradley interjette appel le <b>2 juillet 2026<\/b>. La cour d’appel infirme et ne prononce aucune peine, sur le fondement de l’immunité. Le procureur général se pourvoit en cassation pour faire appliquer deux nouvelles lois (fictives) et contester l’immunité :<br>• loi entrée en vigueur le <b>27 juin 2026<\/b> : le délai d’appel d’un jugement correctionnel passe de 10 à 8 jours ;<br>• loi entrée en vigueur le <b>29 juin 2026<\/b> : nouvel art. 313-1 : « L’escroquerie est le fait, par l’emploi de faux documents exclusivement, de tromper une personne physique ou morale et de la déterminer ainsi, à son seul préjudice, à remettre des fonds, des valeurs ou un bien quelconque. L’escroquerie est punie de cinq ans d’emprisonnement et de 375 000 € d’amende. »", "question": "Quid de l’applicabilité de ces trois lois ?", "brouillon": "Escroquerie = infraction complexe consommée à la remise (12 sept. 2025). Jugement du 23 juin non définitif (délai d’appel en cours), puis appel, puis pourvoi : jamais définitif.<br>Immunité : fond, plus douce → in mitius.<br>Délai d’appel : forme… mais <b>112-3<\/b> (recours contre les décisions prononcées après l’entrée en vigueur) → jugement du 23 juin = ancien délai de 10 jours → appel du 2 juillet recevable.<br>Nouvel 313-1 : fond, plus restrictif, peine inchangée → plus doux → in mitius, réexamen des faits.", "plan": ["LOI « immunité » — S1 conflit · S2 simple · S3 fond · S4 in mitius", "LOI « délai d’appel » — S1 conflit · S2 simple · S3 forme · S4 résolution (112-2 2° et texte spécial 112-3)", "LOI « 313-1 » — S1 conflit · S2 simple · S3 fond · S4 in mitius"], "corr": [{"t": "Loi « immunité » · 1er syllogisme · Conflit", "maj": "Selon l’art. <b>112-1<\/b> CP, il y a conflit lorsqu’une infraction commise sous une loi ancienne n’a pas été définitivement jugée à l’entrée en vigueur de la loi nouvelle. L’escroquerie est une infraction complexe, qui nécessite des manœuvres frauduleuses puis une remise, et n’est consommée qu’à compter de cette remise (Crim. 17 déc. 1974, n°73-91.110).", "min": "En l’espèce, l’escroquerie a été consommée le 12 septembre 2025. Au 25 juin 2026, Bradley avait seulement été condamné en première instance le 23 juin, jugement susceptible d’appel et donc non définitif.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi « immunité » · 2e syllogisme · Simple ou complexe", "maj": "Définition de la loi pénale simple (une modification unique).", "min": "La loi se borne à créer une immunité familiale en matière d’escroquerie.", "concl": "Donc, il s’agit d’une loi pénale simple.", "note": ""}, {"t": "Loi « immunité » · 3e syllogisme · Nature", "maj": "Une loi pénale de fond modifie l’incrimination, les peines encourues, les circonstances aggravantes ou les faits justificatifs, c’est-à-dire les conditions de la responsabilité et de la punissabilité.", "min": "L’immunité familiale fait obstacle à toute répression de l’escroquerie commise entre proches : elle touche à la punissabilité même de l’infraction, comme un fait justificatif. Peu importe que le texte parle de « poursuites » : elle ne règle pas les modalités de la procédure.", "concl": "Donc, il s’agit d’une disposition de fond.", "note": ""}, {"t": "Loi « immunité » · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-1 al. 3<\/b> CP, les dispositions nouvelles s’appliquent aux infractions commises avant leur entrée en vigueur et n’ayant pas donné lieu à une condamnation passée en force de chose jugée lorsqu’elles sont moins sévères que les dispositions anciennes.", "min": "En l’espèce, l’immunité supprime toute répression : elle est moins sévère. John est le collatéral au deuxième degré de Bradley. La condamnation n’est pas passée en force de chose jugée.", "concl": "Donc, la loi pénale nouvelle tend à s’appliquer : la cour d’appel a justement fait bénéficier Bradley de l’immunité.", "note": ""}, {"t": "Loi « délai d’appel » · 1er syllogisme · Conflit", "maj": "Art. <b>112-1<\/b> CP (définition du conflit) ; escroquerie consommée à la remise (Crim. 17 déc. 1974).", "min": "Escroquerie consommée le 12 septembre 2025 ; au 27 juin 2026, aucune décision définitive.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi « délai d’appel » · 2e syllogisme · Simple ou complexe", "maj": "Définition de la loi pénale simple.", "min": "La loi ne modifie que le délai d’appel des jugements correctionnels.", "concl": "Donc, il s’agit d’une loi pénale simple.", "note": ""}, {"t": "Loi « délai d’appel » · 3e syllogisme · Nature", "maj": "Selon l’art. <b>112-2 2°<\/b> CP, les lois fixant les modalités des poursuites et les formes de la procédure sont des lois de forme.", "min": "Le délai pour interjeter appel est une règle de procédure.", "concl": "Donc, il s’agit d’une loi de forme.", "note": ""}, {"t": "Loi « délai d’appel » · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-2 2°<\/b> CP, les lois fixant les modalités des poursuites et les formes de la procédure sont d’application immédiate, sans condition. Toutefois, l’art. <b>112-3<\/b> CP, texte spécial, dispose que les lois relatives aux délais dans lesquels les voies de recours doivent être exercées sont applicables aux recours formés contre les décisions <b>prononcées après leur entrée en vigueur<\/b>.", "min": "En l’espèce, le jugement du tribunal correctionnel a été prononcé le 23 juin 2026, avant l’entrée en vigueur de la loi le 27 juin 2026. L’appel reste donc soumis à l’ancien délai de 10 jours, expirant le 3 juillet 2026. Interjeté le 2 juillet 2026, l’appel de Bradley est recevable.", "concl": "Donc, la loi pénale nouvelle ne tend pas à s’appliquer à l’appel de Bradley : le moyen du procureur général doit être écarté.", "note": "⚠ La fiche ne mentionne que 112-2 : en appliquant 112-2 2° seul, on conclurait à un appel tardif (8 jours : 1er juillet). 112-3 est pourtant le texte exactement applicable aux délais de recours. Présente les deux et demande à ton chargé de TD la réponse attendue."}, {"t": "Loi « 313-1 » · 1er syllogisme · Conflit", "maj": "Art. <b>112-1<\/b> CP ; escroquerie consommée à la remise (Crim. 17 déc. 1974).", "min": "Escroquerie consommée le 12 septembre 2025 ; au 29 juin 2026, aucune décision définitive (appel puis pourvoi).", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi « 313-1 » · 2e syllogisme · Simple ou complexe", "maj": "Définition de la loi pénale simple.", "min": "La loi réécrit l’art. 313-1 mais reprend la peine à l’identique (5 ans, 375 000 €) : la seule modification porte sur l’incrimination.", "concl": "Donc, il s’agit d’une loi pénale simple.", "note": "Si tu la considères comme complexe (incrimination + peine), la peine inchangée ne modifie pas la solution."}, {"t": "Loi « 313-1 » · 3e syllogisme · Nature", "maj": "Une loi de fond est celle qui modifie l’incrimination.", "min": "La loi modifie les éléments constitutifs de l’escroquerie : moyens (faux documents exclusivement) et préjudice (celui de la seule personne trompée).", "concl": "Donc, il s’agit d’une loi de fond.", "note": ""}, {"t": "Loi « 313-1 » · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-1<\/b> CP, la loi de fond moins sévère s’applique aux faits antérieurs non définitivement jugés. Une loi qui restreint le champ d’une incrimination est moins sévère et oblige les juges à réexaminer les faits au regard de la définition nouvelle (Crim. 5 avr. 1995, n°94-82.457).", "min": "En l’espèce, l’escroquerie n’est plus constituée que par l’emploi de faux documents et au seul préjudice de la personne trompée : le champ de l’incrimination est réduit, la peine étant inchangée. La loi est moins sévère.", "concl": "Donc, la loi pénale nouvelle tend à s’appliquer : les faits devront être réexaminés au regard du nouvel art. 313-1 (sans incidence pratique ici, puisque l’immunité fait déjà obstacle à toute peine).", "note": ""}], "vig": ["« Ne peut donner lieu à des poursuites » : le mot « poursuites » ne fait pas de l’immunité une loi de forme.", "Délais de recours : art. <b>112-3<\/b> (hors fiche). C’est le point qui fait la différence.", "Peine réécrite à l’identique : regarde ce qui change réellement."], "check": ["Escroquerie = infraction complexe, consommée à la remise (1974)", "Jugement de 1re instance non définitif → conflit", "Immunité : fond, plus douce → in mitius", "Délai d’appel : forme 112-2 2° + texte spécial 112-3", "Nouvel 313-1 : simple, fond, plus restrictif → in mitius (Crim. 5 avr. 1995)"]}, {"id": "s3a", "s": ["s1", "s3"], "src": "TD S3 · cas 1 (sem. A) · mélange S1 + S3", "titre": "Le braquage de Genève", "duree": 35, "enonce": "Depuis plusieurs mois, Sophie et Max, des braqueurs professionnels, préparent un nouveau braquage dans une bijouterie de <b>Genève<\/b>. Ils sont sous écoutes téléphoniques ; un renseignement anonyme avait informé la police que Max, déjà connu de ses services, s’apprêtait à commettre de nouveaux faits. L’enquête identifie la bijouterie et la date : le 3 novembre à 8h00. Les enquêteurs avertissent le bijoutier, qui ferme ce jour-là. Le jour J, à 8h00, les policiers voient les deux comparses, cagoulés et armés, entrer par effraction dans la bijouterie. Au moment où ils s’apprêtent à annoncer un hold-up, une sirène retentit. Ils constatent que personne n’est présent. Ils n’ont pas le temps de fuir : les policiers les interpellent.", "question": "Max peut-il voir sa responsabilité pénale engagée ? (art. 311-8 CP)", "brouillon": "Genève = Suisse → <b>S1<\/b> d’abord. Nationalité de Max non précisée → hypothèse : Max français → 113-6 al. 1 (crime : pas de réciprocité, pas de 113-8). Puis tentative de vol avec arme (311-8 : crime, 20 ans de réclusion et 150 000 €) : 5 syllogismes.", "plan": ["Espace : S1 territorialité (exclue) · S2 compétence personnelle active (hypothèse : Max français)", "Tentative : élément légal 311-1 + 311-8", "T1 matérialité inachevée · T2 incrimination (crime) · T3 commencement d’exécution · T4 désistement involontaire · T5 répression"], "corr": [{"t": "Espace · 1er syllogisme · Territorialité", "maj": "Art. <b>113-2<\/b> CP : infraction commise sur le territoire ou dont un fait constitutif y a eu lieu.", "min": "Les faits se déroulent intégralement dans une bijouterie de Genève, en Suisse.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "Espace · 2d syllogisme · Compétence personnelle active (hypothèse)", "maj": "Selon l’art. <b>113-6 al. 1<\/b> CP, la loi pénale française est applicable à tout crime commis par un Français hors du territoire de la République. En matière criminelle, ni réciprocité d’incrimination ni requête du ministère public (113-8) ne sont exigées ; reste l’obstacle éventuel de 113-9.", "min": "La nationalité de Max n’est pas précisée. À supposer Max français, la tentative de vol avec arme, crime (voir infra), entre dans 113-6 al. 1 ; aucun jugement en Suisse n’est mentionné. S’il n’est pas français, seule une victime française (113-7) permettrait l’application de la loi française, ce que les faits ne disent pas.", "concl": "Donc, à supposer Max français, le système de compétence personnelle active tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Tentative · 1er syllogisme · Matérialité inachevée", "maj": "Selon l’art. <b>311-1<\/b> CP, le vol est la soustraction frauduleuse de la chose d’autrui ; l’art. <b>311-8<\/b> le punit de 20 ans de réclusion criminelle et de 150 000 € d’amende lorsqu’il est commis avec usage ou menace d’une arme ou par une personne porteuse d’une arme. Le vol est une infraction matérielle supposant une soustraction effective.", "min": "Max et Sophie ont été interpellés avant de s’emparer du moindre bijou : aucune soustraction n’a eu lieu.", "concl": "Donc, l’élément matériel est inachevé : il convient d’envisager la tentative.", "note": ""}, {"t": "Tentative · 2e syllogisme · Incrimination de la tentative", "maj": "Selon l’art. <b>121-4 2°<\/b> CP, la tentative des crimes est toujours incriminée ; celle des délits seulement lorsque la loi le prévoit. Selon l’art. 131-1, les crimes sont punis de la réclusion criminelle.", "min": "Le vol avec arme, puni de 20 ans de réclusion criminelle, est un crime.", "concl": "Donc, la tentative de cette infraction est incriminée.", "note": ""}, {"t": "Tentative · 3e syllogisme · Commencement d’exécution", "maj": "Selon l’art. <b>121-5<\/b> CP, la tentative suppose un commencement d’exécution, c’est-à-dire un acte qui tend immédiatement et directement à la consommation de l’infraction, celle-ci étant entrée dans sa période d’exécution (Crim. 22 mai 1984, n°82-91.523).", "min": "La préparation pendant des mois ne constitue que des actes préparatoires. En revanche, pénétrer par effraction, cagoulés et armés, dans la bijouterie à l’heure prévue et s’apprêter à annoncer le hold-up sont des actes tendant directement et immédiatement à la soustraction des bijoux.", "concl": "Donc, un commencement d’exécution est caractérisé.", "note": ""}, {"t": "Tentative · 4e syllogisme · Désistement involontaire", "maj": "Selon l’art. <b>121-5<\/b> CP, la tentative n’est punissable que si elle n’a été suspendue ou n’a manqué son effet qu’en raison de circonstances indépendantes de la volonté de son auteur. L’impossibilité matérielle d’atteindre le résultat, ignorée de l’auteur, ne fait pas obstacle à la tentative (Crim. 16 janv. 1986, Perdereau).", "min": "Max ne renonce pas de lui-même : il est arrêté par la sirène puis par l’interpellation immédiate des policiers. L’absence de personnel, liée à la fermeture organisée par les enquêteurs, est une circonstance extérieure qu’il ignorait.", "concl": "Donc, le désistement est involontaire.", "note": ""}, {"t": "Tentative · 5e syllogisme · Répression", "maj": "Selon l’art. <b>121-4 2°<\/b> CP, est auteur la personne qui tente de commettre un crime ; l’art. <b>311-8<\/b> punit le vol avec arme de 20 ans de réclusion criminelle et de 150 000 € d’amende.", "min": "Max a tenté de commettre un vol avec arme.", "concl": "Donc, Max encourt 20 ans de réclusion criminelle et 150 000 € d’amende (sous réserve de l’application de la loi française).", "note": "Sophie, coauteur, est dans la même situation. Le fait que la police ait attendu sans provoquer l’infraction ne fait pas obstacle aux poursuites."}], "vig": ["Genève : le TD est en S3, mais un examen « mélangé » attend le réflexe S1. Pose l’hypothèse sur la nationalité.", "Crime → pas de texte spécial pour incriminer la tentative.", "Le mobile et les antécédents de Max sont indifférents."], "check": ["J’ai traité l’espace avant la qualification", "J’ai posé l’hypothèse de la nationalité", "J’ai distingué actes préparatoires et commencement d’exécution", "J’ai cité Crim. 22 mai 1984", "J’ai traité l’infraction impossible (Perdereau)", "J’ai donné la peine de 311-8"]}, {"id": "s3b", "s": ["s3"], "src": "TD S3 · cas 2 (sem. A)", "titre": "Les lasagnes de José", "duree": 25, "enonce": "Joséphine et José reçoivent leurs voisins à dîner et cuisinent un grand plat de lasagnes. En réalité, depuis des années, José est rongé par la jalousie envers son voisin, qui a une plus grande maison que lui. Il profite du dîner pour passer à l’action : juste avant de servir, il glisse discrètement un puissant poison dans l’assiette destinée au voisin. Après une première bouchée, le voisin est pris de convulsions violentes, puis perd connaissance. Sa compagne appelle les urgences. Après une nuit en réanimation, le voisin survit. Convaincu que José et Joséphine ont failli le tuer, il porte plainte contre eux.", "question": "José peut-il être poursuivi pénalement ? (art. 221-5 CP)", "brouillon": "Empoisonnement = infraction <b>formelle<\/b> : consommée dès l’administration, même si la victime survit → pas de tentative, 3 syllogismes. Mobile (jalousie) indifférent. Préméditation → perpétuité (221-5 al. 3).", "plan": ["Élément légal : 221-5 (pas de syllogisme)", "S1 élément matériel (infraction formelle consommée)", "S2 élément moral (dol général + intention de tuer ; mobile indifférent)", "S3 répression (préméditation)"], "corr": [{"t": "1er syllogisme · Élément matériel", "maj": "Selon l’art. <b>221-5<\/b> CP, le fait d’attenter à la vie d’autrui par l’emploi ou l’administration de substances de nature à entraîner la mort constitue un empoisonnement. C’est une infraction <b>formelle<\/b> : elle est consommée par l’administration de la substance, indépendamment du décès.", "min": "José a glissé un puissant poison dans l’assiette du voisin, qui l’a ingéré ; les convulsions et la nuit en réanimation montrent le caractère mortifère de la substance. La survie de la victime est indifférente.", "concl": "Donc, l’élément matériel de l’empoisonnement est caractérisé : l’infraction est consommée, il n’y a pas lieu d’envisager la tentative.", "note": ""}, {"t": "2e syllogisme · Élément moral", "maj": "L’empoisonnement exige un <b>dol général<\/b> — la volonté d’administrer, en connaissance de cause, une substance mortifère — et, selon la jurisprudence, l’<b>intention de donner la mort<\/b> (Crim. 18 juin 2003, affaire du sang contaminé). Le <b>mobile<\/b> est indifférent.", "min": "José a choisi un « puissant poison », l’a introduit discrètement dans la seule assiette du voisin : il connaissait la nature mortifère du produit et voulait sa mort. Sa jalousie n’est qu’un mobile, sans incidence sur la qualification.", "concl": "Donc, l’élément moral de l’empoisonnement est caractérisé.", "note": ""}, {"t": "3e syllogisme · Répression", "maj": "Selon l’art. <b>221-5 al. 2<\/b>, l’empoisonnement est puni de 30 ans de réclusion criminelle ; selon l’<b>al. 3<\/b>, de la réclusion criminelle à perpétuité lorsqu’il est commis dans l’une des circonstances des art. 221-2, 221-3 (préméditation) et 221-4. La préméditation est le dessein formé avant l’action de commettre un crime (art. 132-72).", "min": "José, rongé par la jalousie depuis des années, a profité d’un dîner organisé et préparé le poison avant de servir : son dessein était formé avant l’action.", "concl": "Donc, José encourt la réclusion criminelle à perpétuité (30 ans sans la préméditation).", "note": "Joséphine : aucun acte personnel n’est établi (art. 121-1) ; la plainte contre elle ne prospère pas en l’état."}], "vig": ["Le réflexe « la victime a survécu → tentative » est le piège du cas : l’empoisonnement est formel.", "La méthode exige d’identifier le caractère matériel, formel ou obstacle de l’infraction."], "check": ["J’ai qualifié l’empoisonnement d’infraction formelle", "Je n’ai pas raisonné en tentative", "J’ai écarté le mobile (jalousie)", "J’ai vu la préméditation (221-5 al. 3)", "J’ai écarté Joséphine (121-1)"]}, {"id": "s3c", "s": ["s3"], "src": "TD S3 · cas unique (sem. B)", "titre": "Angel et Elena, place Bellecour", "duree": 40, "enonce": "Nuit du 31 décembre 2023 au 1er janvier 2024, à Lyon. Un individu demande à Charlie de lui prêter son téléphone ; Charlie refuse deux fois. Un ami de l’individu, Angel, arrive soudainement et bouscule Charlie, qui tombe ; son téléphone tombe aussi. Angel le ramasse et part en courant. Une rixe éclate entre les deux groupes. Une patrouille intervient place Bellecour. Deux policiers, portant des gilets pare-balles, sentent plusieurs coups dans leur dos, comme des coups de couteau. Les renforts interpellent l’auteure des coups, Elena. Le légiste fixe 5 jours d’ITT pour chaque policier et précise que, sans gilet, les coups auraient été fatals. En garde à vue, Elena affirme n’avoir pas eu l’intention de tuer.", "question": "Angel et Elena peuvent-ils être poursuivis ? (art. 221-1, 221-4, 311-3 CP)", "brouillon": "Angel : vol consommé (311-1, 311-3) ; bousculade = violence → aggravation possible 311-4 4°. Elena : tentative de meurtre aggravé (PDAP, 221-4 4°) ; intention de tuer à démontrer : arme, zone, répétition ; gilet = désistement involontaire.", "plan": ["ANGEL — S1 élément matériel du vol · S2 élément moral · S3 répression (311-3, discussion 311-4)", "ELENA — élément légal 221-1 + 221-4 · T1 matérialité infructueuse · T2 incrimination (crime) · T3 commencement d’exécution (+ intention de tuer) · T4 désistement involontaire · T5 répression"], "corr": [{"t": "Angel · 1er syllogisme · Élément matériel du vol", "maj": "Selon l’art. <b>311-1<\/b> CP, le vol est la soustraction frauduleuse de la chose d’autrui.", "min": "Angel a ramassé le téléphone de Charlie, tombé au sol, et s’est enfui avec : il a appréhendé la chose d’autrui sans le consentement de son propriétaire.", "concl": "Donc, l’élément matériel du vol est caractérisé.", "note": ""}, {"t": "Angel · 2e syllogisme · Élément moral", "maj": "Le vol suppose la volonté, en connaissance de cause, de s’approprier la chose d’autrui (soustraction <b>frauduleuse<\/b>).", "min": "Angel savait que le téléphone appartenait à Charlie et s’est enfui en courant pour le conserver.", "concl": "Donc, l’élément moral du vol est caractérisé.", "note": ""}, {"t": "Angel · 3e syllogisme · Répression", "maj": "Selon l’art. <b>311-3<\/b>, le vol est puni de 3 ans d’emprisonnement et de 45 000 € d’amende. L’art. <b>311-4 4°<\/b> porte la peine à 5 ans et 75 000 € lorsque le vol est précédé, accompagné ou suivi de violences sur autrui n’ayant pas entraîné d’ITT.", "min": "Angel a bousculé Charlie, le faisant tomber, puis a ramassé le téléphone : si la bousculade a servi à commettre le vol, l’aggravation est encourue ; si elle est fortuite, on s’en tient au vol simple.", "concl": "Donc, Angel encourt 3 ans d’emprisonnement et 45 000 € d’amende, voire 5 ans et 75 000 € si les violences sont retenues.", "note": "Le TD ne cite que 311-3 : la discussion de 311-4 est un plus."}, {"t": "Elena · 1er syllogisme · Matérialité infructueuse", "maj": "Selon l’art. <b>221-1<\/b>, le fait de donner volontairement la mort à autrui constitue un meurtre ; selon l’art. <b>221-4 4°<\/b>, il est puni de la réclusion criminelle à perpétuité lorsqu’il est commis sur un fonctionnaire de la police nationale dans l’exercice ou du fait de ses fonctions, sa qualité étant apparente ou connue. Le meurtre est une infraction matérielle : le décès est exigé.", "min": "Les policiers ont survécu (5 jours d’ITT).", "concl": "Donc, l’élément matériel du meurtre est infructueux : il convient d’envisager la tentative.", "note": ""}, {"t": "Elena · 2e syllogisme · Incrimination de la tentative", "maj": "Art. <b>121-4 2°<\/b> : la tentative des crimes est toujours incriminée.", "min": "Le meurtre (30 ans de réclusion criminelle) est un crime.", "concl": "Donc, la tentative de meurtre est incriminée.", "note": ""}, {"t": "Elena · 3e syllogisme · Commencement d’exécution", "maj": "Art. <b>121-5<\/b> CP ; acte tendant directement et immédiatement à la consommation (Crim. 22 mai 1984). L’acte doit tendre à la consommation du <b>meurtre<\/b>, ce qui suppose l’intention de tuer, déduite des circonstances objectives : nature de l’arme, zone visée, répétition des coups (Crim. 27 mars 2019 ; Crim. 13 janv. 2021).", "min": "Elena a porté plusieurs coups de couteau dans le dos des policiers, région du thorax abritant des organes vitaux ; le légiste affirme que, sans gilet, ces coups auraient été mortels. La répétition, l’arme et la zone visée démentent ses dénégations.", "concl": "Donc, un commencement d’exécution d’un meurtre est caractérisé.", "note": "La fiche ne prévoit pas de syllogisme sur l’intention dans la tentative : intègre-la ici, c’est le point décisif du cas."}, {"t": "Elena · 4e syllogisme · Désistement involontaire", "maj": "Art. <b>121-5<\/b> : suspension ou échec dû à des circonstances indépendantes de la volonté de l’auteur.", "min": "La mort n’est pas survenue grâce aux gilets pare-balles, puis Elena a été interpellée par les renforts : aucun renoncement volontaire.", "concl": "Donc, le désistement est involontaire (infraction manquée).", "note": ""}, {"t": "Elena · 5e syllogisme · Répression", "maj": "Art. <b>121-4 2°<\/b> + art. <b>221-4 4°<\/b> : réclusion criminelle à perpétuité.", "min": "Les victimes sont des fonctionnaires de la police nationale en intervention, leur qualité étant apparente (patrouille, interpellation).", "concl": "Donc, Elena encourt la réclusion criminelle à perpétuité.", "note": "À défaut d’intention de tuer : violences volontaires avec arme sur personne dépositaire de l’autorité publique (ITT ≤ 8 jours), délit."}], "vig": ["Deux protagonistes, deux régimes : vol consommé (3 syllogismes) et tentative (5 syllogismes).", "L’affirmation d’Elena (« pas d’intention de tuer ») appelle une démonstration par indices objectifs."], "check": ["Angel : vol consommé, 3 syllogismes", "Angel : discussion de 311-4 4°", "Elena : tentative, 5 syllogismes", "Elena : intention de tuer démontrée par indices", "Elena : gilet = désistement involontaire", "Elena : 221-4 4° perpétuité"]}, {"id": "s4a", "s": ["s4"], "src": "TD S4 · sem. A", "titre": "Claire et le tram de la fête des Lumières", "duree": 30, "enonce": "Le <b>8 décembre 2025<\/b>, soir de la fête des Lumières, Juliette et Clément boivent du vin chaud. Trois amis, Claire, Mathieu et Aurélie, s’arrêtent en voiture et leur proposent de rejoindre une soirée sur un rooftop. Juliette et Clément montent à l’arrière. À l’approche d’une intersection, le feu vient tout juste de passer au rouge, mais Claire, la conductrice, tente une accélération afin d’éviter le feu et de ne pas perdre de temps. Un tram arrive à ce moment-là ; elle ne peut l’éviter. Les cinq amis s’en sortent avec trois semaines d’ITT.", "question": "Claire peut-elle voir sa responsabilité pénale engagée ? (art. 222-20, 222-20-1 CP)", "brouillon": "Faits du 8 déc. 2025, <b>après<\/b> la loi du 9 juill. 2025 (en vigueur le 11 juill.). Victimes : 4 passagers (Claire n’est pas sa propre victime), ITT ≤ 3 mois. Conductrice → 222-20-1 ; feu rouge grillé délibérément = circonstance 1° → <b>blessures routières 221-20<\/b>. Causalité directe, faute délibérée (R412-30 C. route).", "plan": ["Élément légal : 222-20-1 al. 1 / 221-20 1° (pas de syllogisme)", "S1 résultat · S2 causalité (certaine, directe) · S3 faute (délibérée) · S4 répression"], "corr": [{"t": "1er syllogisme · Le résultat", "maj": "Selon l’art. <b>222-20-1<\/b> CP, constitue un délit l’atteinte involontaire à l’intégrité de la personne commise par le conducteur d’un véhicule terrestre à moteur et ayant entraîné une ITT inférieure ou égale à trois mois ; l’art. <b>221-20<\/b> (loi du 9 juill. 2025) qualifie ces faits de blessures routières lorsqu’ils sont commis avec l’une des circonstances qu’il énumère.", "min": "Juliette, Clément, Mathieu et Aurélie, passagers, subissent chacun trois semaines d’ITT, durée inférieure à trois mois. Claire, conductrice, n’est pas victime de sa propre infraction.", "concl": "Donc, le résultat exigé est caractérisé à l’égard de quatre victimes.", "note": ""}, {"t": "2e syllogisme · Le lien de causalité", "maj": "Selon les art. 222-20-1 et 221-20, renvoyant aux distinctions de l’art. <b>121-3<\/b>, le lien de causalité est nécessairement certain (Crim. 5 oct. 2004, n°03-86.169), mais il peut être direct ou indirect. Selon la circulaire du 11 octobre 2000, la causalité est directe lorsque la personne a « soit elle-même frappé ou heurté la victime, soit initié ou contrôlé le mouvement d’un objet qui aura heurté ou frappé la victime ».", "min": "Sans le franchissement du feu rouge, la collision avec le tram ne se serait pas produite : le lien est certain. Claire conduisait et contrôlait le mouvement du véhicule engagé dans l’intersection, où s’est produit le choc qui a blessé ses passagers.", "concl": "Donc, le lien de causalité est certain et direct.", "note": ""}, {"t": "3e syllogisme · La faute", "maj": "Selon l’art. 121-3, en cas de causalité directe, une faute simple suffit, sans exclure la faute qualifiée. La faute délibérée consiste à avoir « violé de façon manifestement délibérée une obligation particulière de prudence ou de sécurité imposée par la loi ou le règlement » : obligation particulière, précise et circonstanciée ; prévue par une loi ou un règlement de portée générale et impersonnelle (Crim. 10 mai 2000) ; violée en connaissance de cause. Ici, l’art. <b>R412-30 du code de la route<\/b> impose à tout conducteur de marquer l’arrêt absolu devant un feu rouge fixe.", "min": "L’obligation de s’arrêter au feu rouge est précise et prévue par un règlement général. Claire a vu le feu passer au rouge et a accéléré pour ne pas perdre de temps : la violation est consciente et manifestement délibérée.", "concl": "Donc, une faute délibérée est caractérisée.", "note": ""}, {"t": "4e syllogisme · La répression", "maj": "Selon l’art. <b>221-20 1°<\/b> CP, les blessures routières ayant entraîné une ITT inférieure ou égale à trois mois sont punies de 3 ans d’emprisonnement et de 45 000 € d’amende lorsque le conducteur a commis une violation manifestement délibérée d’une obligation particulière de prudence ou de sécurité (5 ans et 75 000 € avec deux circonstances ou plus).", "min": "Une seule circonstance est caractérisée : rien n’indique que Claire avait bu ou téléphonait.", "concl": "Donc, Claire encourt, pour chacune des quatre victimes, 3 ans d’emprisonnement et 45 000 € d’amende.", "note": "Le TD vise 222-20 et 222-20-1 : sous l’ancien droit (al. 2 de 222-20-1, abrogé par la loi de 2025), la faute délibérée portait la peine à 3 ans et 45 000 €, soit la même peine. Sans circonstance : 222-20-1 al. 1, 2 ans et 30 000 €. Demande à ton chargé de TD quel texte il attend."}], "vig": ["Faits postérieurs au 11 juillet 2025 : pense « routier » dès qu’une circonstance 1° à 10° apparaît.", "Compte les victimes : une infraction par passager blessé.", "222-20 (non conducteur) cède devant le texte spécial du conducteur."], "check": ["J’ai exclu Claire des victimes", "J’ai retenu une causalité directe (circulaire 2000)", "J’ai ciblé l’obligation particulière (R412-30)", "J’ai démontré la violation consciente", "J’ai vu la loi du 9 juill. 2025 (221-20)"]}, {"id": "s4b", "s": ["s4"], "src": "TD S4 · sem. B", "titre": "David et Laura, formateurs à Chamonix", "duree": 30, "enonce": "Le 21 février 2026, une soirée fête la fin d’un stage de snowboard à Chamonix. Les formateurs, David et Laura, autorisent les jeunes de plus de 16 ans à apporter de l’alcool dans l’établissement, bien que cela soit interdit, et achètent même quelques bouteilles en plus. Vers 1h00, quatre jeunes, déjà bien éméchés, décident d’aller en boîte. Manu, qui vient d’obtenir son permis, propose de conduire (la boîte est à 5 km) ; il sait avoir bu mais se sent capable. Les formateurs, trop occupés à faire la fête, ne remarquent pas leur départ. Manu coupe un virage et percute une camionnette. Manu et la passagère avant, Béa, sont gravement blessés : trois semaines d’ITT chacun.", "question": "David et Laura peuvent-ils être tenus pénalement responsables de ce qui est arrivé à Manu et Béa ? (art. R625-2 / 222-20 CP ; les deux protagonistes peuvent être traités ensemble)", "brouillon": "ITT ≤ 3 mois ; David et Laura ne conduisent pas → 222-20 (faute délibérée) ou R625-2 (faute simple ou caractérisée). Causalité <b>indirecte<\/b> (ils ont créé la situation) → faute qualifiée. Interdiction interne ≠ règlement (Crim. 10 mai 2000) → faute <b>caractérisée<\/b> par accumulation (Crim. 17 déc. 2019) → <b>R625-2<\/b>.", "plan": ["Élément légal : R625-2 / 222-20 (pas de syllogisme)", "S1 résultat · S2 causalité (certaine, indirecte) · S3 faute (qualifiée : délibérée écartée, caractérisée retenue) · S4 répression"], "corr": [{"t": "1er syllogisme · Le résultat", "maj": "Selon l’art. <b>R625-2<\/b> CP, le fait de causer à autrui, dans les conditions et selon les distinctions de l’art. 121-3, une ITT inférieure ou égale à trois mois est puni de l’amende des contraventions de la 5e classe ; selon l’art. <b>222-20<\/b>, le même dommage causé par la violation manifestement délibérée d’une obligation particulière de prudence ou de sécurité est un délit.", "min": "Manu et Béa subissent chacun trois semaines d’ITT.", "concl": "Donc, le résultat exigé est caractérisé à l’égard de deux victimes.", "note": ""}, {"t": "2e syllogisme · Le lien de causalité", "maj": "Selon R625-2 et 222-20, renvoyant aux distinctions de l’art. <b>121-3<\/b>, le lien de causalité est nécessairement certain (Crim. 5 oct. 2004), mais peut être direct ou indirect. Il est direct lorsque l’auteur a lui-même heurté la victime ou contrôlé l’objet qui l’a heurtée (circ. 11 oct. 2000). Sont auteurs indirects ceux qui ont créé ou contribué à créer la situation ayant permis le dommage, ou n’ont pas pris les mesures permettant de l’éviter (121-3 al. 4).", "min": "En autorisant et en fournissant l’alcool, puis en ne surveillant pas les jeunes, David et Laura ont rendu possible la conduite en état d’ébriété à l’origine de l’accident : le lien est certain. Mais ce sont Manu et la camionnette qui ont matériellement causé le choc.", "concl": "Donc, le lien de causalité est certain mais indirect.", "note": ""}, {"t": "3e syllogisme · La faute", "maj": "Selon l’art. 121-3 al. 4, en cas de causalité indirecte, une faute qualifiée est exigée. La <b>faute délibérée<\/b> suppose une obligation particulière prévue par une loi ou un règlement de portée générale et impersonnelle (Crim. 10 mai 2000), violée en connaissance de cause. La <b>faute caractérisée<\/b> est celle qui expose autrui à un risque d’une particulière gravité que l’auteur ne pouvait ignorer ; elle peut résulter de l’addition de plusieurs fautes simples (Crim. 17 déc. 2019).", "min": "L’interdiction de l’alcool résulte du règlement de l’établissement, norme interne qui n’est pas un « règlement » au sens de 121-3 : la faute délibérée doit être écartée (au mieux, l’interdiction d’offrir gratuitement de l’alcool à des mineurs dans les lieux publics, art. L3342-1 CSP, pourrait être discutée, mais l’établissement n’est pas clairement un lieu public). En revanche, autoriser l’alcool contre la règle, en acheter davantage pour des jeunes dont certains sont mineurs, puis cesser toute surveillance au point de ne pas voir quatre jeunes ivres partir en voiture à 1h du matin constituent, par leur accumulation, une faute caractérisée. En leur qualité d’encadrants professionnels, ils ne pouvaient ignorer le risque d’une particulière gravité qui en résultait.", "concl": "Donc, une faute caractérisée est caractérisée (et non une faute délibérée).", "note": ""}, {"t": "4e syllogisme · La répression", "maj": "Selon l’art. <b>R625-2<\/b>, les faits sont punis de l’amende prévue pour les contraventions de la 5e classe, soit 1 500 € au plus (131-13 5°), 3 000 € en récidive.", "min": "Faute caractérisée, ITT ≤ 3 mois : seule la contravention est constituée.", "concl": "Donc, David et Laura encourent chacun une amende de 1 500 € au plus, pour chacune des deux victimes.", "note": "Si une faute délibérée était retenue (via L3342-1 CSP), 222-20 : 1 an et 15 000 €. NB : le TD écrit « 220-20 » : il s’agit de 222-20."}], "vig": ["Règlement intérieur ≠ règlement au sens de 121-3 (Crim. 10 mai 2000).", "Faute caractérisée + ITT ≤ 3 mois = contravention, pas délit : c’est le point qui surprend.", "La faute caractérisée peut naître d’une accumulation (AZF, Crim. 17 déc. 2019)."], "check": ["Causalité indirecte (121-3 al. 4)", "Faute délibérée écartée (règlement intérieur)", "Faute caractérisée par accumulation (2019)", "Conclusion : contravention R625-2", "Traitement commun des deux formateurs"]}, {"id": "s4c", "s": ["s2", "s4"], "src": "TD S4 · entraînement commun · mélange S2 + S4", "titre": "Tom, le bal des pompiers", "duree": 35, "enonce": "Le <b>13 juillet 2024<\/b> est organisé le bal des pompiers dans un petit village des Alpes-Maritimes. Deux amis, Tim et Tom, sont particulièrement enivrés. Une dispute éclate entre eux. Bien que retenu par son entourage, Tom décide de rentrer chez lui au volant de son véhicule. Particulièrement alcoolisé, Tom renverse Julie, qui décède immédiatement.", "question": "Qu’en pensez-vous ?", "brouillon": "Faits du 13 juill. 2024, <b>avant<\/b> la loi du 9 juill. 2025 (homicide routier, 221-18, en vigueur le 11 juill. 2025). → S2 d’abord : même peine (7 ans, 100 000 €) → la loi nouvelle n’est pas plus douce → ancien 221-6-1 al. 2 2°. Puis S4 : décès, causalité directe, faute (alcool), répression.", "plan": ["TEMPS — S1 conflit · S2 simple/complexe · S3 fond · S4 résolution (pas de rétroactivité in mitius)", "QUALIFICATION (ancien 221-6-1) — S1 résultat · S2 causalité directe · S3 faute · S4 répression (al. 2, 2°)"], "corr": [{"t": "Temps · 1er syllogisme · Conflit", "maj": "Selon l’art. <b>112-1<\/b> CP, il y a conflit lorsqu’une infraction commise sous une loi ancienne n’a pas été définitivement jugée à l’entrée en vigueur de la loi nouvelle. La loi n°2025-622 du 9 juillet 2025, publiée au JORF le 10 juillet, est entrée en vigueur le 11 juillet 2025.", "min": "L’homicide involontaire, infraction instantanée, a été consommé le 13 juillet 2024 par le décès immédiat de Julie, sous l’empire de l’ancien art. 221-6-1 ; aucun jugement définitif n’est mentionné.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Temps · 2e syllogisme · Simple ou complexe", "maj": "Définitions de la loi pénale simple et complexe.", "min": "S’agissant de l’homicide commis par un conducteur ivre, la loi opère une seule opération : elle supprime l’aggravation de l’ancien 221-6-1 al. 2 et la transfère dans un nouvel art. 221-18 (homicide routier), les autres modifications de la loi étant étrangères aux faits.", "concl": "Donc, au regard des faits, il s’agit d’une loi pénale simple.", "note": "Variante acceptable : loi complexe, dispositions indivisibles (même objet : la répression de l’homicide routier) → appréciation globale ; la solution est identique."}, {"t": "Temps · 3e syllogisme · Nature", "maj": "Une loi de fond modifie l’incrimination, les peines encourues ou les circonstances aggravantes.", "min": "La loi redéfinit l’incrimination et la répression de l’homicide involontaire commis par un conducteur en état alcoolique.", "concl": "Donc, il s’agit d’une loi de fond.", "note": ""}, {"t": "Temps · 4e syllogisme · Résolution", "maj": "Selon l’art. <b>112-1<\/b>, la loi de fond plus sévère ne rétroagit pas ; la loi de fond moins sévère rétroagit (in mitius).", "min": "L’ancien 221-6-1 al. 2 2° punissait l’homicide involontaire commis par un conducteur en état d’ivresse manifeste ou sous l’empire d’un état alcoolique de 7 ans d’emprisonnement et de 100 000 € d’amende ; le nouvel art. 221-18 2° prévoit les mêmes peines. N’étant pas moins sévère, la loi nouvelle ne rétroagit pas ; pour ce qu’elle aggrave éventuellement (peines complémentaires), elle ne s’applique qu’aux faits postérieurs.", "concl": "Donc, la loi pénale nouvelle ne tend pas à s’appliquer : Tom sera jugé sur le fondement de l’ancien art. 221-6-1.", "note": ""}, {"t": "Qualification · 1er syllogisme · Le résultat", "maj": "Selon l’ancien art. <b>221-6-1<\/b> CP, constitue un homicide involontaire le fait, pour le conducteur d’un véhicule terrestre à moteur, de causer la mort d’autrui dans les conditions et selon les distinctions de l’art. 121-3.", "min": "Julie est décédée immédiatement.", "concl": "Donc, le résultat exigé est caractérisé.", "note": ""}, {"t": "Qualification · 2e syllogisme · Le lien de causalité", "maj": "Art. 221-6-1 renvoyant à <b>121-3<\/b> : causalité certaine (Crim. 5 oct. 2004), directe ou indirecte ; directe lorsque l’auteur a heurté la victime ou contrôlé l’objet qui l’a heurtée (circ. 11 oct. 2000).", "min": "Tom conduisait le véhicule qui a renversé Julie, décédée des suites de ses blessures.", "concl": "Donc, le lien de causalité est certain et direct.", "note": ""}, {"t": "Qualification · 3e syllogisme · La faute", "maj": "En cas de causalité directe, une faute simple suffit, sans exclure la faute qualifiée (121-3 al. 3). Conduire sous l’empire d’un état alcoolique méconnaît l’interdiction de l’art. L234-1 du code de la route.", "min": "Tom, « particulièrement alcoolisé », a pris le volant malgré les tentatives de son entourage pour le retenir : il a conduit en connaissance de cause en état d’ivresse.", "concl": "Donc, une faute est caractérisée, et même une faute consciente et grave.", "note": ""}, {"t": "Qualification · 4e syllogisme · La répression", "maj": "Ancien art. <b>221-6-1<\/b> : 5 ans et 75 000 € ; peines portées à 7 ans et 100 000 € lorsque, notamment (2°), le conducteur se trouvait en état d’ivresse manifeste ou sous l’empire d’un état alcoolique caractérisé par un taux égal ou supérieur aux seuils du code de la route ; 10 ans et 150 000 € avec deux circonstances ou plus.", "min": "L’ivresse manifeste de Tom est décrite (« particulièrement enivré ») ; le taux devra être établi par les vérifications. Aucune autre circonstance (vitesse, défaut de permis…) n’est mentionnée.", "concl": "Donc, Tom encourt 7 ans d’emprisonnement et 100 000 € d’amende.", "note": ""}], "vig": ["Le cas « commun » est en réalité un mélange S2 + S4 : la date (13 juill. 2024) est l’indice.", "Même peine = pas de rétroactivité in mitius : la loi ancienne survit pour les faits antérieurs."], "check": ["J’ai repéré la date antérieure à la loi de 2025", "J’ai comparé les peines (7 ans / 100 000 € des deux côtés)", "J’ai appliqué l’ancien 221-6-1", "Causalité directe", "Aggravation 2° (alcool)"]}, {"id": "m1", "s": ["s1", "s4"], "src": "Cas mixte inédit · S1 + S4", "titre": "Inès, Barcelone", "duree": 35, "mixte": true, "enonce": "Le 14 mars 2026, Inès, étudiante française en Erasmus, traverse une avenue de Barcelone sur un passage piéton. Pablo, ressortissant espagnol, arrive au volant de sa voiture en lisant un message sur son téléphone tenu en main ; il ne la voit pas et la percute. Inès décède sur le coup. Pablo a été condamné définitivement par un tribunal de Barcelone à 12 mois d’emprisonnement ; il purge sa peine depuis deux mois. Les parents d’Inès, de retour à Lyon, déposent plainte et veulent savoir si Pablo peut être jugé en France.", "question": "La loi pénale française est-elle applicable et, si oui, que risque Pablo ?", "brouillon": "Homicide d’un piéton par un conducteur au téléphone tenu en main, après le 11 juill. 2025 → <b>homicide routier 221-18 8°<\/b> (délit, 7 ans). Espagne, auteur espagnol, victime <b>française<\/b> → 113-7 (délit puni d’emprisonnement) + 113-8 (requête du MP après plainte des ayants droit) + <b>113-9<\/b> (peine non entièrement subie → pas d’obstacle).", "plan": ["Espace — S1 territorialité (exclue) · S2 compétence passive (113-7, 113-8, 113-9)", "Qualification — S1 résultat · S2 causalité directe · S3 faute · S4 répression (221-18 8°)"], "corr": [{"t": "Espace · 1er syllogisme · Territorialité", "maj": "Art. <b>113-2<\/b> CP.", "min": "Les faits ont eu lieu intégralement à Barcelone.", "concl": "Donc, le principe de territorialité ne s’appliquant pas, il ne permet pas l’application de la loi pénale française.", "note": ""}, {"t": "Espace · 2d syllogisme · Compétence personnelle passive", "maj": "Selon l’art. <b>113-7<\/b>, la loi pénale française est applicable à tout délit puni d’emprisonnement commis par un étranger hors du territoire lorsque la victime est française au moment de l’infraction. Selon l’art. <b>113-8<\/b>, la poursuite des délits ne peut être exercée qu’à la requête du ministère public, précédée d’une plainte de la victime ou de ses ayants droit ou d’une dénonciation officielle. Selon l’art. <b>113-9<\/b>, aucune poursuite n’est possible contre la personne qui justifie avoir été définitivement jugée à l’étranger et, en cas de condamnation, avoir subi sa peine ou bénéficier de sa prescription.", "min": "Inès est française. L’homicide routier, puni de 7 ans d’emprisonnement, est un délit puni d’emprisonnement. Ses parents, ayants droit, ont porté plainte : la poursuite suppose une requête du ministère public. Pablo a été définitivement condamné en Espagne, mais n’a purgé que deux mois sur douze : sa peine n’est ni subie ni prescrite, 113-9 ne fait pas obstacle.", "concl": "Donc, le système de compétence personnelle passive tend à s’appliquer et la loi pénale française est applicable, sous réserve d’une requête du ministère public.", "note": ""}, {"t": "Qualification · 1er syllogisme · Résultat", "maj": "Art. <b>221-18<\/b> CP : le fait, pour le conducteur d’un véhicule terrestre à moteur, de causer la mort d’autrui dans les conditions de 121-3, avec l’une des circonstances énumérées.", "min": "Inès est décédée.", "concl": "Donc, le résultat est caractérisé.", "note": ""}, {"t": "Qualification · 2e syllogisme · Causalité", "maj": "Art. 221-18 renvoyant à <b>121-3<\/b> ; causalité certaine (Crim. 5 oct. 2004) ; directe si l’auteur a heurté la victime ou contrôlé l’objet qui l’a heurtée (circ. 11 oct. 2000).", "min": "Pablo conduisait la voiture qui a percuté Inès.", "concl": "Donc, le lien de causalité est certain et direct.", "note": ""}, {"t": "Qualification · 3e syllogisme · Faute", "maj": "Causalité directe : une faute simple suffit, sans exclure la faute qualifiée (121-3). Le code de la route interdit l’usage d’un téléphone tenu en main par le conducteur d’un véhicule en circulation.", "min": "Pablo lisait un message sur son téléphone tenu en main et n’a pas vu la piétonne engagée sur le passage : inattention fautive.", "concl": "Donc, une faute est caractérisée.", "note": ""}, {"t": "Qualification · 4e syllogisme · Répression", "maj": "Art. <b>221-18 8°<\/b> : 7 ans d’emprisonnement et 100 000 € d’amende lorsque le conducteur a contrevenu aux dispositions réglementant l’usage du téléphone tenu en main ; 10 ans et 150 000 € avec deux circonstances ou plus.", "min": "Une circonstance (téléphone tenu en main) ; aucune autre n’est établie.", "concl": "Donc, Pablo encourt 7 ans d’emprisonnement et 100 000 € d’amende.", "note": ""}], "vig": ["113-9 : jugé définitivement + peine subie ou prescrite. « En cours d’exécution » ne suffit pas.", "Un mélange typique : S1 décide si la loi française s’applique, S4 dit ce qu’elle punit."], "check": ["113-7 : délit puni d’emprisonnement", "113-8 : plainte des ayants droit + requête du MP", "113-9 : peine non subie", "221-18 8°", "Causalité directe"]}, {"id": "m2", "s": ["s2", "s3"], "src": "Cas mixte inédit · S2 + S3", "titre": "Karim et la berline", "duree": 40, "mixte": true, "enonce": "Le 3 mai 2026, vers 3h du matin, Karim ouvre avec un passe la portière d’une berline garée dans une rue de Villeurbanne, s’installe au volant et tente de démarrer le véhicule en manipulant les fils sous le tableau de bord. Le propriétaire, réveillé par le bruit, descend dans la rue ; Karim s’enfuit en courant. Il est identifié grâce à la vidéoprotection.<br>Deux lois (fictives) entrent ensuite en vigueur :<br>• le <b>1er octobre 2026<\/b>, une loi dont l’<b>art. 1er<\/b> porte la peine du vol (311-3) à 4 ans d’emprisonnement et 60 000 € d’amende, et dont l’<b>art. 2<\/b> crée un fichier national des auteurs de vols de véhicules, destiné à prévenir la réitération ;<br>• le <b>15 novembre 2026<\/b>, une loi qui confie le jugement des vols de véhicules à des chambres correctionnelles spécialisées.<br>L’audience de Karim devant le tribunal correctionnel est fixée au 10 décembre 2026.", "question": "Karim peut-il être poursuivi, selon quelles règles et pour quelle peine ?", "brouillon": "Tentative de vol (délit : tentative incriminée par 311-13). Loi 1 : complexe divisible : art. 1er = fond plus sévère → non rétroactif ; art. 2 = mesure de sûreté → applicable. Loi 2 : simple, forme 112-2 1° (compétence), aucun jugement au fond → applicable. Peine : ancien 311-3 (3 ans, 45 000 €).", "plan": ["TEMPS — Loi 1 : conflit · complexe · divisible · art. 1er fond plus sévère → non-rétroactivité · art. 2 sûreté → application", "TEMPS — Loi 2 : conflit · simple · forme 112-2 1° · pas de jugement au fond → application immédiate", "QUALIFICATION — tentative de vol : T1 à T5"], "corr": [{"t": "Loi 1 · 1er syllogisme · Conflit", "maj": "Art. <b>112-1<\/b> CP.", "min": "La tentative de vol, infraction instantanée, a été commise le 3 mai 2026 ; la loi entre en vigueur le 1er octobre 2026 ; aucun jugement.", "concl": "Donc, un conflit de lois pénales dans le temps, qu’il convient de résoudre, est identifié.", "note": ""}, {"t": "Loi 1 · 2e syllogisme · Simple ou complexe", "maj": "Définitions.", "min": "La loi modifie la peine du vol (art. 1er) et crée un fichier (art. 2).", "concl": "Donc, il s’agit d’une loi pénale complexe.", "note": ""}, {"t": "Loi 1 · 2e syllogisme bis · Divisible ou indivisible", "maj": "Divisible si objets distincts → application distributive (Crim. 21 avr. 1982) ; indivisible si même objet → appréciation globale (Crim. 5 juin 1971).", "min": "La répression d’une part, la prévention de la réitération d’autre part : objets distincts.", "concl": "Donc, il s’agit d’une loi pénale complexe divisible imposant une application distributive.", "note": ""}, {"t": "Loi 1, art. 1er · 3e et 4e syllogismes", "maj": "Loi de fond : modifie les peines encourues. <b>112-1<\/b> : la loi de fond plus sévère ne s’applique qu’aux faits commis après son entrée en vigueur.", "min": "La peine passe de 3 à 4 ans d’emprisonnement et de 45 000 à 60 000 € : disposition de fond plus sévère ; les faits sont antérieurs.", "concl": "Donc, la loi pénale nouvelle ne tend pas à s’appliquer sur ce point : l’ancien art. 311-3 demeure applicable.", "note": "Voie rapide : la fiche fait deux syllogismes (nature, puis résolution) ; ils sont regroupés ici pour la lisibilité."}, {"t": "Loi 1, art. 2 · 3e et 4e syllogismes", "maj": "Mesure de sûreté : sans objectif répressif, en réaction à un comportement dangereux (Cons. const., 8 déc. 2005) ; applicable aux faits antérieurs (Crim. 26 nov. 1997).", "min": "Le fichier vise à prévenir la réitération.", "concl": "Donc, la loi s’applique partiellement : l’art. 2 est applicable, à ment d’exécution est caractérisé.", "note": ""}, {"t": "Tentative · 4e syllogisme · Désistement involontaire", "maj": "Art. <b>121-5<\/b> ; l’intervention d’un tiers rend le désistement involontaire si elle contraint l’auteur à renoncer (Crim. 20 mars 1974, Weinberg, a contrario).", "min": "Karim s’enfuit à l’arrivée du propriétaire : c’est la crainte d’être pris, provoquée par un tiers, et non un renoncement libre.", "concl": "Donc, le désistement est involontaire.", "note": ""}, {"t": "Tentative · 5e syllogisme · Répression", "maj": "Art. <b>121-4 2°<\/b>, <b>311-13<\/b> et <b>311-3<\/b> dans sa rédaction antérieure à la loi du 1er octobre 2026.", "min": "Loi plus sévère non rétroactive (voir supra).", "concl": "Donc, Karim encourt 3 ans d’emprisonnement et 45 000 € d’amende, ainsi que l’inscription au fichier.", "note": ""}], "vig": ["Délit → cite le texte qui incrimine la tentative (311-13).", "Le résultat de S2 (ancien 311-3) se réinjecte dans le syllogisme de répression.", "Weinberg : le juge doit vérifier si le renoncement était libre."], "check": ["Loi 1 divisible, application distributive", "Art. 1er non rétroactif / art. 2 sûreté applicable", "Loi 2 : 112-2 1°, pas de jugement au fond", "Tentative de délit : 311-13", "Peine de l’ancien 311-3"]}, {"id": "m3", "s": ["s1", "s2", "s3"], "src": "Cas mixte inédit · S1 + S2 + S3", "titre": "Le faux site d’Arnaud", "duree": 45, "mixte": true, "enonce": "Depuis Liège (Belgique), Arnaud, ressortissant belge, exploite à partir de janvier 2026 un site rédigé en français, aux prix en euros, proposant des places de concert à Paris et Lyon, « livraison gratuite en France uniquement ». Il affiche de faux avis clients et un faux certificat de « revendeur agréé ». Une cinquantaine d’acheteurs résidant en France paient des billets qui n’existent pas ; la dernière remise date du <b>20 septembre 2026<\/b>. Le 25 septembre, Léo, lyonnais, renseigne ses coordonnées bancaires mais, intrigué par une faute dans le certificat, annule le paiement juste avant de valider.<br>Une loi (fictive) entrée en vigueur le <b>1er septembre 2026<\/b> porte la peine de l’escroquerie à 7 ans d’emprisonnement et 500 000 € d’amende.", "question": "Arnaud peut-il être poursuivi en France et que risque-t-il ?", "brouillon": "Escroquerie (313-1) via internet, public français visé → territorialité (Crim. 12 juill. 2016 ; aussi 113-2-1 : victimes résidant en France). Escroquerie = infraction <b>complexe<\/b>, remises successives formant un tout → consommée à la dernière remise (Crim. 17 déc. 1974) : 20 sept., après la loi → <b>pas de conflit<\/b>, loi nouvelle applicable. Léo : tentative d’escroquerie ? Désistement de Léo ≠ désistement d’Arnaud → tentative involontairement manquée (313-3 incrimine la tentative).", "plan": ["Espace — S1 territorialité (internet, public français visé) → applicable", "Temps — S1 conflit : infraction complexe consommée après la loi → pas de conflit", "Escroquerie consommée — S1 matériel · S2 moral · S3 répression (loi nouvelle)", "Léo — tentative : T1 à T5"], "corr": [{"t": "Espace · Syllogisme unique · Territorialité", "maj": "Art. <b>113-2<\/b> CP ; est réputée commise en France l’infraction commise à l’étranger sur internet lorsque le public français est précisément visé (Crim. 12 juill. 2016, n°15-86.645). Au surplus, l’art. 113-2-1 répute commis en France tout crime ou délit réalisé au moyen d’un réseau de communication électronique au préjudice d’une personne résidant en France.", "min": "Le site est rédigé en français, affiche des prix en euros, vend des places pour Paris et Lyon et ne livre qu’en France : le public français est précisément visé. Les victimes résident en France, où les remises ont été déterminées.", "concl": "Donc, le principe de territorialité tend à s’appliquer et la loi pénale française est applicable.", "note": ""}, {"t": "Temps · 1er syllogisme · Conflit", "maj": "Art. <b>112-1<\/b>. L’escroquerie est une infraction complexe, consommée à la remise ; lorsque des manœuvres répétées forment un tout indivisible et provoquent des remises successives, elle ne s’achève qu’à la dernière remise (Crim. 17 déc. 1974).", "min": "Les manœuvres (faux site, faux avis, faux certificat) forment un dispositif unique, ayant provoqué des remises successives jusqu’au 20 septembre 2026, après l’entrée en vigueur de la loi le 1er septembre.", "concl": "Donc, aucun conflit de lois pénales dans le temps n’est caractérisé, l’infraction se poursuivant après l’entrée en vigueur de la loi pénale nouvelle, celle-ci tend à s’appliquer.", "note": ""}, {"t": "Escroquerie · 1er syllogisme · Élément matériel", "maj": "Art. <b>313-1<\/b> : tromper une personne par l’usage d’un faux nom ou d’une fausse qualité, l’abus d’une qualité vraie, ou l’emploi de manœuvres frauduleuses, et la déterminer ainsi à remettre des fonds.", "min": "Un site trompeur, appuyé de faux avis et d’un faux certificat, constitue des manœuvres frauduleuses (faits extérieurs donnant crédit au mensonge) ; les acheteurs ont été déterminés à payer.", "concl": "Donc, l’élément matériel de l’escroquerie est caractérisé.", "note": ""}, {"t": "Escroquerie · 2e syllogisme · Élément moral", "maj": "Dol général : conscience de tromper et volonté d’obtenir la remise.", "min": "Arnaud savait les billets inexistants et a fabriqué de faux documents pour convaincre.", "concl": "Donc, l’élément moral est caractérisé.", "note": ""}, {"t": "Escroquerie · 3e syllogisme · Répression", "maj": "Art. <b>313-1<\/b> dans sa rédaction issue de la loi du 1er septembre 2026 : 7 ans et 500 000 €.", "min": "La loi nouvelle est applicable (pas de conflit).", "concl": "Donc, Arnaud encourt 7 ans d’emprisonnement et 500 000 € d’amende.", "note": ""}, {"t": "Léo · Tentative · 1er et 2e syllogismes", "maj": "Art. <b>313-1<\/b> (remise exigée) ; art. <b>121-4 2°<\/b> et <b>313-3<\/b> : la tentative d’escroquerie est punie des mêmes peines.", "min": "Léo n’a rien remis ; l’escroquerie est un délit dont la tentative est
