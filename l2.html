function readL2Course(c,prefix){
  const g=k=>{try{return localStorage.getItem(prefix+c.key+'_'+k);}catch(e){return null;}};
  let time=+(g('time')||0);
  if(!time){try{const r=localStorage.getItem(prefix+c.key+'_insight');if(r){const d=JSON.parse(r);time=Math.round((d.totalActiveMs||0)/1000);}}catch(e){}}
  let succes=0;const sr=g('succes');if(sr){try{const a=JSON.parse(sr);succes=Array.isArray(a)?a.length:+a||0;}catch(e){succes=+sr||0;}}
  let activity={};try{activity=JSON.parse(g('activity')||'{}')||{};}catch(e){}
  return {xp:+(g('xp')||0),succes:Math.min(succes,c.maxSuc||succes),quiz:+(g('quiz')||0),time,last:+(g('lastvisit')||0),activity};
}

/* ▸ PROGRESSION : le meilleur des deux entre l'XP et le temps passé.
     Le temps compte par paliers de 25 % : 3 h pour une matière « glace », 2 h 30 pour la
     finance, 1 h 30 pour un cours (un livre se libère donc à 50 % d'XP ou après 3 h). */
const PALIER_ICE=3*3600, PALIER_FIN=2.5*3600, PALIER_COURSE=1.5*3600;
const FIN_KEYS=new Set(['l2_aff','l2_fin']);
function timeProg(sec,palier){return Math.min(1,Math.floor((sec||0)/palier)*0.25);}

/* ▸ FONTE DÉJÀ MONTRÉE : on mémorise l'état affiché de chaque bloc / livre / objet.
     À l'arrivée, l'animation ne se joue que si la progression a augmenté depuis
     (= une leçon a été travaillée) ; rouvrir le site ne la rejoue pas. ?fonte=1 force. */
const SEEN={key:'',data:{}};
function seenLoad(user,real){
  SEEN.key=(user?'rvision_'+user+'_':'rvision_')+'l2_seen'+(real?'':'_demo');
  try{SEEN.data=JSON.parse(localStorage.getItem(SEEN.key)||'{}')||{};}catch(e){SEEN.data={};}
}
function seenGet(id){if(Q.has('fonte'))return null;const v=SEEN.data[id];return typeof v==='number'?v:null;}
function seenSet(id,v){v=Math.round(clamp01(v)*1000)/1000;if(SEEN.data[id]===v)return;SEEN.data[id]=v;try{localStorage.setItem(SEEN.key,JSON.stringify(SEEN.data));}catch(e){}}

const RANKS_L2=[{xp:0,n:'ÉTUDIANT'},{xp:300,n:'JURISTE'},{xp:800,n:'AVOCAT'},{xp:1500,n:'MAGISTRAT'},{xp:3000,n:'DOCTEUR'},{xp:6000,n:'PROFESSEUR'}];

function loadL2Data(subjects){
  let user='';try{user=localStorage.getItem('rvision_current_user')||'';}catch(e){}
  const prefix=user?'rvision_'+user+'_':'rvision_';
  const out={user,subjects:{},real:false};
  let any=false;
  subjects.forEach(sj=>{
    const cs=COURSES_L2.filter(c=>c.subject===sj.key).map(c=>({...c,...readL2Course(c,prefix)}));
    const S={courses:cs.length,done:0,xp:0,maxXp:0,succes:0,maxSuc:0,quiz:0,time:0,last:0,activity:{},list:cs};
    cs.forEach(c=>{S.xp+=c.xp;S.maxXp+=c.maxXp||0;S.succes+=c.succes;S.maxSuc+=c.maxSuc||0;S.quiz+=c.quiz;S.time+=c.time;S.last=Math.max(S.last,c.last);
      c.xpM=c.maxXp?Math.min(1,c.xp/c.maxXp):0;c.timeM=timeProg(c.time,PALIER_COURSE);
      c.mastery=Math.max(c.xpM,c.timeM);if(c.mastery>=0.5)S.done++;
      for(const d in c.activity)S.activity[d]=(S.activity[d]||0)+(+c.activity[d]||0);
      if(c.xp>0||c.time>0)any=true;});
    S.xpM=S.maxXp?Math.min(1,S.xp/S.maxXp):0;
    S.timeM=timeProg(S.time,FIN_KEYS.has(sj.key)?PALIER_FIN:PALIER_ICE);
    S.mastery=Math.max(S.xpM,S.timeM);
    out.subjects[sj.key]=S;
  });
  const force=Q.get('demo');
  out.real=force!=='1';
  seenLoad(user,out.real);
  if(!out.real){
    // démonstration : chiffres plausibles, cohérents avec les maîtrises de démo
    const r=mulberry32(4242);
    subjects.forEach(sj=>{const S=out.subjects[sj.key];const m=sj.demo;
      S.mastery=m;S.courses=sj.courses;S.done=sj.done;S.maxXp=sj.courses*900;S.xp=Math.round(S.maxXp*m);
      S.maxSuc=sj.courses*24;S.succes=Math.round(S.maxSuc*m*0.8);S.quiz=Math.round(20+m*180+r()*30);S.time=Math.round((1+m*7+r()*1.5)*3600);
      S.last=Date.now()-Math.round(r()*9)*86400000;S.activity={};
      S.list=Array.from({length:sj.courses},(_,k)=>{const cm=clamp01(m*1.25-0.18*k+(r()-0.5)*0.2);return {id:sj.key+'_demo'+k,name:'Cours '+(k+1),mastery:cm,demo:true};});
      S.done=S.list.filter(c=>c.mastery>=0.5).length;
      for(let d=0;d<84;d++){if(d<4||r()<0.06+m*0.1){const k=new Date(Date.now()-d*86400000).toISOString().slice(0,10);S.activity[k]=Math.round(4+r()*30*m);}}});
  }
  // totaux
  const T={xp:0,maxXp:0,succes:0,maxSuc:0,quiz:0,time:0,last:0,activity:{},courses:0,done:0};
  subjects.forEach(sj=>{const S=out.subjects[sj.key];T.xp+=S.xp;T.maxXp+=S.maxXp;T.succes+=S.succes;T.maxSuc+=S.maxSuc;T.quiz+=S.quiz;T.time+=S.time;T.last=Math.max(T.last,S.last);T.courses+=S.courses;T.done+=S.done;
    for(const d in S.activity)T.activity[d]=(T.activity[d]||0)+S.activity[d];});
  // maîtrise globale : pondérée par le contenu publié (vraies données), moyenne simple en démo
  T.mastery=subjects.reduce((a,sj)=>a+out.subjects[sj.key].mastery,0)/subjects.length;
  T.rank=[...RANKS_L2].reverse().find(r=>T.xp>=r.xp)||RANKS_L2[0];
  // série : jours consécutifs avec activité, jusqu'à aujourd'hui (ou hier)
  let streak=0;for(let d=0;d<400;d++){const k=new Date(Date.now()-d*86400000).toISOString().slice(0,10);if(T.activity[k])streak++;else if(d>0)break;}
  T.streak=streak;
  const weakest=subjects.slice().sort((a,b)=>out.subjects[a.key].mastery-out.subjects[b.key].mastery)[0];
  const best=subjects.slice().sort((a,b)=>out.subjects[b.key].mastery-out.subjects[a.key].mastery)[0];
  T.weakest=weakest;T.best=best;
  out.totals=T;
  return out;
}
function fmtDuree(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h>0?h+' h '+String(m).padStart(2,'0'):m+' min';}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}

/* ═══ 25 · Le mur de glace : trois dalles posées sur le sable, chacune porte un écran net ═══
   La dalle (glace teintée de sable, arêtes ébréchées, pied pris dans une congère) reste en 3D.
   Les statistiques ne sont plus gravées dans une texture (floue de près, illisible de loin) :
   chaque panneau est une vraie page HTML/SVG, projetée exactement sur la face avant de sa
   dalle (homographie CSS recalculée à chaque image). Texte vectoriel net à toute taille,
   graphiques en couleur (une couleur par matière), survol et clic natifs.
     1 · Vue d'ensemble : maîtrise globale (anneau par matière), rang, chiffres clés, tableau
     2 · Activité : succès par matière, temps du jour, semaine / mois, dernières sessions
     3 · Analyse : moteur INSIGHT (lacunes, notions denses, à consolider, à surveiller, points forts) */
const WALL={x:62,z:-24};
function wallDims(){const portrait=VW/VH<0.9;return portrait?{W:5.4,H:8.6,D:1.15,portrait:true}:{W:11,H:6.3,D:1.2,portrait:false};}
/* rectangle de l'écran sur la face avant (repère de la dalle) */
function wallPanelRect(D){return D.portrait?{x0:-D.W/2+0.3,x1:D.W/2-0.3,y0:0.5,y1:D.H-1.0}:{x0:-D.W/2+0.42,x1:D.W/2-0.42,y0:0.5,y1:D.H-1.0};}
const WALLST={hm:'week',mo:0,ana:null};
function wToday(){return new Date().toISOString().slice(0,10);}
function wSucDay(key){try{let u=localStorage.getItem('rvision_current_user')||'';return parseInt(localStorage.getItem((u?'rvision_'+u+'_':'rvision_')+'suc_day_'+key)||'0')||0;}catch(e){return 0;}}
const wCol=sj=>(typeof L2_SUBJ_COL!=='undefined'&&L2_SUBJ_COL[sj.key])||'#ffd9a8';
const wEsc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wNum=n=>Math.round(n).toLocaleString('fr-FR');
function wHead(data,page,title,D){
  return `<header class="wh"><p><b>${title}</b><span>Licence 2 · 2026–2027</span>${data.real?'':'<span class="dm">démo</span>'}</p><p class="r">${D.portrait?'':'<span>Profil : '+wEsc(data.user?data.user.toUpperCase():'invité')+'</span>'}<b>${page} / 3</b></p></header>`;
}
/* anneau segmenté (SVG) : segs = [{v (0..1 du tour), c, tip}] */
function wRing(segs,center,sub,R=42,sw=9){
  const C=2*Math.PI*R;let off=0;
  const arcs=segs.map((s,i)=>{const len=Math.max(0,s.v*C);const gap=len>3?1.4:0;
    const el=`<circle class="seg" r="${R}" cx="50" cy="50" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-linecap="butt" style="stroke-dasharray:0 ${C.toFixed(2)};stroke-dashoffset:${(-off).toFixed(2)};--d:${(0.15+i*0.12).toFixed(2)}s" data-dash="${Math.max(0,len-gap).toFixed(2)} ${C.toFixed(2)}"${s.tip?` data-tip="${wEsc(s.tip)}"`:''}/>`;off+=len;return el;}).join('');
  return `<div class="ring"><svg viewBox="0 0 100 100"><circle r="${R}" cx="50" cy="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${sw}"/><g transform="rotate(-90 50 50)">${arcs}</g></svg><div class="rc">${center}${sub?`<small>${sub}</small>`:''}</div></div>`;
}

/* ── 1 · Vue d'ensemble ── */
function wpOverview(data,subjects,D){
  const T=data.totals,td=wToday();let todaySec=0;subjects.forEach(sj=>{todaySec+=((data.subjects[sj.key].activity||{})[td]||0)*15;});
  const n=subjects.length;
  const ring=wRing(subjects.map(sj=>{const S=data.subjects[sj.key];return {v:S.mastery/n,c:wCol(sj),tip:sj.name+' · '+Math.round(S.mastery*100)+' % (part du total : '+Math.round(S.mastery/n*100)+' pts)'};}),
    `<span class="rv"><b data-count="${Math.round(T.mastery*100)}">0</b><i>%</i></span>`,'maîtrise globale');
  const K=[['Temps total',fmtDuree(T.time)],["Aujourd'hui",fmtDuree(todaySec)],['Série',T.streak+' j'],['Succès',T.succes+' / '+T.maxSuc],['Quiz',String(T.quiz)],['Dernière act.',fmtDate(T.last)]];
  const rows=subjects.map((sj,i)=>{const S=data.subjects[sj.key],ph=(sj.phases||PHASES)[phaseOf(S.mastery,S.mastery>0)],m=Math.round(S.mastery*100);
    return `<button type="button" class="wt-r" data-row="${i}" style="--c:${wCol(sj)};--d:${(0.2+i*0.08).toFixed(2)}s">
      <span class="nm"><i class="dot"></i><span><b>${wEsc(sj.name.charAt(0)+sj.name.slice(1).toLowerCase())}</b><small>${(sj.phaseKey||'FONTE')} ${ph.id}/IV · ${ph.name}</small></span></span>
      <span class="ms"><span class="bar"><i data-w="${m}"></i></span><em>${m}<small>%</small></em></span>
      <span class="r">${wNum(S.xp)}</span><span class="r">${Math.min(S.succes,S.maxSuc)}<small>/${S.maxSuc}</small></span></button>`;}).join('');
  const wk=T.weakest;
  return wHead(data,1,'Statistiques',D)+`<div class="wb ov">
    <section class="ov-l">
      <div class="ov-hero">${ring}<div class="ov-rk"><small>Rang</small><b>${wEsc(T.rank.n)}</b><span>${wNum(T.xp)} XP</span><span>${T.done} / ${T.courses} cours validés</span></div></div>
      <div class="kp">${K.map(([l,v])=>`<div><small>${l}</small><b>${wEsc(v)}</b></div>`).join('')}</div>
    </section>
    <section class="ov-r">
      <div class="wt"><div class="wt-h"><span>Matière</span><span>Maîtrise</span><span class="r">XP</span><span class="r">Succès</span></div>${rows}</div>
      <div class="pri" style="--c:${wCol(wk)}"><small>À reprendre en priorité</small><b>→ ${wEsc(wk.name.charAt(0)+wk.name.slice(1).toLowerCase())}</b><em>${Math.round(data.subjects[wk.key].mastery*100)} %</em></div>
    </section></div>`;
}

/* ── 2 · Activité ── */
function wpHeat(data){
  const act=data.totals.activity||{},today=new Date(),tk=wToday();
  const tog=`<div class="tg"><button type="button" data-hm="week" class="${WALLST.hm==='week'?'on':''}">Semaine</button><button type="button" data-hm="month" class="${WALLST.hm==='month'?'on':''}">Mois</button></div>`;
  if(WALLST.hm==='week'){
    const dow=today.getDay()===0?7:today.getDay();const mon=new Date(today);mon.setDate(today.getDate()-(dow-1));
    const J=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];const cells=[];
    for(let d=0;d<7;d++){const cd=new Date(mon);cd.setDate(mon.getDate()+d);const key=cd.toISOString().slice(0,10);const ses=act[key]||0;cells.push({key,mins:Math.round(ses/4),fut:cd>today&&key!==tk,today:key===tk,suc:wSucDay(key),d:cd,lab:J[d]});}
    const mx=Math.max(1,...cells.filter(q=>!q.fut).map(q=>q.mins));
    return `<h4>Semaine en cours ${tog}</h4><div class="wk">${cells.map((q,i)=>`<div class="${q.today?'td':''}${q.fut?' fu':''}" data-tip="${wEsc(q.d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' · '+(q.mins>0?q.mins+' min':'aucune session')+(q.suc?' · '+q.suc+' succès':''))}">
      <em>${q.mins>0?q.mins+'′':''}</em><span class="tr"><i data-h="${q.fut?0:Math.max(q.mins>0?6:0,q.mins/mx*100)}" style="--d:${(0.2+i*0.06).toFixed(2)}s"></i></span><b>${q.lab}</b><small>${q.d.getDate()}.${String(q.d.getMonth()+1).padStart(2,'0')}</small></div>`).join('')}</div>`;
  }
  const ref=new Date(today.getFullYear(),today.getMonth()+WALLST.mo,1),y=ref.getFullYear(),m=ref.getMonth();
  const off=(ref.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();let cells='';
  for(let i=0;i<off;i++)cells+='<span class="e"></span>';
  for(let d=1;d<=dim;d++){const cd=new Date(y,m,d),key=cd.toISOString().slice(0,10),ses=act[key]||0,fut=cd>today&&key!==tk;
    const lv=fut||!ses?0:ses<=4?1:ses<=12?2:ses<=24?3:4;
    cells+=`<span class="l${lv}${key===tk?' td':''}${fut?' fu':''}" data-tip="${wEsc(cd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+' · '+(ses?Math.round(ses/4)+' min':'aucune session'))}">${d}</span>`;}
  return `<h4>${ref.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})} ${tog}</h4><div class="mo-n"><button type="button" data-nav="-1" aria-label="Mois précédent">‹</button><button type="button" data-nav="1" aria-label="Mois suivant" ${WALLST.mo<0?'':'disabled'}>›</button></div>
    <div class="mo"><b>L</b><b>M</b><b>M</b><b>J</b><b>V</b><b>S</b><b>D</b>${cells}</div><div class="lg"><span>moins</span><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>plus</span></div>`;
}
function wpActivity(data,subjects,D){
  const td=wToday();
  const bars=subjects.map((sj,i)=>{const S=data.subjects[sj.key],v=Math.min(S.succes,S.maxSuc),f=S.maxSuc?v/S.maxSuc:0;
    return `<div style="--c:${wCol(sj)}" data-tip="${wEsc(sj.name+' · '+v+' / '+S.maxSuc+' succès')}"><em>${v}</em><span class="tr"><i data-h="${(f*100).toFixed(1)}" style="--d:${(0.2+i*0.08).toFixed(2)}s"></i></span><b>${String(sj.idx).padStart(2,'0')}</b></div>`;}).join('');
  const vals=subjects.map(sj=>((data.subjects[sj.key].activity||{})[td]||0)*15),tot=vals.reduce((a,b)=>a+b,0);
  const ring=wRing(tot?subjects.map((sj,i)=>({v:vals[i]/tot,c:wCol(sj),tip:sj.name+' · '+fmtDuree(vals[i])})).filter(s=>s.v>0):[],`<b>${fmtDuree(tot)}</b>`,tot?"révisé aujourd'hui":'pas encore de session',40,12);
  const vis=subjects.map(sj=>({sj,last:data.subjects[sj.key].last||0})).filter(v=>v.last>0).sort((a,b)=>b.last-a.last).slice(0,5);
  const recent=vis.length?vis.map(v=>{const d=new Date(v.last),tdd=d.toDateString()===new Date().toDateString();
      return `<li style="--c:${wCol(v.sj)}"><i class="dot"></i><span>${wEsc(v.sj.name.charAt(0)+v.sj.name.slice(1).toLowerCase())}</span><em>${tdd?"aujourd'hui "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</em></li>`;}).join('')
    :'<li class="nil">Aucune session — ouvre un cours pour commencer.</li>';
  const legend=subjects.map((sj,i)=>`<li style="--c:${wCol(sj)}"><i class="dot"></i><span>${String(sj.idx).padStart(2,'0')} ${wEsc(sj.name.charAt(0)+sj.name.slice(1).toLowerCase())}</span><em>${vals[i]?fmtDuree(vals[i]):'—'}</em></li>`).join('');
  return wHead(data,2,'Activité',D)+`<div class="wb ac">
    <section class="ac-a"><h4>Succès par matière</h4><div class="bc">${bars}</div></section>
    <section class="ac-b"><h4>Temps aujourd'hui</h4><div class="tday">${ring}<ul class="lgd">${legend}</ul></div></section>
    <section class="ac-c" data-heat>${wpHeat(data)}</section>
    <section class="ac-d"><h4>Dernières sessions</h4><ul class="rec">${recent}</ul></section></div>`;
}

/* ── 3 · Analyse (moteur INSIGHT) ── */
function wpAnalysis(data,subjects,D){
  const A=WALLST.ana||{state:'empty'};
  if(A.state!=='ok'){
    const t=A.state==='start'?'Commence à travailler un cours':A.state==='insufficient'?'Données insuffisantes':'Aucune donnée pour l\'instant';
    const s=A.state==='start'?'Les recommandations apparaissent après 2 minutes actives ou 3 questions de quiz.':A.state==='insufficient'?'Continue à travailler — l\'analyse s\'affine automatiquement.':'Travaille dans les cours L2 : l\'analyse de tes points forts et de tes lacunes apparaîtra ici.';
    return wHead(data,3,'Analyse',D)+`<div class="wb an-e"><b>${t}</b><p>${s}</p></div>`;
  }
  const K=[['Temps actif',A.activeLabel,''],['Questions',String(A.totalQs),''],['Cours actifs',A.nCourses+' / '+A.nTotal,''],['Lacunes',String(A.lacunesN),A.lacunesN>0?'bad':'ok']];
  const item=(n,cls)=>`<li class="${cls}" data-tip="${wEsc((n.action||'')+(n.signals&&n.signals.length?' · '+n.signals.slice(0,2).map(s=>s.txt).join(' · '):''))}"${n.url?` data-url="${wEsc(n.url)}"`:''}>
      <span class="sc">${Math.round(n.score)}</span><span class="tx"><b>${wEsc(n.name)}</b><small>${wEsc(String(n.course||''))}${n.section&&n.section!==n.course?' · '+wEsc(n.section):''}</small></span>${n.url?'<i>→</i>':''}</li>`;
  const grp=(title,list,cls,max)=>list&&list.length?`<div class="grp ${cls}"><h4>${title}<em>${list.length}</em></h4><ul>${list.slice(0,max).map(n=>item(n,cls)).join('')}</ul></div>`:'';
  const P=D.portrait,mx=P?2:3;
  const top=A.top?`<div class="top" ${A.top.url?`data-url="${wEsc(A.top.url)}"`:''} data-tip="${wEsc(A.top.action||'')}"><small>À réviser en priorité</small><b>${wEsc(A.top.name)}</b><span>${wEsc(A.top.course||'')}${A.top.section?' · '+wEsc(A.top.section):''}</span><em class="sc">${Math.round(A.top.score)}</em>${A.top.url?'<i>Revoir →</i>':''}</div>`:'';
  const notes=(A.pause?'<p class="nt warn">⏸ Décrochage détecté — une pause de 15 min est recommandée maintenant.</p>':'')+(A.thirty&&A.profile?`<p class="nt">Profil d'apprentissage : <b>${wEsc(A.profile.label)}</b> (${A.profile.pct} %)</p>`:'');
  return wHead(data,3,'Analyse',D)+`<div class="wb an">
    <section class="an-t"><div class="kp k4">${K.map(([l,v,c])=>`<div class="${c}"><small>${l}</small><b>${wEsc(v)}</b></div>`).join('')}</div>${top}${notes}</section>
    <section class="an-c">
      <div class="col">${grp('Lacunes',A.lists.lacunes,'red',mx)}${grp('Notions denses',A.lists.complexes,'violet',2)}</div>
      <div class="col">${grp('À consolider',A.lists.fragiles,'orange',mx)}${grp('À surveiller',A.lists.watch,'blue',2)}</div>
      <div class="col">${grp('Points forts',A.lists.strong,'green',mx)}</div>
    </section></div>`;
}

/* ── dalle de glace (3D) ── */
function buildIceWall(parent,data,subjects,render,offset){
  const D=wallDims();offset=offset||0;
  const SX=Math.round(D.W*10),SY=Math.round(D.H*10),SZ=10;
  const g=new THREE.BoxGeometry(D.W,D.H+0.5,D.D,SX,SY,SZ);g.translate(0,(D.H+0.5)/2-0.5,0);
  const pa=g.attributes.position,sd=rand()*50;
  for(let i=0;i<pa.count;i++){
    let x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    const ex=Math.abs(x)/(D.W/2),top=y/D.H;
    const ytop=D.H-0.32*fbm2(x*0.35+sd,1.3,3)-0.55*Math.max(0,fbm2(x*0.8+sd,7.1,3)-0.52);
    if(y>0) y=y*(ytop/D.H);
    const side=1-0.05*fbm2(y*0.7+sd,3.3,3)-0.08*Math.max(0,fbm2(y*1.4,sd,2)-0.55);
    if(ex>0.8) x=x*lerp(1,side,smooth(0.8,1,ex));
    const edge=Math.max(smooth(0.86,1,ex),smooth(0.9,1,top),smooth(0.75,1,Math.abs(z)/(D.D/2))*0.3);
    const ch=(Math.max(0,fbm2(x*1.6+y*0.9+sd,z*2.0+y*1.3,3)-0.5))*0.5*edge;
    if(z<0) z=z-ch*0.6+0.04*fbm2(x*0.9,y*0.9,3);
    else z=z-ch*(ex>0.85||top>0.9?1:0.15);
    pa.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  const WU={uWall:{value:new THREE.Vector3(D.W,D.H,D.D)},uHot:{value:0}};
  const mat=new THREE.MeshPhysicalMaterial({color:new THREE.Color('#f3efe9'),roughness:0.1,transmission:1,thickness:1.1,ior:1.31,attenuationColor:new THREE.Color('#c99d70'),attenuationDistance:2.4,specularIntensity:1,envMapIntensity:1.2,clearcoat:0.3,clearcoatRoughness:0.08});
  const transChunk=THREE.ShaderChunk.transmission_fragment.replace('material.transmission = transmission;','material.transmission = transmission*rvTK;');
  patch(mat,{
    uniforms:WU,
    vHead:'varying vec3 vRvL;varying vec3 vRvNl;',vMain:'vRvL=transformed;vRvNl=objectNormal;',
    fHead:'varying vec3 vRvL;varying vec3 vRvNl;uniform vec3 uWall;uniform float uHot;float rvTK=1.0;float rvFr=0.0;',
    fColor:`
      float ex=abs(vRvL.x)/(uWall.x*0.5),ey=vRvL.y/uWall.y;
      rvFr=smoothstep(0.9,0.0,vRvL.y)*0.7+smoothstep(0.55,0.8,rvFbm3(vRvL*1.3))*0.3+smoothstep(0.82,1.0,ex)*0.6+smoothstep(0.85,1.0,ey)*0.5
        +smoothstep(0.62,0.9,rvNoise(vec3(vRvL.x*3.0,vRvL.y*0.4,vRvL.z*3.0)))*0.25;
      rvFr=clamp(rvFr,0.0,1.0);
      float topSand=smoothstep(0.6,0.95,vRvN.y)*smoothstep(0.35,0.7,rvFbm3(vRvL*2.0));
      diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.98,0.96,0.93),rvFr*0.55);
      diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.72,0.46,0.25),topSand*0.8);
      rvTK=(1.0-topSand*0.85)*(1.0-rvFr*0.35);`,
    fRough:`roughnessFactor=mix(0.05,0.42,rvFr);`,
    fNormal:`
      float hb=rvNoise(vec3(vRvL.x*2.2,vRvL.y*0.35,vRvL.z*2.2))*0.5+rvNoise(vRvL*14.0)*0.08;
      normal=rvPerturb(-vViewPosition,normal,hb*0.012,1.0);`,
    fEmissive:`
      float crk=smoothstep(0.008,0.0,abs(rvNoise(vRvL*vec3(0.3,0.5,0.3)+3.0)-0.5))*smoothstep(0.4,0.7,rvNoise(vRvL*0.8+9.0));
      totalEmissiveRadiance+=vec3(1.0,0.95,0.9)*crk*0.07+vec3(1.0,0.75,0.5)*uHot*0.08;`,
    reps:[['#include <transmission_fragment>',transChunk]],
  },'icewall2');
  const mesh=new THREE.Mesh(g,mat);mesh.receiveShadow=true;
  const grp=new THREE.Group();grp.add(mesh);const wx=WALL.x+Math.cos(-0.14)*offset,wz=WALL.z-Math.sin(-0.14)*offset;
  grp.position.set(wx,finField(wx,wz).h-0.05,wz);grp.rotation.y=-0.14;parent.add(grp);
  const PR=wallPanelRect(D);
  return {group:grp,mesh,WU,D,PR,render,started:false,t:0,dirty:true,
    center:new THREE.Vector3(wx,grp.position.y+(PR.y0+PR.y1)/2,wz)};
}

/* ── couche HTML : un écran par dalle, projeté sur sa face avant ── */
function buildWallUI(walls,subjects){
  const host=document.createElement('div');host.id='wallui';host.setAttribute('aria-hidden','true');document.body.appendChild(host);
  const _v=new THREE.Vector3();
  const P=walls.map((Wp,i)=>{
    const el=document.createElement('div');el.className='wp'+(Wp.D.portrait?' por':'');host.appendChild(el);
    const st={el,w:0,h:0,shown:false,revealed:false,html:''};
    return st;
  });
  function sizeOf(st,Wp,w){
    const asp=(Wp.PR.y1-Wp.PR.y0)/(Wp.PR.x1-Wp.PR.x0);w=Math.round(w);
    st.w=w;st.h=Math.round(w*asp);st.el.style.width=st.w+'px';st.el.style.height=st.h+'px';
    const fs=Wp.D.portrait?Math.max(9,Math.min(16,w/30)):Math.max(9.5,Math.min(19,w/78));st.el.style.fontSize=fs.toFixed(2)+'px';
  }
  function render(i,data){const Wp=walls[i],st=P[i];
    st.el.innerHTML=Wp.render(data,subjects,Wp.D);st.revealed=false;st.el.classList.remove('on');
    if(Wp.started)reveal(i,true);bind(i);}
  function reveal(i,instant){const st=P[i];if(st.revealed)return;st.revealed=true;const el=st.el;
    const go=()=>{el.classList.add('on');
      el.querySelectorAll('[data-w]').forEach(e=>{e.style.width=e.dataset.w+'%';});
      el.querySelectorAll('[data-h]').forEach(e=>{e.style.height=e.dataset.h+'%';});
      el.querySelectorAll('[data-dash]').forEach(e=>{e.style.strokeDasharray=e.dataset.dash;});
      el.querySelectorAll('[data-count]').forEach(e=>{const N=+e.dataset.count;if(instant){e.textContent=N;return;}const t0=performance.now();
        const stp=now=>{const k=Math.min(1,(now-t0)/1300);e.textContent=String(Math.round(N*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(stp);};requestAnimationFrame(stp);});};
    if(instant){el.classList.add('noanim');go();void el.offsetWidth;el.classList.remove('noanim');}else requestAnimationFrame(go);}
  function bind(i){const el=P[i].el;
    el.querySelectorAll('[data-row]').forEach(b=>b.addEventListener('click',()=>{if(SYS.ovl)SYS.ovl.open(subjects[+b.dataset.row],DATA,T);}));
    el.querySelectorAll('[data-hm]').forEach(b=>b.addEventListener('click',()=>{WALLST.hm=b.dataset.hm;WALLST.mo=0;heat(i);}));
    el.querySelectorAll('[data-url]').forEach(b=>{b.style.cursor='pointer';b.addEventListener('click',()=>window.open(b.dataset.url,'_blank','noopener'));});
    el.querySelectorAll('[data-tip]').forEach(b=>{b.addEventListener('mousemove',()=>wallTip(b.dataset.tip));b.addEventListener('mouseleave',()=>wallTip(null));});
    bindNav(i);}
  function bindNav(i){P[i].el.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{WALLST.mo=Math.min(0,WALLST.mo+(+b.dataset.nav));heat(i);}));}
  function heat(i){const sec=P[i].el.querySelector('[data-heat]');if(!sec)return;sec.innerHTML=wpHeat(DATA);
    sec.querySelectorAll('[data-hm]').forEach(b=>b.addEventListener('click',()=>{WALLST.hm=b.dataset.hm;WALLST.mo=0;heat(i);}));
    sec.querySelectorAll('[data-tip]').forEach(b=>{b.addEventListener('mousemove',()=>wallTip(b.dataset.tip));b.addEventListener('mouseleave',()=>wallTip(null));});
    bindNav(i);sec.querySelectorAll('[data-h]').forEach(e=>{e.style.height=e.dataset.h+'%';});}
  /* homographie : carré unité → quadrilatère écran (Heckbert), puis matrice CSS pour w×h px */
  function quad(q,w,h){
    const [x0,y0,x1,y1,x2,y2,x3,y3]=q;const sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let a,b,c,d,e,f,g,hh;
    if(Math.abs(sx)<1e-6&&Math.abs(sy)<1e-6){a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0;g=0;hh=0;}
    else{const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;g=(sx*dy2-dx2*sy)/den;hh=(dx1*sy-sx*dy1)/den;
      a=x1-x0+g*x1;b=x3-x0+hh*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+hh*y3;f=y0;}
    const F=v=>(Math.abs(v)<1e-12?0:v).toFixed(10);
    return `matrix3d(${F(a/w)},${F(d/w)},0,${F(g/w)},${F(b/h)},${F(e/h)},0,${F(hh/h)},0,0,1,0,${F(c)},${F(f)},0,1)`;
  }
  const cs=[[0,1],[1,1],[1,0],[0,0]];   // HG, HD, BD, BG (u, v : v=1 en haut)
  function update(Pp,dt,visible){
    walls.forEach((Wp,i)=>{const st=P[i];const o=Math.abs(Pp-(P_STATS+i));
      const on=visible&&o<1.15;
      if(!on){if(st.shown){st.shown=false;st.el.style.visibility='hidden';st.el.style.opacity='0';}return;}
      Wp.mesh.updateMatrixWorld();const pts=[];let ok=true;
      for(const [u,v] of cs){_v.set(lerp(Wp.PR.x0,Wp.PR.x1,u),lerp(Wp.PR.y0,Wp.PR.y1,v),Wp.D.D/2+0.01);Wp.mesh.localToWorld(_v);
        const vz=_v.clone().applyMatrix4(camera.matrixWorldInverse).z;if(vz>-camera.near*1.5){ok=false;break;}
        _v.project(camera);pts.push((_v.x*0.5+0.5)*VW,(-_v.y*0.5+0.5)*VH);}
      if(!ok){if(st.shown){st.shown=false;st.el.style.visibility='hidden';}return;}
      const pw=Math.hypot(pts[2]-pts[0],pts[3]-pts[1]);
      // taille CSS = taille à l'écran au repos (rendu du texte à l'échelle 1 : net) ; recalée à l'arrêt
      if(!st.w||(o<0.03&&Math.abs(pw-st.w)/st.w>0.03)){sizeOf(st,Wp,pw);if(!st.html){st.html='1';render(i,DATA);}}
      st.el.style.transform=quad(pts,st.w,st.h);
      const op=(1-smooth(0.55,1.1,o))*smooth(0,0.5,Wp.t||0);
      st.el.style.opacity=op.toFixed(3);st.el.style.visibility=op>0.01?'visible':'hidden';st.el.style.pointerEvents=o<0.3?'auto':'none';
      if(!st.shown){st.shown=true;}
      if(Wp.started&&!st.revealed)reveal(i,false);
    });
  }
  function rerender(){P.forEach((st,i)=>{if(st.html)render(i,DATA);});}
  return {host,panels:P,update,rerender,render};
}

/* ═══ 26 · Panneau de matière ═══
   Dans les grottes (glace / torches) : panneau latéral, la scène reste visible. Ailleurs (clic
   sur une ligne du mur de statistiques) : même contenu, centré.
   Contenu, du plus utile au moins utile :
     1 · maîtrise (barre épaisse) + flamme animée façon Duolingo : record de bonnes réponses
         d'affilée aux quiz de la matière (et série en cours)
     2 · points à revoir, choisis par le moteur INSIGHT (lacunes, notions fragiles) → lien direct
     3 · les livres (cours) : couleur du livre dans la grotte, progression, libéré ou non
     4 · quatre chiffres utiles : temps, réussite aux quiz, questions, dernière séance
     5 · le programme, replié */
const FLAME_SVG=`<svg viewBox="0 0 24 30" aria-hidden="true"><defs>
  <linearGradient id="flo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient>
  <linearGradient id="fli" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#ffd43b"/></linearGradient></defs>
  <path class="fo" d="M12 1.2c1.2 5 7.6 8.4 7.6 16.4a7.6 7.6 0 0 1-15.2 0c0-3.4 1.6-5.8 3.7-7.6.1 2 1.3 3.1 2.4 3.1-1.1-4.2-.4-8.4 1.5-11.9z" fill="url(#flo)"/>
  <path class="fi" d="M12 13.4c.8 2.6 3.9 3.6 3.9 6.9a3.9 3.9 0 0 1-7.8 0c0-2.1 1.4-3.3 2.5-4.2.2 1.1.9 1.6 1.4 1.4-.5-1.4-.5-2.9 0-4.1z" fill="url(#fli)"/></svg>`;
function buildOverlay(){
  const o=document.createElement('div');o.id='ovl';o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-hidden','true');
  o.innerHTML=`<button type="button" class="ovl-close" aria-label="Fermer">Fermer</button><div class="ovl-in"></div>`;
  document.body.appendChild(o);
  const $=s=>o.querySelector(s);
  const st={open:false};
  let raf=0,tm=0;
  function close(){if(!st.open)return;st.open=false;o.classList.remove('on');o.setAttribute('aria-hidden','true');cancelAnimationFrame(raf);clearTimeout(tm);
    setTimeout(()=>{if(!st.open){o.classList.remove('cave','m-ice','m-sand');$('.ovl-close').textContent='Fermer';}},520);}
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function open(sj,data,T,mode){
    const side=mode==='ice'||mode==='sand';
    const S=data.subjects[sj.key];const phs=(sj.phases||PHASES),ph=phs[phaseOf(S.mastery,S.mastery>0.0005)];
    const I=(typeof subjectInsightL2==='function')?subjectInsightL2(sj.key):{best:0,cur:0,correct:0,total:0,ms:0,review:[],any:false};
    const m=Math.round(S.mastery*100);
    const list=(S.list||[]);const freed=list.filter(c=>(c.mastery||0)>=BOOK_FREE).length;
    const where=mode==='ice'?'CAVERNE DE GLACE':mode==='sand'?'GROTTE AUX TORCHES':'MATIÈRE';
    const phTxt=(sj.phaseKey||'Fonte').toUpperCase()+' '+ph.id+' / IV · '+ph.name;
    // 1 · progression + flamme
    const fl=I.best>0;
    const prog=`<section class="cp-prog">
      <div class="cp-top"><span class="cp-pct"><b>${m}</b>%</span><span class="cp-ph">${esc(phTxt)}</span></div>
      <div class="cp-row">
        <div class="cp-bar" role="progressbar" aria-valuenow="${m}" aria-valuemin="0" aria-valuemax="100"><i data-w="${m}"></i></div>
        <div class="cp-flame${fl?'':' off'}" title="Record de flamme : ${I.best} bonnes réponses d'affilée">${FLAME_SVG}<span class="sp"><i></i><i></i><i></i></span><b data-n="${I.best}">${fl?0:'0'}</b></div>
      </div>
      <p class="cp-fl">${fl?`Record de flamme : <b>${I.best}</b> bonne${I.best>1?'s':''} réponse${I.best>1?'s':''} d'affilée${I.cur>0?` <span>· série en cours <b>${I.cur}</b></span>`:''}`:`Pas encore de flamme — enchaîne les bonnes réponses aux quiz pour l'allumer.`}</p>
    </section>`;
    // 2 · points à revoir
    const rv=I.review||[];
    const rev=`<section class="cp-sec"><h3>À revoir <em>selon l'algorithme</em></h3>${rv.length?`<ol class="cp-rev">${rv.map(n=>`<li class="${n.cls}">
        <span class="sc">${Math.round(n.score)}</span><span class="tx"><b>${esc(n.name)}</b><small>${esc(String(n.course||'').replace(/^.*? · /,''))}${n.section&&n.section!==n.course?' · '+esc(n.section):''}</small></span>
        ${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener" aria-label="Revoir ${esc(n.name)}">Revoir →</a>`:''}</li>`).join('')}</ol>`
      :`<p class="cp-empty">${I.any?'Aucune lacune détectée pour l\'instant — continue comme ça.':'L\'algorithme repère tes points faibles dès 3 questions de quiz ou 2 minutes de travail sur un cours.'}</p>`}</section>`;
    // 3 · livres
    const books=`<section class="cp-sec"><h3>${side?'Livres':'Cours'} <em>${freed} / ${list.length} libéré${freed>1?'s':''}</em></h3>${list.length?`<ul class="ovl-c">${list.map((c,i)=>{const cm=Math.round((c.mastery||0)*100),fr=(c.mastery||0)>=BOOK_FREE;
        return `<li data-i="${i}" class="${fr?'fr':''}${c.url?' lk':''}"><i class="bk" style="--bk:${BOOK_COLS[i%BOOK_COLS.length]}"></i><span class="oc-n">${esc(c.name)}</span>
          <span class="oc-b"><i style="width:${cm}%"></i><s style="left:${BOOK_FREE*100}%"></s></span><span class="oc-p">${cm}%</span>
          <span class="oc-s">${fr?'LIBRE':((mode==='sand'||(!mode&&FIN_KEYS.has(sj.key)))?'ENSABLÉ':'GELÉ')}</span>${c.url?`<a class="oc-a" href="${esc(c.url)}" aria-label="Ouvrir ${esc(c.name)}"></a>`:''}</li>`;}).join('')}</ul>`
      :`<p class="cp-empty">Aucun cours L2 publié pour cette matière pour l'instant — ils apparaîtront ici dès qu'ils seront ajoutés.</p>`}</section>`;
    // 4 · chiffres utiles
    const rate=I.total?Math.round(I.correct/I.total*100):null;
    const kpi=`<section class="cp-kpi">
      <div><small>Temps de travail</small><b>${fmtDuree(S.time||Math.round(I.ms/1000))}</b></div>
      <div><small>Réussite aux quiz</small><b>${rate===null?'—':rate+' %'}</b>${rate===null?'':`<span class="mini"><i style="width:${rate}%"></i></span>`}</div>
      <div><small>Questions</small><b>${I.total||S.quiz||0}</b></div>
      <div><small>Dernière séance</small><b>${S.last?fmtDate(S.last):'—'}</b></div></section>`;
    // 5 · programme (replié)
    const inf=SUBJ_INFO[sj.key]||{resume:'',reperes:[]};
    const prg=`<details class="cp-prg"><summary>Programme de la matière</summary><p class="ovl-r">${esc(inf.resume)}</p><ul class="ovl-rep">${inf.reperes.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>`;
    $('.ovl-in').innerHTML=`<header class="cp-head"><p class="ovl-k">${String(sj.idx).padStart(2,'0')} · ${where}${data.real?'':' · <span class="demo">DÉMO</span>'}</p><h2 class="ovl-t">${esc(sj.name)}</h2></header>${prog}${rev}${books}${kpi}${prg}`;
    $('.ovl-in').scrollTop=0;
    o.classList.toggle('cave',side);o.classList.toggle('m-ice',mode==='ice');o.classList.toggle('m-sand',mode==='sand');
    $('.ovl-close').textContent=side?'Remonter ↑':'Fermer';
    // clic sur une ligne de cours : ouvre le cours
    o.querySelectorAll('.ovl-c li.lk').forEach(li=>li.addEventListener('click',e=>{if(e.target.closest('a'))return;const a=li.querySelector('a.oc-a');if(a)window.location.href=a.href;}));
    st.open=true;o.classList.add('on');o.setAttribute('aria-hidden','false');if(!side)$('.ovl-close').focus({preventScroll:true});
    // animations : la barre se remplit, puis la flamme compte jusqu'au record et « saute »
    const bar=$('.cp-bar i'),num=$('.cp-flame b'),fx=$('.cp-flame');
    bar.style.width='0%';cancelAnimationFrame(raf);clearTimeout(tm);
    const delay=side?1150:250;
    tm=setTimeout(()=>{bar.style.width=bar.dataset.w+'%';
      const N=+num.dataset.n;if(!N)return;const t0=performance.now(),D=Math.min(1400,500+N*60);
      const stp=now=>{const k=Math.min(1,(now-t0)/D);num.textContent=String(Math.round(N*(1-Math.pow(1-k,3))));if(k<1)raf=requestAnimationFrame(stp);else{fx.classList.remove('pop');void fx.offsetWidth;fx.classList.add('pop');}};
      raf=requestAnimationFrame(stp);},delay);
  }
  $('.ovl-close').addEventListener('click',()=>{if(o.classList.contains('cave')&&typeof caveExit==='function')caveExit();else close();});
  o.addEventListener('click',e=>{if(e.target===o)close();});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&!o.classList.contains('cave'))close();});
  return {open,close,st};
}

/* ═══ 27 · Ruines : petites pyramides effondrées et ensablées, au loin dans la brume ═══
   Tout apparaît avec l'anneau de révélation du terrain (filaire puis solide). */

/* filaire de révélation partagé (même logique que le terrain) */
const REVEAL_WIRE_MAT=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:"#define RV_FRAG\n"+GLSL_NOISE+`uniform float uTerrainWire;uniform float uTerrainReveal;uniform float uWireAlpha;uniform vec3 uRevealColor;uniform float uFogDensity;
    varying vec3 vW;
    void main(){
      float rr=length(vW.xz)+(rvFbm3(vec3(vW.xz*0.05,2.0))-0.5)*30.0;
      if(rr>uTerrainWire) discard;
      float front=smoothstep(uTerrainWire-30.0,uTerrainWire,rr);
      float solid=step(rr,uTerrainReveal);
      float fog=exp(-length(cameraPosition-vW)*uFogDensity*0.8);
      float a=uWireAlpha*(0.35+0.9*front)*mix(1.0,0.0,solid)*fog;
      gl_FragColor=vec4(uRevealColor*a,a);
    }`});
function revealWire(geo,angle=28){const w=new THREE.LineSegments(new THREE.EdgesGeometry(geo,angle),REVEAL_WIRE_MAT);w.frustumCulled=false;w.renderOrder=2;return w;}
const GLSL_TREVEAL=`
  {float lT=length(vRvW.xz);if(lT>uTerrainReveal-16.0){float rrT=lT+(rvFbm3(vec3(vRvW.xz*0.05,2.0))-0.5)*30.0;
  if(rrT>uTerrainReveal) discard;}}`;
const GLSL_TREVEAL_E=`
  if(uRevealGlow>0.001){float lTE=length(vRvW.xz);if(lTE>uTerrainReveal-21.0){float rrTE=lTE+(rvFbm3(vec3(vRvW.xz*0.05,2.0))-0.5)*30.0;
  totalEmissiveRadiance+=uRevealColor*smoothstep(uTerrainReveal-5.0,uTerrainReveal,rrTE)*uRevealGlow*0.9;}}`;

function buildRuins(pyr){
  const grp=new THREE.Group();scene.add(grp);
  const {n0:N0,bw,bh}=PYR;
  /* ── pyramides satellites, effondrées et ensablées ── */
  const list=[],cores=[];
  for(const R of FEAT.ruins){
    const rr=mulberry32(R.seed*977);
    const by=duneH(R.x,R.z)-R.sink;
    const rot=new THREE.Matrix4().makeRotationY(R.rot);
    const collapse=Math.floor(rr()*4);
    const top=Math.max(2,Math.round(R.n0*R.cut+rr()*1.2));
    for(let k=0;k<R.n0;k++){
      const n=R.n0-k,y=k*bh+bh/2,side=n*bw;
      if(k>=top) break;
      const surv=k>=top-1?0.45:0.9-0.08*k;
      const cells=[];
      if(n===1) cells.push([0,0]);
      else for(let i=0;i<n;i++)for(let j=0;j<n;j++){if(i===0||j===0||i===n-1||j===n-1)cells.push([i,j]);}
      for(const [i,j] of cells){
        let ox=0,oz=0;if(n>1){if(i===0)ox=-1;if(i===n-1)ox=1;if(j===0)oz=-1;if(j===n-1)oz=1;}
        const onCollapse=(collapse===0&&ox===-1)||(collapse===1&&ox===1)||(collapse===2&&oz===-1)||(collapse===3&&oz===1);
        if(rr()>surv*(onCollapse&&k>0?0.35:1)) continue;
        const p=new THREE.Vector3(-side/2+bw/2+i*bw+(rr()-.5)*0.25,y+(rr()-.5)*0.06,-side/2+bw/2+j*bw+(rr()-.5)*0.25).applyMatrix4(rot);
        p.x+=R.x;p.z+=R.z;p.y+=by;
        const er=rr()<0.4?0.8+rr()*0.12:0.95;
        list.push({p,r:new THREE.Euler((rr()-.5)*0.1,R.rot+(rr()-.5)*0.18,(rr()-.5)*0.1),s:new THREE.Vector3(er*(0.95+rr()*0.08),er,er*(0.95+rr()*0.08)),info:[ox,oz,0,k/(R.n0-1)]});
      }
      const s=n*bw-0.9;if(s>0.1){const g=new THREE.BoxGeometry(s,bh*0.96,s);g.applyMatrix4(new THREE.Matrix4().makeRotationY(R.rot));g.translate(R.x,by+y,R.z);cores.push(g);}
    }
    // éboulis en éventail du côté effondré
    const dir=[[-1,0],[1,0],[0,-1],[0,1]][collapse];
    const dv=new THREE.Vector3(dir[0],0,dir[1]).applyMatrix4(rot);
    for(let i=0;i<10+R.n0*5;i++){
      const d=R.n0*bw*0.5+Math.pow(rr(),0.8)*(R.n0*2.2+4),sp=(rr()-.5)*1.6;
      const x=R.x+dv.x*d-dv.z*sp*d*0.6,z=R.z+dv.z*d+dv.x*sp*d*0.6;
      const s=rr()<0.5?0.35+rr()*0.35:0.75+rr()*0.25;
      list.push({p:new THREE.Vector3(x,duneH(x,z)-0.3*s+0.05,z),r:new THREE.Euler((rr()-.5)*1.2,rr()*6.28,(rr()-.5)*1.2),s:new THREE.Vector3(s,s*(0.8+rr()*0.3),s),info:[0,0,0,1]});
    }
  }
  const sg=pyr.geo.clone();pyr.addInst(sg,list);
  const sat=new THREE.InstancedMesh(sg,pyr.stone,list.length);sat.castShadow=true;sat.receiveShadow=true;
  const m4=new THREE.Matrix4();
  list.forEach((b,i)=>{sat.setMatrixAt(i,m4.compose(b.p,new THREE.Quaternion().setFromEuler(b.r),b.s));sat.setColorAt(i,pyr.tint().multiplyScalar(0.95));});
  grp.add(sat);
  const coreM=new THREE.Mesh(mergeGeometries(cores),pyr.darkCore);coreM.receiveShadow=true;grp.add(coreM);
  // filaire : arêtes des blocs
  {const eb=new THREE.EdgesGeometry(new THREE.BoxGeometry(bw-0.1,bh-0.1,bw-0.1));const ep=eb.attributes.position,EV=ep.count;
   const arr=new Float32Array(list.length*EV*3),v=new THREE.Vector3();
   list.forEach((b,i)=>{m4.compose(b.p,new THREE.Quaternion().setFromEuler(b.r),b.s);for(let e=0;e<EV;e++){v.fromBufferAttribute(ep,e).applyMatrix4(m4);arr.set([v.x,v.y,v.z],(i*EV+e)*3);}});
   const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
   const w=new THREE.LineSegments(g,REVEAL_WIRE_MAT);w.frustumCulled=false;grp.add(w);}

  return {grp,sat};
}

/* ── Relief discret autour de la pyramide : quelques pierres tombées, une bouteille, un parchemin ── */
function buildProps(pyr){
  const grp=new THREE.Group();scene.add(grp);
  const rr=mulberry32(8080);
  // pierres isolées, à demi ensablées (même pierre que la pyramide)
  const L=[[-16,14,0.55],[19,10,0.45],[-27,-14,0.7],[31,-21,0.6],[-21,-33,0.5],[12,-30,0.45]];
  const list=L.map(([x,z,s])=>({p:new THREE.Vector3(x,duneH(x,z)-0.36*s,z),r:new THREE.Euler((rr()-.5)*1.1,rr()*6.28,(rr()-.5)*1.1),s:new THREE.Vector3(s*(0.9+rr()*0.25),s*(0.8+rr()*0.3),s*(0.85+rr()*0.25)),cap:0}));
  const g=pyr.geo.clone();pyr.addInst(g,list);
  const m=new THREE.InstancedMesh(g,pyr.stone,list.length);m.castShadow=true;m.receiveShadow=true;
  const m4=new THREE.Matrix4();list.forEach((b,i)=>{m.setMatrixAt(i,m4.compose(b.p,new THREE.Quaternion().setFromEuler(b.r),b.s));m.setColorAt(i,pyr.tint().multiplyScalar(0.92));});
  grp.add(m);
  // bouteille de verre couchée, à moitié enfouie
  const bp=[[0,0],[0.07,0],[0.076,0.02],[0.076,0.2],[0.062,0.245],[0.026,0.285],[0.022,0.36],[0.027,0.372],[0.0,0.372]].map(([r,y])=>new THREE.Vector2(r*1.5,y*1.5));
  const bg=new THREE.LatheGeometry(bp,20);
  const glass=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#2c4636'),roughness:0.07,metalness:0,envMapIntensity:2.4}),{
    fDiscard:GLSL_TREVEAL,
    fEmissive:`vec3 Vb=normalize(cameraPosition-vRvW);float fr=pow(max(1.0-abs(dot(Vb,normalize(vRvN))),0.0),3.0);totalEmissiveRadiance+=uSunColor*fr*0.12;`+GLSL_TREVEAL_E},'glass');
  const bottle=new THREE.Mesh(bg,glass);
  {const x=16.5,z=17.5;bottle.position.set(x,duneH(x,z)+0.04,z);bottle.rotation.set(0.12,0.9,Math.PI/2-0.18);bottle.castShadow=true;grp.add(bottle);}
  // parchemin à demi déroulé : le bord libre frémit dans le vent
  const paper=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#e4d2ae'),roughness:0.9,side:THREE.DoubleSide}),{
    vHead:`uniform float uTime;attribute float aEdge;varying vec2 vRvU;`,
    vBegin:`transformed.y+=(sin(uTime*7.0+position.x*11.0)*0.012+sin(uTime*3.1+position.x*5.0)*0.008)*aEdge*aEdge;`,
    vMain:`vRvU=uv;`,
    fHead:`varying vec2 vRvU;`,
    fDiscard:GLSL_TREVEAL,
    fColor:`
      vec2 q=vRvU;
      float ln=step(0.55,fract(q.y*13.0))*step(0.12,q.x)*step(q.x,0.88)*step(0.1,q.y)*step(q.y,0.9);
      float wd=step(0.35,rvNoise(vec3(q.x*38.0,floor(q.y*13.0)*3.1,1.0)));
      diffuseColor.rgb*=1.0-ln*wd*0.55;
      diffuseColor.rgb*=mix(0.82,1.04,rvNoise(vec3(q*9.0,4.0)));
      diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.6,0.45,0.3),smoothstep(0.35,0.5,length(q-0.5))*0.35);`,
    fEmissive:GLSL_TREVEAL_E},'paper');
  const sh=new THREE.PlaneGeometry(0.9,0.62,18,10);sh.rotateX(-Math.PI/2);
  {const p=sh.attributes.position,e=new Float32Array(p.count);
   for(let i=0;i<p.count;i++){const z=p.getZ(i),t=(z+0.31)/0.62;e[i]=t;p.setY(i,0.012+Math.pow(t,3)*0.07+Math.sin(p.getX(i)*7)*0.006);}
   sh.setAttribute('aEdge',new THREE.BufferAttribute(e,1));sh.computeVertexNormals();}
  const roll=new THREE.CylinderGeometry(0.075,0.075,0.94,16);roll.rotateZ(Math.PI/2);roll.translate(0,0.075,-0.33);
  const scroll=new THREE.Group();
  const sm=new THREE.Mesh(sh,paper),rm=new THREE.Mesh(roll,paper);sm.castShadow=rm.castShadow=true;sm.receiveShadow=true;scroll.add(sm,rm);
  {const x=-5,z=23.5;scroll.position.set(x,duneH(x,z)-0.02,z);scroll.rotation.y=0.6;scroll.scale.setScalar(1.15);grp.add(scroll);}

}

/* ═══ 28 · Oasis : palmiers, eau, roseaux, campement de marchands ═══ */

/* ── palmier dattier : tronc écaillé et courbé, couronne de palmes arquées, jupe de palmes sèches ── */
function palmVariant(rr){
  const H=7+rr()*5,lean=(rr()-0.5)*2.2,leanZ=(rr()-0.5)*1.2;
  const trunk=new THREE.CylinderGeometry(0.21,0.32,H,10,18,true);trunk.translate(0,H/2,0);
  const tp=trunk.attributes.position;
  const bend=y=>{const t=y/H;return [lean*t*t,leanZ*t*t];};
  for(let i=0;i<tp.count;i++){const y=tp.getY(i),[bx,bz]=bend(y);tp.setX(i,tp.getX(i)+bx);tp.setZ(i,tp.getZ(i)+bz);}
  trunk.computeVertexNormals();
  const [cx,cz]=bend(H);const crown=new THREE.Vector3(cx,H,cz);
  // palmes : ruban en V, arqué sous son poids
  const pos=[],uv=[],idx=[],col=[];let base=0;
  const NF=20+Math.floor(rr()*6);
  for(let f=0;f<NF+7;f++){
    const dead=f>=NF;
    const a=(f/NF)*Math.PI*2*2.39996+rr()*0.4;
    const el=dead?-1.15-rr()*0.25:(-0.5+Math.pow(rr(),0.8)*1.35);
    const L=dead?2.0+rr()*0.8:2.8+rr()*1.4,droop=dead?0.1:0.55+rr()*0.35;
    const dh=new THREE.Vector3(Math.cos(a),0,Math.sin(a));
    const side=new THREE.Vector3(-dh.z,0,dh.x);
    const S=10;
    for(let j=0;j<=S;j++){
      const t=j/S;
      const c=crown.clone().addScaledVector(dh,Math.cos(el)*L*t+0.15).add(new THREE.Vector3(0,Math.sin(el)*L*t-droop*L*t*t-(dead?0.3:0),0));
      const w=(dead?0.32:0.62)*Math.sin(Math.min(1,t*1.15)*Math.PI*0.92+0.12)*(1-t*0.35);
      const fold=0.16*w;
      [-1,0,1].forEach(k=>{const p=c.clone().addScaledVector(side,k*w).add(new THREE.Vector3(0,k===0?-fold:fold*0.4,0));pos.push(p.x,p.y,p.z);uv.push(k,t);
        col.push(dead?0.55:0.92+rr()*0.1,dead?0.42:0.95,dead?0.28:0.75);});
    }
    for(let j=0;j<S;j++){const r0=base+j*3,r1=r0+3;idx.push(r0,r1,r0+1,r0+1,r1,r1+1,r0+1,r1+1,r0+2,r0+2,r1+1,r1+2);}
    base+=(S+1)*3;
  }
  const fr=new THREE.BufferGeometry();
  fr.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));fr.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));fr.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  fr.setIndex(idx);fr.computeVertexNormals();
  return {trunk,fronds:fr,H};
}

function buildOasis(){
  const grp=new THREE.Group();scene.add(grp);
  const O=FEAT.oasis,rr=mulberry32(5150);
  const gy=y=>y;
  /* palmiers : 3 variantes instanciées */
  const trunkMat=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#7a6650'),roughness:0.95}),{
    fDiscard:GLSL_TREVEAL,
    fColor:`float sc=fract(vRvW.y*3.2+atan(vRvN.z,vRvN.x)*0.8);diffuseColor.rgb*=mix(0.6,1.08,smoothstep(0.0,0.35,sc))*mix(0.85,1.1,rvNoise(vRvW*2.0));`,
    fEmissive:GLSL_TREVEAL_E},'palmT');
  const frondMat=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#5f7040'),roughness:0.75,side:THREE.DoubleSide,vertexColors:true}),{
    vHead:`varying vec2 vRvU;`,vMain:`vRvU=uv;`,
    fHead:`varying vec2 vRvU;`,
    fDiscard:GLSL_TREVEAL+`
      float lf=fract(vRvU.y*34.0+abs(vRvU.x)*2.4);
      float wdt=mix(0.55,0.2,vRvU.y);
      if(abs(vRvU.x)>0.08&&lf>wdt) discard;
      if(abs(vRvU.x)>0.96-0.3*vRvU.y) discard;`,
    fColor:`diffuseColor.rgb*=mix(0.7,1.1,rvNoise(vec3(vRvU*vec2(3.0,40.0),1.0)))*mix(1.0,0.75,smoothstep(0.7,1.0,vRvU.y));`,
    fEmissive:GLSL_TREVEAL_E},'palmF');
  const V=[0,1,2].map(()=>palmVariant(rr));
  const inst=[[],[],[]];
  for(let i=0;i<30;i++){
    const a=rr()*Math.PI*2,d=(i<22?21+rr()*14:34+rr()*24);
    const x=O.x+Math.cos(a)*d,z=O.z+Math.sin(a)*d;
    const s=0.85+rr()*0.35;
    inst[i%3].push(new THREE.Matrix4().compose(new THREE.Vector3(x,duneH(x,z)-0.2,z),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rr()*6.28),new THREE.Vector3(s,s,s)));
  }
  const palms=[];
  V.forEach((v,k)=>{
    const t=new THREE.InstancedMesh(v.trunk,trunkMat,inst[k].length),f=new THREE.InstancedMesh(v.fronds,frondMat,inst[k].length);
    inst[k].forEach((m,i)=>{t.setMatrixAt(i,m);f.setMatrixAt(i,m);});
    t.castShadow=true;t.receiveShadow=true;f.receiveShadow=true;grp.add(t);grp.add(f);palms.push(t,f);
  });
  /* plan d'eau : reflets du ciel, rides, fond sombre */
  const wy=-1.15;
  const water=new THREE.Mesh(new THREE.CircleGeometry(O.r*0.62,64),patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#1c3534'),roughness:0.05,metalness:0.0,envMapIntensity:1.6}),{
    fDiscard:GLSL_TREVEAL,
    fNormal:`float hw=rvNoise(vec3(vRvW.xz*0.9+uTime*0.15,uTime*0.2))*0.6+rvNoise(vec3(vRvW.xz*3.1-uTime*0.25,1.0))*0.3;normal=rvPerturb(-vViewPosition,normal,hw*0.06,1.0);`,
    fColor:`float dC=length(vRvW.xz-vec2(${O.x.toFixed(1)},${O.z.toFixed(1)}))/${(O.r*0.62).toFixed(1)};diffuseColor.rgb=mix(vec3(0.07,0.13,0.13),vec3(0.32,0.36,0.28),smoothstep(0.75,1.0,dC));`,
  },'water'));
  water.rotation.x=-Math.PI/2;water.position.set(O.x,wy,O.z);water.receiveShadow=true;grp.add(water);
  /* roseaux et buissons sur les berges */
  const reed=new THREE.ConeGeometry(0.05,1.4,4,1,true);reed.translate(0,0.7,0);
  const reedMat=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#6d7444'),roughness:0.9}),{fDiscard:GLSL_TREVEAL,fColor:`diffuseColor.rgb*=mix(0.7,1.2,rvHash(floor(vRvW*3.0)));`},'reed');
  const NR=MOBILE?240:700,reeds=new THREE.InstancedMesh(reed,reedMat,NR);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
  for(let i=0;i<NR;i++){const a=rr()*6.28,d=O.r*(0.38+rr()*0.14),x=O.x+Math.cos(a)*d,z=O.z+Math.sin(a)*d;const s=0.6+rr()*1.0;
    e.set((rr()-.5)*0.5,rr()*6,(rr()-.5)*0.5);reeds.setMatrixAt(i,m4.compose(new THREE.Vector3(x,Math.max(duneH(x,z),wy)-0.1,z),q.setFromEuler(e),new THREE.Vector3(s,s*(0.7+rr()*0.8),s)));}
  grp.add(reeds);
  const bushG=new THREE.IcosahedronGeometry(1,2);{const p=bushG.attributes.position;for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i);const n=0.75+0.4*fbm2(v.x*2+v.z,v.y*2,3);v.multiplyScalar(n);v.y=Math.max(v.y*0.7,-0.2);p.setXYZ(i,v.x,v.y,v.z);}bushG.computeVertexNormals();}
  const bushMat=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#5a6238'),roughness:0.95}),{fDiscard:GLSL_TREVEAL,fColor:`diffuseColor.rgb*=mix(0.6,1.15,rvNoise(vRvW*3.0));`,fNormal:`normal=rvPerturb(-vViewPosition,normal,rvNoise(vRvW*6.0)*0.15,1.0);`},'bush');
  const NB=60,bushes=new THREE.InstancedMesh(bushG,bushMat,NB);
  for(let i=0;i<NB;i++){const a=rr()*6.28,d=O.r*(0.62+rr()*0.7),x=O.x+Math.cos(a)*d,z=O.z+Math.sin(a)*d;const s=0.5+rr()*1.1;
    bushes.setMatrixAt(i,m4.compose(new THREE.Vector3(x,duneH(x,z)-0.1,z),q.setFromAxisAngle(new THREE.Vector3(0,1,0),rr()*6),new THREE.Vector3(s*1.3,s,s*1.2)));}
  bushes.castShadow=true;bushes.receiveShadow=true;grp.add(bushes);

  /* campement de marchands : deux tentes en poil de chèvre, feu de camp */
  const camp=new THREE.Vector3(O.x+O.r*0.95,0,O.z+O.r*0.35);camp.y=duneH(camp.x,camp.z);
  const tentMat=patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#2e2420'),roughness:1,side:THREE.DoubleSide}),{
    fDiscard:GLSL_TREVEAL,fColor:`float st=step(0.82,fract(vRvW.x*0.9+vRvW.z*0.25));diffuseColor.rgb=mix(diffuseColor.rgb,vec3(0.62,0.5,0.36),st*0.5)*mix(0.8,1.1,rvNoise(vRvW*4.0));`},'tent');
  const tents=[];
  [[0,0,0.3],[7.5,-3.5,-0.5]].forEach(([dx,dz,ry])=>{
    const g=new THREE.PlaneGeometry(8,5,16,10);g.rotateX(-Math.PI/2);const p=g.attributes.position;
    for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);
      const pole=Math.max(Math.exp(-((x-1.8)**2+z*z)/1.2)*2.2,Math.exp(-((x+1.8)**2+z*z)/1.2)*2.2,Math.exp(-(x*x+z*z)/1.4)*2.4);
      const edge=1-Math.max(Math.abs(x)/4,Math.abs(z)/2.5);
      p.setY(i,Math.min(pole+0.9,0.15+edge*2.6)*smooth(0,0.35,edge)+ (Math.abs(z)>2.3?-0.1:0));}
    g.computeVertexNormals();
    const m=new THREE.Mesh(g,tentMat);m.rotation.y=ry;m.position.set(camp.x+dx,duneH(camp.x+dx,camp.z+dz)-0.05,camp.z+dz);m.castShadow=true;m.receiveShadow=true;grp.add(m);tents.push(m);
  });
  // feu : pierres, flammes (sprites additifs), lumière qui vacille la nuit
  const fireP=new THREE.Vector3(camp.x+3.6,0,camp.z+3.2);fireP.y=duneH(fireP.x,fireP.z);
  const flameMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`uniform float uTime;varying vec2 vQ;varying float vS;attribute float aS;
      void main(){vQ=position.xy;vS=aS;vec3 up=vec3(viewMatrix[0][1],viewMatrix[1][1],viewMatrix[2][1]);vec3 rt=vec3(viewMatrix[0][0],viewMatrix[1][0],viewMatrix[2][0]);
        float fl=0.8+0.25*sin(uTime*11.0+aS*7.0)+0.15*sin(uTime*23.0+aS*3.0);
        vec3 p=(modelMatrix*vec4(0.0,0.0,0.0,1.0)).xyz+vec3(sin(aS*9.0)*0.15,0.1+aS*0.25,cos(aS*7.0)*0.15)+rt*position.x*0.5*fl+up*(position.y*0.5+0.5)*1.3*fl*(1.0-aS*0.4);
        gl_Position=projectionMatrix*viewMatrix*vec4(p,1.0);}`,
    fragmentShader:`uniform float uLantern;uniform float uTime;varying vec2 vQ;varying float vS;
      void main(){float r=length(vec2(vQ.x*1.6,(vQ.y+1.0)*0.6));float a=smoothstep(1.0,0.0,r)*(1.0-smoothstep(0.3,1.0,vQ.y))*uLantern;
        vec3 c=mix(vec3(1.0,0.35,0.08),vec3(1.0,0.85,0.5),smoothstep(0.6,0.0,r));gl_FragColor=vec4(c*a*1.6,a);}`});
  const fq=new THREE.InstancedBufferGeometry();fq.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,1,-1,0,1,1,0,-1,1,0]),3));fq.setIndex([0,1,2,0,2,3]);
  fq.setAttribute('aS',new THREE.InstancedBufferAttribute(new Float32Array([0,0.33,0.66,0.2,0.85]),1));fq.instanceCount=5;
  const flames=new THREE.Mesh(fq,flameMat);flames.position.copy(fireP);flames.frustumCulled=false;flames.renderOrder=7;grp.add(flames);
  const fireL=new THREE.PointLight(new THREE.Color('#ff8a3a'),0,26,1.6);fireL.position.copy(fireP).add(new THREE.Vector3(0,1.2,0));grp.add(fireL);
  const stoneRing=new THREE.TorusGeometry(0.75,0.18,5,10);stoneRing.rotateX(Math.PI/2);
  const ring=new THREE.Mesh(stoneRing,patch(new THREE.MeshStandardMaterial({color:new THREE.Color('#5a4c40'),roughness:1}),{fDiscard:GLSL_TREVEAL},'fring'));
  ring.position.copy(fireP).add(new THREE.Vector3(0,0.05,0));grp.add(ring);

  function update(dt,T){
    const L=U.uLantern.value;
    fireL.intensity=L*(14+4*Math.sin(T*9.0)+3*Math.sin(T*17.3)+2*Math.sin(T*31.0));
  }
  return {grp,update,fireL,fireP,camp,palms,water,tents};
}

/* ═══ 29 · Traces dans le sable ═══
   · une carte « cuite » au chargement : piste des caravanes, berges humides et herbes de l'oasis ;
   · deux cartes vivantes où chaque patte, chaque sabot imprime une empreinte qui s'efface
     lentement sous le vent (proche : animaux, au pas de la caméra ; lointaine : caravanes). */
const TRAIL={feat:null,near:null,far:null,NC:new THREE.Vector2(4,14),NE:44,FE:640,qN:[],qF:[],decT:0,ready:false};

function bakeFeatTex(){
  const N=MOBILE?512:768,E=900,d=new Uint8Array(N*N*4),O=FEAT.oasis;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const x=((i+0.5)/N*2-1)*E,z=((j+0.5)/N*2-1)*E,k=(j*N+i)*4;
    const td=trackDist(x,z);
    const dO=Math.hypot(x-O.x,z-O.z);
    d[k]=Math.round(255*smooth(7.5,1.8,td)*(0.75+0.25*vn2(x*0.2,z*0.2)));
    d[k+1]=Math.round(255*smooth(27,19,dO));
    d[k+2]=Math.round(255*smooth(O.r*1.35,O.r*0.5,dO)*(dO>O.r*0.4?1:0.4));
    d[k+3]=255;
  }
  const t=new THREE.DataTexture(d,N,N,THREE.RGBAFormat,THREE.UnsignedByteType);
  t.magFilter=THREE.LinearFilter;t.minFilter=THREE.LinearFilter;t.needsUpdate=true;
  TRAIL.feat=t;return t;
}

function initTrails(){
  const mk=n=>{const rt=new THREE.WebGLRenderTarget(n,n,{type:THREE.UnsignedByteType,depthBuffer:false,stencilBuffer:false});rt.texture.minFilter=rt.texture.magFilter=THREE.LinearFilter;return rt;};
  TRAIL.near=mk(MOBILE?512:1024);TRAIL.far=mk(MOBILE?512:1024);
  const clear=rt=>{renderer.setRenderTarget(rt);renderer.setClearColor(0x000000,0);renderer.clear(true,false,false);};
  clear(TRAIL.near);clear(TRAIL.far);renderer.setRenderTarget(null);renderer.setClearColor(0x000000,1);
  // empreintes : quads instanciés, écrits en « max » (R = creux, G = bourrelet)
  const MAXS=256;
  const g=new THREE.InstancedBufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1,-1,0,1,-1,0,1,1,0,-1,1,0]),3));g.setIndex([0,1,2,0,2,3]);
  const aS=new THREE.InstancedBufferAttribute(new Float32Array(MAXS*4),4);aS.setUsage(THREE.DynamicDrawUsage);
  const aK=new THREE.InstancedBufferAttribute(new Float32Array(MAXS*2),2);aK.setUsage(THREE.DynamicDrawUsage);
  g.setAttribute('aS',aS);g.setAttribute('aK',aK);g.instanceCount=0;
  const sm=new THREE.ShaderMaterial({uniforms:{uC:{value:new THREE.Vector2()},uE:{value:1}},depthTest:false,depthWrite:false,transparent:true,
    blending:THREE.CustomBlending,blendEquation:THREE.MaxEquation,blendEquationAlpha:THREE.MaxEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,
    vertexShader:`uniform vec2 uC;uniform float uE;attribute vec4 aS;attribute vec2 aK;varying vec2 vQ;varying vec2 vK;
      void main(){vQ=position.xy;vK=aK;float c=cos(aS.w),s=sin(aS.w);vec2 q=position.xy*vec2(aS.z*0.62,aS.z);q=vec2(c*q.x-s*q.y,s*q.x+c*q.y)*1.35;
        vec2 w=aS.xy+q;gl_Position=vec4((w-uC)/uE,0.0,1.0);}`,
    fragmentShader:`varying vec2 vQ;varying vec2 vK;
      void main(){float r=length(vQ*1.35);float pit=smoothstep(0.78,0.2,r)*vK.x;float rim=smoothstep(0.62,0.85,r)*smoothstep(1.3,0.9,r)*vK.x*0.8;
        if(vK.y>0.5){pit=smoothstep(1.0,0.0,r)*vK.x;rim=0.0;}
        gl_FragColor=vec4(pit,rim,0.0,1.0);}`});
  const stamps=new THREE.Mesh(g,sm);stamps.frustumCulled=false;
  const decM=new THREE.ShaderMaterial({uniforms:{uD:{value:1/255}},depthTest:false,depthWrite:false,transparent:true,
    blending:THREE.CustomBlending,blendEquation:THREE.ReverseSubtractEquation,blendEquationAlpha:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,blendSrcAlpha:THREE.ZeroFactor,blendDstAlpha:THREE.OneFactor,
    vertexShader:`void main(){gl_Position=vec4(position.xy*2.0,0.0,1.0);}`,
    fragmentShader:`uniform float uD;void main(){gl_FragColor=vec4(uD,uD,0.0,0.0);}`});
  const dec=new THREE.Mesh(new THREE.PlaneGeometry(1,1),decM);dec.frustumCulled=false;
  TRAIL.scene=new THREE.Scene();TRAIL.scene.add(dec,stamps);TRAIL.cam=new THREE.Camera();TRAIL.stamps=stamps;TRAIL.dec=dec;TRAIL.aS=aS;TRAIL.aK=aK;TRAIL.MAXS=MAXS;
  TRAIL.ready=true;
}
/* x,z monde ; r rayon (m) ; ang orientation ; k intensité ; blob=1 pour une trace diffuse */
function trailStamp(x,z,r,ang,k,blob=0){
  if(!TRAIL.ready) return;
  if(Math.abs(x-TRAIL.NC.x)<TRAIL.NE&&Math.abs(z-TRAIL.NC.y)<TRAIL.NE&&TRAIL.qN.length<200) TRAIL.qN.push([x,z,r,ang,k,blob]);
  if(Math.abs(x)<TRAIL.FE&&Math.abs(z)<TRAIL.FE&&TRAIL.qF.length<200&&(r>0.2||blob)) TRAIL.qF.push([x,z,Math.max(r,1.0),ang,k*0.8,1]);
}
function trailsFlush(dt){
  if(!TRAIL.ready) return;
  TRAIL.decT+=dt;
  const doDec=TRAIL.decT>1.2;if(doDec)TRAIL.decT=0;
  if(!TRAIL.qN.length&&!TRAIL.qF.length&&!doDec) return;
  const ac=renderer.autoClear;renderer.autoClear=false;
  const pass=(rt,q,cx,cz,E)=>{
    if(!q.length&&!doDec) return;
    renderer.setRenderTarget(rt);
    TRAIL.dec.visible=doDec;TRAIL.stamps.visible=q.length>0;
    if(q.length){
      const n=Math.min(q.length,TRAIL.MAXS);
      for(let i=0;i<n;i++){const s=q[i];TRAIL.aS.setXYZW(i,s[0],s[1],s[2],s[3]);TRAIL.aK.setXY(i,s[4],s[5]);}
      TRAIL.aS.needsUpdate=true;TRAIL.aK.needsUpdate=true;TRAIL.stamps.geometry.instanceCount=n;
      TRAIL.stamps.material.uniforms.uC.value.set(cx,cz);TRAIL.stamps.material.uniforms.uE.value=E;
    }
    renderer.render(TRAIL.scene,TRAIL.cam);
    q.length=0;
  };
  pass(TRAIL.near,TRAIL.qN,TRAIL.NC.x,TRAIL.NC.y,TRAIL.NE);
  pass(TRAIL.far,TRAIL.qF,0,0,TRAIL.FE);
  renderer.setRenderTarget(null);renderer.autoClear=ac;
}

/* ═══ 29b · Lanternes des marchands ═══
   Les caravanes portent des lanternes marocaines : laiton ajouré (étoiles à huit branches), verres

   dromadaire en porte une, pendue au bât, qui se balance au rythme de l'amble. À la tombée du jour

const CARAV_L={geo:null,mats:null,list:new Set(),LU:{uLantK:{value:0}},poolG:null};

/* placement : point d'accroche (x,y,z), direction de marche (hx,hz), phase de l'allure */
function placeCaravanLantern(L,x,y,z,hx,hz,ph,amp){
  L.g.position.set(x,y,z);
  const sw=Math.sin(ph)*amp,sw2=Math.sin(ph*0.5+L.ph)*amp*0.55;

  const gy=duneH(x,z)+0.07;L.pool.position.set(0,gy-y,0);L.poolU.uH.value=Math.max(0,y-gy);
}
function buildLanterns(){
  // deux lumières mobiles, données aux lanternes allumées les plus proches de la caméra
  const lights=[0,1].map(()=>{const L=new THREE.PointLight(new THREE.Color('#ffffff'),0,10,1.5);scene.add(L);return L;});
  let k0=0;const _w=new THREE.Vector3();
  function update(dt,T,cam){
    const L=TOD.cur.lantern||0;k0+=((ZONE==='desert'?L:0)-k0)*Math.min(1,dt*1.5);
    CARAV_L.LU.uLantK.value=k0;
    const near=[];
    CARAV_L.list.forEach(l=>{if(!l.g.parent||!l.g.visible)return;l.glow.getWorldPosition(_w);near.push([_w.distanceToSquared(cam.position),_w.clone(),l]);});
    near.sort((a,b)=>a[0]-b[0]);
    lights.forEach((li,i)=>{const n=near[i];if(!n||k0<0.01){li.intensity=0;return;}li.position.copy(n[1]);li.color.copy(n[2].col);
      li.intensity=k0*(7+1.2*Math.sin(T*9.1+i*2.3)+0.6*Math.sin(T*21.7+i));});
  }
  return {update,lights};
}

/* ═══ 30 · Vie du désert ═══
   · caravanes de dromadaires et de marchands sur la piste, au loin (lanternes la nuit) ;
   · petits animaux au premier plan : fennec, chat des sables, gerboise. Ils hésitent,
     s'arrêtent, regardent la pyramide puis la caméra, flairent le sable, repartent —
     et chaque patte laisse son empreinte.
   Les corps sont sculptés en champs de distance (formes organiques lisses), maillés
   (surface nets), puis animés par un squelette procédural. */

/* ─────────── Champs de distance → maillage ─────────── */
const SDF={
  ell(p,c,r,R){let x=p[0]-c[0],y=p[1]-c[1],z=p[2]-c[2];if(R){const a=R;const X=a[0]*x+a[3]*y+a[6]*z,Y=a[1]*x+a[4]*y+a[7]*z,Z=a[2]*x+a[5]*y+a[8]*z;x=X;y=Y;z=Z;}
    const k0=Math.hypot(x/r[0],y/r[1],z/r[2]),k1=Math.hypot(x/(r[0]*r[0]),y/(r[1]*r[1]),z/(r[2]*r[2]));return k1<1e-9?-Math.min(...r):k0*(k0-1)/k1;},
  cap(p,a,b,ra,rb){const bx=b[0]-a[0],by=b[1]-a[1],bz=b[2]-a[2],px=p[0]-a[0],py=p[1]-a[1],pz=p[2]-a[2];

function rigField(prims,p){let d=1e9;for(const P of prims){
    // élagage : si la primitive est sûrement plus loin que le minimum courant (+ marge de fondu), on la saute
    const dx=p[0]-P.bc[0],dy=p[1]-P.bc[1],dz=p[2]-P.bc[2];const lb=Math.sqrt(dx*dx+dy*dy+dz*dz)-P.br;
    if(lb>d+P.k) continue;

/* surface nets : un sommet par cellule traversée, un quad par arête traversée */
function sdfMesh(f,b0,b1,cell){

  for(let k=1;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=1;i<nx-1;i++){const v0=V[id(i,j,k)],v1=V[id(i,j+1,k)];if((v0<0)!==(v1<0))quad(vid[cid(i-1,j,k-1)],vid[cid(i-1,j,k)],vid[cid(i,j,k)],vid[cid(i,j,k-1)],v0>=0);}

  // lissage (Laplacien, 2 passes) : efface l'escalier des voxels
  {const n=pos.length/3,acc=new Float32Array(n*3),cnt=new Float32Array(n);

     for(let t=0;t<idx.length;t+=3)for(let q=0;q<3;q++){const a=idx[t+q],b=idx[t+(q+1)%3];for(let c=0;c<3;c++){acc[a*3+c]+=pos[b*3+c];acc[b*3+c]+=pos[a*3+c];}cnt[a]++;cnt[b]++;}
     for(let v=0;v<n;v++)if(cnt[v])for(let c=0;c<3;c++)pos[v*3+c]+=(acc[v*3+c]/cnt[v]-pos[v*3+c])*0.55;}}

  const nor=new Float32Array(pos.length),e=cell*0.5;

    const gx=f([p[0]+e,p[1],p[2]])-f([p[0]-e,p[1],p[2]]),gy=f([p[0],p[1]+e,p[2]])-f([p[0],p[1]-e,p[2]]),gz=f([p[0],p[1],p[2]+e])-f([p[0],p[1],p[2]-e]);

/* rig : primitives + os → géométrie skinnée (2 os par sommet), couleurs par sommet */

      look:new THREE.Vector2(),lookT:new THREE.Vector2(),feet:[0,0,0,0],events:kind==='scorpion'?['cam']:['pyr','cam'],hop:0,ear:0,earK:0,trot:0,t:0,tail:0,pinch:0,

      const edge=1-Math.max(Math.abs(x)/3.5,Math.abs(z)/2.2);p.setY(i,Math.min(pole+0.8,0.15+edge*2.5)*smooth(0,0.35,edge)*sz);}
    g.computeVertexNormals();const m=new THREE.Mesh(g,tentMat2);m.rotation.y=ry;m.position.set(dx,duneH(CAMP.x+dx,CAMP.z+dz)-CAMP.y-0.05,dz);m.castShadow=true;m.receiveShadow=true;camp.add(m);});
  const flame2=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`uniform float uTime;varying vec2 vQ;void main(){vQ=position.xy;vec4 mv=modelViewMatrix*vec4(0.0,0.6,0.0,1.0);float f=0.85+0.2*sin(uTime*12.0)+0.1*sin(uTime*27.0);mv.xy+=position.xy*vec2(1.3,1.9)*f;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`uniform float uLantern;varying vec2 vQ;void main(){float r=length(vQ*vec2(1.0,0.8));float a=(exp(-r*r*18.0)*1.8+exp(-r*r*3.0)*0.35)*uLantern;gl_FragColor=vec4(mix(vec3(1.0,0.4,0.1),vec3(1.0,0.8,0.45),exp(-r*r*30.0))*a,a);}`}));
  flame2.frustumCulled=false;flame2.renderOrder=7;camp.add(flame2);
  const campL=new THREE.PointLight(new THREE.Color('#ff8f42'),0,24,1.7);campL.position.set(0,1.2,0);camp.add(campL);
  const sitters=[];
  [['man',[-1.6,0.3],0.4,'sit'],['manB',[1.4,-0.6],-2.6,'sit'],['manC',[0.3,1.7],-1.5,'stand'],['man',[0,0],0,'walk'],['manB',[-0.8,-1.8],1.2,'stand']].forEach(([k,[x,z],ry,pose],i)=>{
    const sk=makeSkinned(R[k],SPEC[k],matC);sk.mesh.position.set(x,duneH(CAMP.x+x,CAMP.z+z)-CAMP.y,z);sk.mesh.rotation.y=ry;camp.add(sk.mesh);
    const o={sk,pose,ph:rand()*6,x,z,ry,lan:null};if(pose==='walk'){o.lan=lanternSprite();camp.add(o.lan);}sitters.push(o);});
  function updateCamp(dt,T){
    const L=U.uLantern.value,on=L>0.15;
    camp.visible=on;if(!on){campL.intensity=0;return;}
    campL.intensity=L*(16+4*Math.sin(T*9.3)+3*Math.sin(T*17.1));
    sitters.forEach((o,i)=>{const B=o.sk.bones,S=1.43;
      if(o.pose==='sit'){B.root.position.y=0.9*S-0.55;B.root.rotation.x=Math.sin(T*0.7+i)*0.03;B.armL.rotation.z=0.5+Math.sin(T*0.9+i)*0.1;B.armR.rotation.z=0.6+Math.sin(T*1.3+i*2)*0.25;B.head.rotation.y=Math.sin(T*0.4+i)*0.4;}
      else if(o.pose==='stand'){B.root.position.y=0.9*S;B.armR.rotation.z=0.3+Math.max(0,Math.sin(T*1.1+i))*0.9;B.armL.rotation.z=0.1;B.head.rotation.y=Math.sin(T*0.5+i)*0.5;}

        const w=Math.sin(T*5.2);B.root.position.y=0.9*S+Math.abs(Math.cos(T*5.2))*0.04;B.armL.rotation.z=w*0.35;B.armR.rotation.z=0.25;
        o.sk.mesh.updateMatrixWorld(true);o.lan.position.set(0.12*S,-0.43*S,-0.04*S).applyMatrix4(B.armR.matrixWorld);camp.worldToLocal(o.lan.position);o.lan.position.y-=0.22;}
    });
  }

  function update(dt,T,on){updateCaravans(dt,T,on);updateAnimals(dt,T,on);updateWalkers(dt,T,on);updateCamp(dt,T);}
  /* aperçus et tests */
  function startNow(kind){spawnCritter(kind,true);}
  function playScene(n,quick){return n==='hunt'?sceneHunt():n==='leap'?sceneLeap(quick):sceneSleep(null,quick);}

  return {grp,update,caravans,spawnCaravan,popCaravan,debugPlace,startNow,scene:playScene,spawnWalkers,walkers,agents,R,sMid:S_MID,campL};
}

/* ═══ 32 · Mer de nuages (transition désert → glace) ═══
   Quand la caméra s'élève au-dessus du désert, des couches de nuages se forment sous elle et
   finissent par engloutir la pyramide. Chaque couche n'apparaît que si la caméra est au-dessus
   (jamais de plafond nuageux vu depuis le sol) ; la couverture est pilotée par le scroll.
   Coût : quelques plans plein écran, bruit lu dans la texture 3D, rien quand la couverture est nulle. */
function buildCloudSea(){
  const LAYERS=[{y:46,a:0.55,s:1.0},{y:62,a:0.7,s:1.35},{y:78,a:0.8,s:1.8},{y:96,a:0.9,s:2.3},{y:116,a:1.0,s:2.9}];
  const grp=new THREE.Group();grp.visible=false;
  const CU={uCov:{value:0},uCamY:{value:0},uLit:{value:new THREE.Color('#fff4e6')},uShade:{value:new THREE.Color('#b9a99a')}};
  const geo=new THREE.PlaneGeometry(2600,2600,1,1);geo.rotateX(-Math.PI/2);
  const mats=LAYERS.map((L,i)=>{
    const u=Object.assign({uLayerY:{value:L.y},uLayerA:{value:L.a},uSeed:{value:i*17.3},uScale:{value:L.s}},CU,U);
    const m=new THREE.ShaderMaterial({uniforms:u,transparent:true,depthWrite:false,side:THREE.DoubleSide,
      vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
      fragmentShader:"#define RV_FRAG\n"+GLSL_NOISE+`
        uniform float uCov;uniform float uCamY;uniform vec3 uLit;uniform vec3 uShade;uniform float uLayerY;uniform float uLayerA;uniform float uSeed;uniform float uScale;
        uniform float uTime;uniform vec2 uWind;uniform vec3 uFogColor;uniform float uFogDensity;uniform vec3 uSunDir;
        varying vec3 vW;
        void main(){
          // la couche n'existe que sous la caméra
          float above=smoothstep(8.0,40.0,uCamY-uLayerY);
          float cov=clamp(uCov*1.25-uSeed*0.004,0.0,1.0)*above;
          if(cov<0.002) discard;
          vec2 p=vW.xz/uScale+uWind*uTime*2.2+vec2(uSeed*13.1,uSeed*7.7);
          // cumulus : masses de ~80 m, bords nets, détail fin
          float n=rvFbm3(vec3(p*0.011,uSeed+uTime*0.01))*0.72+rvNoise(vec3(p*0.047,uSeed*2.0))*0.28;
          float d=smoothstep(1.02-cov,1.12-cov,n);
          float r=length(vW.xz-cameraPosition.xz);
          d*=1.0-smoothstep(900.0,1250.0,r);
          float a=d*uLayerA;
          if(a<0.004) discard;
          // éclairage : on compare le bruit vers le soleil (bords exposés clairs, revers dans l'ombre)
          vec2 sd=normalize(uSunDir.xz+vec2(1e-4))*16.0;
          float n2=rvFbm3(vec3((p+sd)*0.011,uSeed+uTime*0.01))*0.72+rvNoise(vec3((p+sd)*0.047,uSeed*2.0))*0.28;
          float lit=clamp(0.5+(n-n2)*4.5+0.3*(d-0.5),0.0,1.0);
          lit=mix(lit,1.0,0.25*smoothstep(0.0,0.5,uSunDir.y));
          vec3 col=mix(uShade,uLit,lit);
          float dist=length(cameraPosition-vW);
          col=mix(col,uFogColor,(1.0-exp(-dist*uFogDensity*0.5))*0.85);
          gl_FragColor=vec4(col,a);
        }`});
    const mesh=new THREE.Mesh(geo,m);mesh.position.y=L.y;mesh.renderOrder=12+i;mesh.frustumCulled=false;grp.add(mesh);   // après lanternes et flammes, couche basse → haute
    return m;
  });
  scene.add(grp);
  const _c=new THREE.Color();
  function update(cov,cam){
    CU.uCov.value=cov;CU.uCamY.value=cam.position.y;grp.visible=cov>0.001;
    // couleur des nuages : lumière du soleil de l'heure, ombre tirée du brouillard
    const c=TOD.cur;
    CU.uLit.value.copy(c.sunCol).lerp(_c.set('#ffffff'),0.55).multiplyScalar(Math.min(1.15,0.55+0.18*c.sunI)*c.lum+0.12);
    CU.uShade.value.copy(c.fog).lerp(c.hemiSky,0.5).multiplyScalar(0.74);
  }
  return {grp,update,CU,mats};
}

/* ═══ 33 · Éclatement de la glace (≥ 75 % pour un bloc, ≥ 50 % pour un livre) ═══
   Une centaine d'éclats de cristal (même verre que la glace) partent du cœur, tournoient dans
   l'espace sans pesanteur, ralentis par une traînée douce, puis s'évanouissent. Plusieurs
   éclatements peuvent se chevaucher (les éclats sont pris à tour de rôle dans une réserve).
   Au repos, le maillage garde un éclat invisible : son programme est compilé pendant le
   préchauffage (pas d'à-coup au premier éclatement). */
function buildShatter(parent,N,opts){
  N=N||(MOBILE?60:110);opts=opts||{};
  // éclat : icosaèdre facetté, déformé par instance (aiguilles, plaquettes, blocs)
  const g=new THREE.IcosahedronGeometry(1,0);g.computeVertexNormals();
  const mat=opts.mat||new THREE.MeshPhysicalMaterial({color:new THREE.Color('#efe7dc'),metalness:0,roughness:0.1,transmission:0.78,thickness:0.5,ior:1.31,
    attenuationColor:new THREE.Color('#dcc4a4'),attenuationDistance:1.6,specularIntensity:1,clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:1.8,flatShading:true});
  const GRAV=opts.gravity||0,FLOOR=opts.floor===undefined?-1e9:opts.floor;
  const mesh=new THREE.InstancedMesh(g,mat,N);mesh.frustumCulled=false;mesh.renderOrder=3;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  parent.add(mesh);
  const S=[];for(let i=0;i<N;i++)S.push({p:new THREE.Vector3(),v:new THREE.Vector3(),q:new THREE.Quaternion(),w:new THREE.Vector3(),s:new THREE.Vector3(),life:1,t:-1});
  const DUR=2.8;let cur=0,active=0;
  const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),_c=new THREE.Vector3();
  const zero=new THREE.Matrix4().makeScale(0,0,0);
  for(let i=0;i<N;i++)mesh.setMatrixAt(i,zero);
  mesh.instanceMatrix.needsUpdate=true;mesh.count=1;
  /* fire(centre, demi-axes, repère local→monde, nombre, vitesse) : éclats répartis dans l'ellipsoïde */
  function fire(center,half,content,count,speed){
    count=Math.min(N,count||N);speed=speed||1;
    content.updateMatrixWorld(true);parent.updateMatrixWorld(true);
    _c.copy(center);content.localToWorld(_c);parent.worldToLocal(_c);
    for(let n=0;n<count;n++){
      const o=S[cur];cur=(cur+1)%N;
      let d;do{d=new THREE.Vector3(rand()*2-1,rand()*2-1,rand()*2-1);}while(d.lengthSq()>1);
      const r=Math.pow(rand(),0.35);
      _v.set(center.x+d.x*half.x*r,center.y+d.y*half.y*r,center.z+d.z*half.z*r);content.localToWorld(_v);parent.worldToLocal(_v);
      o.p.copy(_v);
      const dir=_v.clone().sub(_c);if(dir.lengthSq()<1e-4)dir.set(rand()-0.5,rand()-0.5,rand()-0.5);dir.normalize();
      o.v.copy(dir).multiplyScalar((2.6+rand()*4.2)*speed).add(new THREE.Vector3(rand()-0.5,rand()*0.6,rand()-0.5).multiplyScalar(1.4*speed));
      o.q.setFromEuler(_e.set(rand()*6.28,rand()*6.28,rand()*6.28));
      o.w.set(rand()-0.5,rand()-0.5,rand()-0.5).multiplyScalar(9);
      const k=rand(),sz=(0.07+Math.pow(rand(),2.2)*0.34)*Math.min(1.2,0.5+0.5*Math.max(half.x,half.y));
      if(k<0.3)o.s.set(sz*0.35,sz*1.9,sz*0.4);         // aiguilles
      else if(k<0.6)o.s.set(sz*1.4,sz*0.28,sz*1.1);     // plaquettes
      else o.s.set(sz,sz*0.8,sz*0.9);                   // blocs
      o.life=0.75+rand()*0.25;o.t=0;
    }
    mesh.count=N;
  }
  function update(dt){
    let any=false;const drag=Math.exp(-dt*1.35);
    for(let i=0;i<N;i++){
      const o=S[i];if(o.t<0)continue;
      o.t+=dt;const T=o.t/DUR;
      if(T>=1){o.t=-1;mesh.setMatrixAt(i,zero);continue;}
      any=true;
      o.v.multiplyScalar(drag);o.v.y-=GRAV*dt;o.p.addScaledVector(o.v,dt);

   l'écran. Les reliefs sont calculés dans le monde (pas de blocs de 2×2 pixels), les joints

/* ── sol pavé de château : pierres de taille en rangs décalés ; autour de chaque pilier une

function cavePavingMat(kind,pilU,RX,RZ){
  const ice=kind==='ice';
  return patch(new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.7,metalness:0}),{
    uniforms:{uPil:pilU,uStA:{value:new THREE.Color(ice?'#555c64':'#5b4b3e')},uStB:{value:new THREE.Color(ice?'#8c939a':'#8f7a63')},
      uJoint:{value:new THREE.Color(ice?'#c9d8e2':'#8f6f4c')},uJointK:{value:ice?0.28:0.55},uSand:{value:ice?0:1},uRad:{value:new THREE.Vector2(RX,RZ)},uWet:{value:ice?1:0}},
    fHead:`uniform vec4 uPil[8];uniform vec3 uStA;uniform vec3 uStB;uniform vec3 uJoint;uniform float uJointK;uniform float uSand;uniform vec2 uRad;uniform float uWet;
      float rvPd=1.0;float rvPid=0.0;vec2 rvPg=vec2(0.0);float rvAO=1.0;float rvPJ=0.0;float rvDrift=0.0;float rvPh=0.0;
      void rvAshlar(vec2 p){
        float rh=0.62;float row=floor(p.y/rh);float fz=p.y-row*rh;
        float L=0.72+0.7*rvHash(vec3(row,3.0,1.0));
        float x=p.x+rvHash(vec3(row,1.0,7.0))*3.0;float col=floor(x/L);float fx=x-col*L;
        float id=row*131.0+col;

        if(rvHash(vec3(id,2.0,5.0))<0.33){float hz=rh*0.5;if(fz>hz){fz-=hz;id+=0.5;}rh=hz;}
        float dx=min(fx,L-fx),dz=min(fz,rh-fz);

        rvPg=dx<dz?vec2(fx<L*0.5?1.0:-1.0,0.0):vec2(0.0,fz<rh*0.5?1.0:-1.0);}
      void rvRoundS(vec2 q,float R,float sd){
        float r=length(q),a=atan(q.y,q.x);float r1=R*0.58;
        vec2 er=q/max(r,1e-4),et=vec2(-er.y,er.x);
        if(r<r1){rvPd=r1-r;rvPid=900.0+sd*41.0;rvPg=-er;return;}
        float n=max(7.0,floor(6.2832*(r1+R)*0.5/0.4));

    fColor:`{vec2 p=vRvW.xz;rvPave(p);
      float aa=max(fwidth(rvPd),1e-4)*0.75;float jw=0.013+(rvNoise(vec3(p*3.0,1.0))-0.5)*0.008;
      rvPJ=1.0-smoothstep(jw-aa,jw+aa,rvPd);

      vec3 st=mix(uStA,uStB,h*0.7+0.3*rvFbm3(vec3(p*0.7,h*13.0)));

      vec3 c=mix(st,mix(st*0.2,jc,uJointK),rvPJ);
      float er=length(p/uRad);

      float fr=(1.0-uSand)*clamp(smoothstep(0.64,0.82,rvFbm3(vec3(p*0.8,9.0)))*0.55+smoothstep(0.7,0.95,er)*0.7,0.0,1.0)*(1.0-rvPJ*0.5);
      c=mix(c,vec3(0.80,0.87,0.92)*mix(0.85,1.0,rvNoise(vec3(p*30.0,4.0))),fr*0.6);rvDrift=fr*0.5;
      float sdr=uSand*smoothstep(0.6,0.92,er+(rvFbm3(vec3(p*0.6,8.0))-0.5)*0.32);
